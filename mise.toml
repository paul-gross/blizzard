[tools]
uv = "0.11.21"
vale = "3.22.0"
node = "22.23.3"

[tasks.install]
description = "Install dependencies"
run = "uv sync"

[tasks.test]
description = "Run the default unit + component suite, parallelized (pytest-xdist)"
run = "uv run pytest -n auto"

[tasks.e2e]
description = "Run the standing e2e smoke suite — full-stack scenarios (see blizzard-context:/verification/blizzard.md for the current scenario roster) self-managed over forge+hub+runner + a minted blizzard-mock fixture; needs the sibling blizzard-mock worktree provisioned (winter provision <env>), and the browser scenarios also need Chromium (uv run playwright install chromium) — they skip cleanly without it. The pinned otelcol-contrib (~390 MB, fetched on first run) is on PATH for the scenarios' fleet-trace subtests; outside this task they skip cleanly unless BLIZZARD_OTELCOL names a collector"
# The browser scenario drives the *built* bundle that `blizzard hub host` serves out of
# src/blizzard/static/, not the sources — so a stale bundle does not fail loudly, it
# silently tests the previous UI and can go green against a layout that no longer
# exists. Depending on web-build makes that unfireable; three separate sessions
# rediscovered it by hand when this was documented prose instead.
depends = ["web-build"]
# The same pin as `collector-config-check`, kept beside it — change both together.
tools = { "github:open-telemetry/opentelemetry-collector-releases" = { version = "0.162.0", asset_pattern = "otelcol-contrib_*", bin = "otelcol-contrib" } }
run = "BLIZZARD_E2E=1 uv run pytest tests/e2e/"

[tasks.crash-sweep]
description = "Run the FULL kill-9 crash sweep (blizzard:crash-sweep) — arms EVERY crash-point-registry point in turn, SIGKILLs the owning daemon there, and asserts the invariant checker + exactly-once delivery after recovery; needs the sibling blizzard-mock worktree provisioned (winter provision <env>)"
run = "BLIZZARD_CRASH_SWEEP=1 uv run pytest -n auto -m crash_sweep tests/crash/"

[tasks.crash-sweep-ci]
description = "Run the kill-9 crash sweep's bounded CI profile (BLIZZARD_CRASH_SWEEP_CI=1) — a representative crash-point subset (one per boundary family + the recovery-critical windows) plus the whole-process cases, so the `pr` and `push` gates both stay real at bounded GitHub-runner runtime. The FULL sweep is `mise run crash-sweep`."
run = "BLIZZARD_CRASH_SWEEP=1 BLIZZARD_CRASH_SWEEP_CI=1 uv run pytest -n auto -m crash_sweep tests/crash/"

[tasks.journey]
description = "Run the capstone MVP acceptance-journey rehearsal (blizzard:journey) — the whole MVP acceptance journey end to end over real host daemons: five issues in (two grouped, the riskiest reordered to the top), an autonomous build→review→deliver night exhibiting a clean multi-repo land, a review-fail loop, an ask that parks and is answered, and a genuine failure that escalates, a mid-run SIGKILL reboot of both daemons, and the morning-after assertions (merged to bare main, full hub history+artifacts, resumed-without-takeover, nothing worked twice, no orphaned env, truthful `hub status`). Winter-free (the basic provider), so it runs in CI; needs the sibling blizzard-mock worktree provisioned (winter provision <env>) when run locally"
run = "BLIZZARD_JOURNEY=1 uv run pytest -m journey tests/journey/"

[tasks.store-baseline]
description = "Run the store baseline proof (blizzard:store-baseline) — a folded baseline revision builds exactly the store the floor release's own published history builds, for the hub and the runner, on SQLite and Postgres: same schema, same rows (minted ids and stamped instants read as such). Skips until a tree declares a BASELINE_FLOOR. Inputs: BLIZZARD_STORE_BASELINE_PG_URL (a Postgres server; unset skips the Postgres legs, and fails under CI). Needs `gh` access to download the floor's wheel (GH_TOKEN, and GH_REPO outside a GitHub checkout)"
run = "BLIZZARD_STORE_BASELINE=1 uv run --extra postgres pytest -m store_baseline tests/test_store_baseline.py"

[tasks.rehearsal]
description = "Run the upgrade rehearsal (blizzard:rehearsal) — each supported release's own published hub and runner, seeded through the mock-data CLI, upgraded hub first to the candidate while the old runner keeps landing work, then the runner, then both stores walked down to the release and forward again. Inputs: BLIZZARD_REHEARSAL_BASELINE (one tag; default every supported release), BLIZZARD_REHEARSAL_CANDIDATE (a directory holding the wheel and its -requirements-pg.txt; default a fresh build), BLIZZARD_REHEARSAL_PG_URL (a Postgres server; unset skips the Postgres backend), BLIZZARD_REHEARSAL_ROOT (where each leg's daemon dirs and logs go). Needs `gh` access and the sibling blizzard-mock worktree provisioned (winter provision <env>)"
run = "scripts/rehearsal.sh"

[tasks.winter-binding]
description = "Run the winter-binding tier (blizzard:winter-binding) — the winter workspace provider against the real winter CLI, plus one chunk landed end to end over provider=\"winter\". Local-only, never run in CI: it needs BLIZZARD_WINTER_BINDING=1 (set by this task), a winter source (BLIZZARD_MOCK_WINTER_SOURCE, else the enclosing winter workspace), and the sibling blizzard-mock worktree provisioned (winter provision <env>)"
run = "BLIZZARD_WINTER_BINDING=1 uv run pytest -m winter_binding tests/winter/"

[tasks.service-test]
description = "Run the service tier's pytest half — the cases whose subject is Python itself; the Playwright half is `mise run playwright`. A running daemon's HTTP API exercised from outside with the counterpart mocked: the runner against the mock hub (unreachable→buffered, dropped-ack→idempotent, stale-envelope). The hub against the mock runner + mock forge runs in the Playwright half. sqlite only, no tokens/network; needs the sibling blizzard-mock worktree provisioned (winter provision <env>) — skips cleanly without it"
run = "BLIZZARD_SERVICE=1 uv run pytest -n auto tests/service/"

[tasks.playwright]
description = "Run the Playwright package (tests/) — the service projects, and later the UI project; arguments after -- pass to playwright test"
dir = "tests"
run = "npx playwright test"

[tasks.playwright-check]
description = "Run the Playwright package's static checks (the gate's `playwright static` job): npm ci when node_modules is stale, tsc, eslint, and the wire-type regenerate-and-diff"
run = "scripts/playwright-check.sh"

[tasks.sse-contract]
description = "blizzard:sse-contract — gate the SSE frame shape contract (issue #235, broadened to the runner in blizzard#317): the Python producer+parse suite against contracts/sse/'s golden corpus (hub top-level + runner/ scope), then fleet's contract spec driving the same goldens through the real SseService/FetchEventSource transport"
run = "uv run pytest tests/test_sse_contract.py && (cd web && npx ng test fleet --include='**/sse-contract.spec.ts')"

[tasks.prose-check]
description = "blizzard:prose-ratchet — fail on comment/docstring prose growth over the committed baseline, or any block over its bzh:prose-budget cap"
run = "uv run python scripts/prose_density.py check --blocks src tests ../blizzard-mock/src ../blizzard-mock/tests"

[tasks.restatement-check]
description = "blizzard:restatement-sweep — fail when a fact is stated at an undeclared site (new), a declared site is no longer observed (stale), a declared non-owner site carries no reason, or a designated owner does not actually state its fact"
run = "uv run python scripts/restated_invariants.py check --strict --owners --context-root ../blizzard-context src tests docs README.md web/projects ../blizzard-mock/src ../blizzard-context/verification/blizzard/gaps.md ../blizzard-context/verification/blizzard/manual.md ../blizzard-context/verification/blizzard.md"

[tasks.pointer-check]
description = "blizzard:pointer-check — fail when a repo-root path (src/, tests/, scripts/, docs/, …) named in the docstrings, full-line or trailing comments of a tracked .py file under src/, tests/, scripts/ or exemplars/python/ is not a tracked file or directory, or an entry in scripts/repo-pointers-exemptions.json is exceeded or stale; never checks Markdown, TypeScript or YAML, symbols or anchors, or another repo's paths"
run = "uv run python scripts/repo_pointers.py check"

[tasks.exemplar-check]
description = "blizzard:exemplar-check — the web exemplars held to the hub app's gates: Angular strict-template type-checking against the real hub app, the hub's eslint config, the stand-in client's drift from openapi-ts over the exemplar router, their specs, and the web structural gate (the Python exemplars ride blizzard:lint, blizzard:typecheck, and the pytest tiers)"
run = "web/scripts/exemplar-check.sh"

[tasks.structural-gate]
description = "blizzard:structural-gate — the ast-grep structural channel (contracts/ast-grep/), gated on a reintroduced violation, a stale `# ast-grep-ignore`, and a rule-tests fixture regression alike"
run = "uv run ast-grep scan --error=unused-suppression . && uv run ast-grep test"

[tasks.lint]
description = "Lint with ruff"
run = "uv run ruff check ."

[tasks.format]
description = "Format with ruff"
run = "uv run ruff format ."

[tasks.typecheck]
description = "Type-check with pyright"
run = "uv run pyright"

[tasks.typecheck-strict]
description = "Pyright in strict mode with type-ignore comments disabled — a report over the include paths, or over the paths passed"
run = "scripts/typecheck-strict.sh"

[tasks.export-openapi]
description = "Export the hub and runner OpenAPI specs to ./openapi (frontend codegen + CI drift baseline)"
run = "uv run blizzard-export-openapi --out-dir openapi"

[tasks.export-contracts]
description = "Export the store schema and daemon config documents to ./contracts (CI drift baseline and reflection-test input)"
run = "uv run blizzard-export-contracts --out-dir contracts"

[tasks."process-ref-lint"]
description = "blizzard:process-ref-lint — Vale prose gate for process references and change-history narration"
run = "vale --output=line ."

[tasks.compat]
description = "blizzard:compat — hold HEAD's committed surface documents to the supported releases, with this branch's commits since origin/master as the range a `!` may sit in"
run = "uv run blizzard-compat --commits origin/master..HEAD"

[tasks.change-notes]
description = "Validate the change notes under changes/ with blizzard-change-notes check, then fail on a note the branch owes with blizzard-change-notes owed --against origin/master — the format and the rules changes/README.md documents"
run = "uv run blizzard-change-notes check && uv run blizzard-change-notes owed --against origin/master"

[tasks.flag-lifecycle]
description = "Check release-derived flag lifetimes against HEAD (pr mode by default; cut and tag also available)"
run = "uv run blizzard-flag-lifecycle --base origin/master"

[tasks.release-notes]
description = "Print the release notes a tag publishes with blizzard-change-notes render: `mise run release-notes v0.8.0`"
run = "uv run blizzard-change-notes render"

[tasks.collector-config-check]
description = "blizzard:collector-config — validate the example operator collector config (packaging/otel-collector/collector.yaml) with the pinned otelcol-contrib. Local-only: the binary is ~390 MB and the CI gate is network-free."
tools = { "github:open-telemetry/opentelemetry-collector-releases" = { version = "0.162.0", asset_pattern = "otelcol-contrib_*", bin = "otelcol-contrib" } }
env = { TRACE_STORE_ENDPOINT = "tempo.example:4317", TRACE_STORE_INSECURE = "false", HOSTED_TRACES_ENDPOINT = "https://api.example.com", HOSTED_TRACES_API_KEY = "placeholder" }
run = "otelcol-contrib validate --config=packaging/otel-collector/collector.yaml"

[tasks.gate]
description = "Run the local equivalent of the PR-to-master merge gate (ruff, pyright, Vale prose lint, pytest, spec/client drift, eslint, vitest) — the gate job only; `mise run gate-full` mirrors the whole pull-request pipeline"
run = "./scripts/ci-gate.sh"

[tasks.gate-full]
description = "blizzard:gate-full — the local mirror of the unconditional pull-request tiers: the merge gate, then service-test, the FULL crash-sweep, e2e, journey, image-smoke and compose-smoke, run serially (the smokes bind fixed ports). A red tier does not stop the later ones; the run ends with a per-tier verdict and exits non-zero on any red. Run the conditional checks separately when applicable: mise run store-baseline for store revisions, mise run rehearsal for a release cut. Needs everything its tiers need: the sibling blizzard-mock worktree, Chromium, a docker daemon with compose v2. GATE_FULL_TIERS narrows the run"
run = "./scripts/gate-full.sh"

[tasks.build]
description = "The one build entrypoint: build both Angular apps into the embed dir, build the wheel, and verify it embeds the assets and installs+runs node-free"
run = "./scripts/build-wheel.sh"

[tasks.mutation]
description = "blizzard:mutation — scoped, resumable mutation testing (mutmut) over src/blizzard: mutates only the scope's source, runs only the unit tests import analysis selects for it, and writes mutants/report.json. `mise run mutation <scope> [--budget SECONDS] [--function PATH::[Class.]name]...`, or `--since REV` alone for every scope a delta touches; scopes: hub-daemon, runner-daemon, shared-spine, cli-surface. Runs in its own project environment, never .venv."
run = "UV_PROJECT_ENVIRONMENT=.mutation-env uv run --group mutation python scripts/mutation.py"

[tasks.image-smoke]
description = "blizzard:image-smoke — build the hub container image and boot it on an empty data volume: non-root uid, psycopg present, store at head before serving, GET /api/health and /api/ready live. Needs a reachable docker daemon; runs in CI on every pull request."
run = "./scripts/image-smoke.sh"

[tasks.compose-smoke]
description = "blizzard:compose-smoke — stand up the reference compose deployment (packaging/docker/compose.yaml) against a locally-built image on the localhost http-only profile: served through the Caddy proxy, the hub resolving a postgres BZ_HUB_DB_URL, and durability across a down (no -v) + up. Needs a reachable docker daemon and the docker compose plugin; runs in CI on every pull request."
run = "./scripts/compose-smoke.sh"

# Frontend (Angular workspace under web/). Mirror of the web/package.json scripts
# CI invokes; namespaced `web-*` so they don't collide with the Python tasks.
[tasks.web-install]
description = "Install frontend dependencies (npm ci in web/)"
dir = "web"
run = "npm ci"

[tasks.web-lint]
description = "Lint the Angular workspace (eslint, no prettier)"
dir = "web"
run = "npm run lint"

[tasks.web-test]
description = "Run the frontend unit/component tier (vitest)"
dir = "web"
run = "npm run test"

[tasks.web-build]
description = "Build both apps into src/blizzard/static/{hub,runner} for the wheel embed"
dir = "web"
run = "npm run build"

[tasks.web-generate-client]
description = "Regenerate the openapi-ts clients from ./openapi (CI drift check baseline)"
dir = "web"
run = "npm run generate:client"

[tasks.web-storybook]
description = "Serve the component workshop (Storybook) on BZ_STORYBOOK_PORT, or 6006"
dir = "web"
run = "npm run storybook"

[tasks.web-storybook-build]
description = "Build the static component workshop into web/dist/storybook"
dir = "web"
run = "npm run storybook:build"

[tasks.web-story-render]
description = "Type-check the stories, build the workshop, and render every story in headless Chromium"
dir = "web"
run = "npm run story-render"
