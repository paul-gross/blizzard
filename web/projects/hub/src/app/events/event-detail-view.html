<fleet-kit-panel class="fill" label="Event details" aria-label="Event details">
  <fleet-kit-async-state [state]="state()" loadingMode="content" errorText="FAILED TO LOAD EVENTS" emptyText="EVENT UNAVAILABLE IN THE CURRENT FEED" emptyTestid="event-detail-unavailable">
    <div loading class="loading"><fleet-kit-skeleton [rows]="5" /></div>
    @if (event(); as ev) {
      <ng-template #runnerFact>
        @if (ev.runnerId; as id) {
          <a class="runner-link" data-testid="event-detail-runner"
            [routerLink]="['/fleet', fleetId(id)] | appLink">{{ runnerName(id, ev.runnerName) }} ({{ id }})</a>
        }
      </ng-template>
      <ng-template #chunkFact>
        @if (ev.chunkId; as id) {
          <a class="chunk-link" data-testid="event-detail-chunk"
            [routerLink]="(mobile() ? ['/board', 'chunk', id] : ['/board']) | appLink: (mobile() ? null : { chunk: id })">{{ id }}</a>
        }
      </ng-template>
      <ng-template #payloadFact><pre>{{ payload(ev) }}</pre></ng-template>
      <fleet-kit-fact-list class="details" testid="event-detail" [rows]="facts(ev, runnerFact, chunkFact, payloadFact)" />
    }
  </fleet-kit-async-state>
</fleet-kit-panel>
