<div class="hd" data-testid="fleet-detail-title">
  <app-status-light class="dot" [light]="light()" />
  <h2 class="name" data-testid="fleet-detail-name" [title]="detail().row.runner_name">{{ detail().row.runner_name }}</h2>
  <span class="sep" aria-hidden="true">·</span>
  <span class="ref" data-testid="fleet-detail-ref" [title]="detail().row.runner_id">{{ detail().ref }}</span>
  <span class="sep" aria-hidden="true">·</span>
  <fleet-kit-badge class="state" data-testid="fleet-detail-state" variant="text" [tone]="state().tone">{{
    state().label
  }}</fleet-kit-badge>
  <span class="sep" aria-hidden="true">·</span>
  <span class="report" data-testid="fleet-detail-report" [title]="seenLabel(detail().row)">{{
    detail().row.connection === connection.NEVER_CONNECTED ? 'stands alone' : ageTag(detail().row) + ' · stands alone'
  }}</span>
</div>
<fleet-kit-panel class="sec" label="Workspace" [count]="slotsLabel()" [bodyScroll]="false" data-testid="fleet-runner-workspace">
  <div class="sec-bd">
    <fleet-kit-fact-list [rows]="detail().facts" />
    @if (slotsLabel() !== null) {
      <fleet-kit-slot-bar
        class="slot-bar"
        data-testid="fleet-runner-slot-bar"
        [used]="detail().row.used"
        [total]="detail().row.env_capacity ?? 0"
      />
    }
  </div>
</fleet-kit-panel>
<!-- Only a runner reporting a subscription has usage to show; one on API credentials leaves the
     panel out entirely. -->
@if (detail().row.subscriptionPaces.length > 0) {
  <fleet-kit-panel class="sec" label="Subscription usage" [bodyScroll]="false" data-testid="fleet-subscriptions">
    <div class="sec-bd">
      <fleet-subscription-pace-group
        class="subs"
        data-testid="fleet-runner-subscription-groups"
        [subscriptionPaces]="detail().row.subscriptionPaces"
      />
    </div>
  </fleet-kit-panel>
}
<fleet-kit-panel class="sec" label="Runner" [bodyScroll]="false" data-testid="fleet-runner-detail">
  <div role="list">
    <app-fleet-runner-row
      [row]="detail().row"
      [canPause]="canPause()"
      [pausePending]="pausePending()"
      (togglePause)="togglePause.emit($event)"
    />
  </div>
</fleet-kit-panel>
