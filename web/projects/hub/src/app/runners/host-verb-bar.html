@if (verbs().canRetire) {
  <div class="verbs" data-testid="host-verbs">
    <fleet-kit-button
      testid="host-enroll"
      [ariaLabel]="'Enroll host ' + hostName()"
      [disabled]="hostPending()"
      (click)="enroll()"
    >Enroll</fleet-kit-button>
    <fleet-kit-button
      testid="host-revoke-token"
      [ariaLabel]="'Revoke the token of host ' + hostName()"
      [disabled]="hostPending()"
      (click)="askRevokeToken()"
    >Revoke token</fleet-kit-button>
    <fleet-kit-button
      testid="host-retire"
      variant="danger"
      [ariaLabel]="'Retire host ' + hostName()"
      [disabled]="hostPending()"
      (click)="askRetire()"
    >Retire</fleet-kit-button>
  </div>
}
@if (pendingConfirm(); as confirm) {
  <fleet-kit-confirm-dialog
    [open]="true"
    [heading]="confirm.heading"
    [message]="confirm.message"
    [confirmLabel]="confirm.confirmLabel"
    variant="danger"
    testid="host-confirm"
    (confirmed)="onConfirmed()"
    (cancelled)="onCancelled()"
  />
}
@if (refusal(); as message) {
  <fleet-kit-confirm-dialog
    [open]="true"
    [heading]="'Force retire host ' + hostName()"
    [message]="message + ' Retiring anyway releases those chunks.'"
    confirmLabel="Retire anyway"
    variant="danger"
    testid="host-force-retire"
    (confirmed)="forceRetire()"
    (cancelled)="dismiss()"
  />
}
<fleet-kit-dialog
  [open]="enrolledToken() !== null"
  [ariaLabel]="'Token for host ' + hostName()"
  testid="host-token-dialog"
  (closed)="dismiss()"
>
  <h2 fleetKitDialogHeader>Token for host {{ hostName() }}</h2>
  <p class="token-note">Shown once — copy it to the host now.</p>
  <code class="token" data-testid="host-token">{{ enrolledToken() }}</code>
  <div fleetKitDialogFooter>
    <fleet-kit-button testid="host-token-done" (click)="dismiss()">Done</fleet-kit-button>
  </div>
</fleet-kit-dialog>
