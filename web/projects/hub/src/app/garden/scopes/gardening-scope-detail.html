<app-scope-panel
  [vm]="scopePanelVm()"
  [state]="scopePanelState()"
  [relatedRoutinesState]="relatedRoutinesState()"
  [hasProjectLens]="projectFilter() !== null"
  [project]="projectName()"
  [sameSlugIn]="sameSlugIn()"
  [canEdit]="canEditScopes()"
  [actionError]="scopeActionError()"
  [editPending]="editPending()"
  [lifecyclePending]="lifecyclePending()"
  (editDescription)="onEditScopeDescription($event)"
  (retire)="onRetireScope($event)"
  (enable)="onEnableScope($event)"
/>
