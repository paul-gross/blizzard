<fleet-kit-async-state
  [state]="state()"
  placement="inline"
  emptyText="No scopes declared yet."
  emptyTestid="gardening-scopes-empty"
>
  <ul class="sc-list" data-testid="gardening-scopes-list">
    @for (row of rows(); track row.slug) {
      <li>
        <fleet-kit-select-row
          [selected]="row.slug === selectedSlug()"
          [testid]="'gardening-scope-row-' + row.slug"
          (picked)="pick(row.slug)"
        >
          <div class="sc-top">
            <span class="sc-slug">{{ row.slug }}</span>
            @if (row.retired) {
              <fleet-kit-badge class="sc-flag" [tone]="lifecycleTone(true)">retired</fleet-kit-badge>
            }
            @if (row.lastSwept; as swept) {
              <fleet-when class="sc-swept" [iso]="swept" [attr.data-testid]="'gardening-scope-swept-' + row.slug" />
            }
          </div>
          @if (row.description) {
            <div class="sc-desc">{{ row.description }}</div>
          }
        </fleet-kit-select-row>
      </li>
    }
  </ul>
</fleet-kit-async-state>
