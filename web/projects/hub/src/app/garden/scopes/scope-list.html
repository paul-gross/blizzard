<fleet-kit-async-state
  [state]="state()"
  placement="inline"
  emptyText="No scopes declared yet."
  loadingTestid="gardening-scopes-loading"
  emptyTestid="gardening-scopes-empty"
>
  <div
    class="sc-list"
    data-testid="gardening-scopes-list"
    fleetKitSelectList
    selectionMode="explicit" [softDisabled]="false" [wrap]="false" focusMode="activedescendant"
    ariaLabel="Scopes"
    [value]="selectedSlug()"
    (valueChange)="pick($event)"
  >
    @for (row of rows(); track row.slug) {
        <fleet-kit-select-row
          [value]="row.slug"
          [label]="row.slug"
          [testid]="'gardening-scope-row-' + row.slug"
        >
          <div class="sc-top">
            <span class="sc-slug">{{ row.slug }}</span>
            @if (row.retired) {
              <fleet-kit-badge class="sc-flag" [tone]="lifecycleTone(true)">retired</fleet-kit-badge>
            }
            @if (row.swept; as swept) {
              @if (swept.at; as at) {
                <fleet-when
                  class="sc-swept"
                  [iso]="at"
                  [relative]="true"
                  [attr.data-testid]="'gardening-scope-swept-' + row.slug"
                />
              } @else {
                <span class="sc-swept" [attr.data-testid]="'gardening-scope-swept-' + row.slug">{{
                  swept.notSwept
                }}</span>
              }
            }
          </div>
          @if (row.description) {
            <div class="sc-desc">{{ row.description }}</div>
          }
        </fleet-kit-select-row>
    }
  </div>
</fleet-kit-async-state>
