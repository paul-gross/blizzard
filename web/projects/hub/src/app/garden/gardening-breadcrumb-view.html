<nav class="crumbs" aria-label="Breadcrumb" data-testid="gardening-crumbs">
  <a class="crumb crumb-link" [attr.href]="doorwayHref()" data-testid="gardening-crumb-doorway" (click)="doorwayClick.emit($event)"
    >Gardening</a
  >
  <span class="sep" aria-hidden="true">›</span>
  <fleet-kit-menu
    class="project-crumb"
    ariaLabel="Switch project"
    testid="gardening-crumb-project"
    [menu]="projectMenu"
  >
    <span trigger>{{ projectLabel() }} ▾</span>
  </fleet-kit-menu>
  @if (surfaceLabel(); as label) {
    <span class="sep" aria-hidden="true">›</span>
    <span class="crumb current" data-testid="gardening-crumb-surface">{{ label }}</span>
  }
</nav>
<ng-template #projectMenu>
  <fleet-kit-menu-panel testid="gardening-crumb-project-panel">
    <div class="menu-head" data-testid="gardening-crumb-project-head">
      Switch project — stays on {{ surfaceLabel() ?? 'this surface' }}
    </div>
    @for (choice of choices(); track choice.slug) {
      <fleet-kit-menu-item-radio
        [checked]="choice.slug === checkedSlug()"
        [testid]="'gardening-crumb-project-' + (choice.slug ?? 'all')"
        (triggered)="projectSelected.emit(choice.slug)"
      >
        <span class="menu-choice">
          <span>{{ choice.label }}</span>
          @if (choice.waiting !== null) {
            <span class="menu-waiting" [attr.data-testid]="'gardening-crumb-waiting-' + choice.slug">{{
              waitingLabel(choice.waiting)
            }}</span>
          }
        </span>
      </fleet-kit-menu-item-radio>
    }
  </fleet-kit-menu-panel>
</ng-template>
