<fleet-kit-async-state
  [state]="state()"
  placement="inline"
  emptyText="No routines yet."
  loadingTestid="gardening-routines-loading"
  emptyTestid="gardening-routines-empty"
>
  <div
    class="rt-list"
    data-testid="gardening-routines-list"
    fleetKitSelectList
    selectionMode="explicit" [softDisabled]="false" [wrap]="false"
    ariaLabel="Routines"
    [value]="selectedSlug()"
    (valueChange)="pick($event)"
  >
    @for (row of rows(); track row.routineId) {
        <fleet-kit-select-row
          [value]="row.slug"
          [label]="row.name"
          [testid]="'gardening-routine-row-' + row.slug"
        >
          <span class="rt-top">
            <span class="rt-name">{{ row.name }}</span>
            <!-- A routine a cadence keeps reads `cadence`; any other runs only when started. -->
            @if (row.kept !== null) {
              <span class="rt-cadence" data-testid="gardening-routine-cadence">{{ row.kept ? 'cadence' : 'manual' }}</span>
            }
          </span>
          <span class="rt-line2">
            <span class="rt-graph">graph {{ row.graphName }}</span>
            <span class="rt-ref" [title]="row.routineId">{{ compactRef(row.routineId) }}</span>
          </span>
          @if (row.blocked) {
            <fleet-kit-badge class="rt-flag" tone="needs">blocked</fleet-kit-badge>
          }
          @if (row.retired) {
            <fleet-kit-badge class="rt-flag" [tone]="lifecycleTone(true)">retired</fleet-kit-badge>
          }
        </fleet-kit-select-row>
    }
  </div>
</fleet-kit-async-state>
