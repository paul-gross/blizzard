<fleet-kit-master-detail
  class="gr-layout"
  paneId="gardening-routines"
  testidPrefix="gardening-routines"
  backLabel="Routines"
  [drilldown]="mobile()"
  [hasSelection]="routineNameParam() !== null"
  (back)="onBack()"
>
  <fleet-kit-panel kit-master-detail-list class="gr-left" label="Routines">
    <app-routine-list
      [rows]="listRows()"
      [selectedName]="selectedRoutineName()"
      [state]="listState()"
      (routinePick)="selectRoutine($event)"
    />
  </fleet-kit-panel>
  <div kit-master-detail-detail class="gr-right">
    <router-outlet />
  </div>
</fleet-kit-master-detail>
