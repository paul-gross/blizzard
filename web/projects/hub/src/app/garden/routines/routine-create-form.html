@let f = form();
<fleet-kit-form
  [attr.data-testid]="testid()"
  [form]="f"
  [testid]="testid()"
  saveLabel="Create"
  (save)="save.emit()"
  (cancel)="cancel.emit()"
>
  <fleet-kit-field label="Slug" [field]="f.slug">
    <fleet-kit-text-input [formField]="f.slug" ariaLabel="Routine slug" placeholder="nightly" [testid]="testid() + '-slug'" />
  </fleet-kit-field>
  <fleet-kit-field label="Name" [field]="f.name">
    <fleet-kit-text-input [formField]="f.name" ariaLabel="Routine name" placeholder="the slug, when blank" [testid]="testid() + '-name'" />
  </fleet-kit-field>
  <fleet-kit-field label="Graph" [field]="f.graph">
    <fleet-kit-text-input [formField]="f.graph" ariaLabel="Graph name" [testid]="testid() + '-graph'" />
  </fleet-kit-field>
  <fleet-kit-field label="Default scope" [field]="f.scope">
    <fleet-kit-text-input [formField]="f.scope" ariaLabel="Default scope" [testid]="testid() + '-scope'" />
  </fleet-kit-field>
  <fleet-kit-field label="Default urgency" [field]="f.urgency">
    <fleet-kit-select [formField]="f.urgency" [options]="options()" ariaLabel="Default urgency" [testid]="testid() + '-urgency'" />
  </fleet-kit-field>
</fleet-kit-form>
