<app-routine-panel
  [vm]="panelVm()"
  [state]="panelState()"
  [relatedScopesState]="relatedScopesState()"
  [project]="projectName()"
  [canEdit]="canEdit()"
  [actionError]="lifecycleActionError()"
  [lifecyclePending]="lifecyclePending()"
  [editable]="editable()"
  [editForm]="editForm()"
  [editField]="editField()"
  [urgencies]="urgenciesQuery.data() ?? []"
  [urgenciesReady]="urgenciesQuery.isSuccess()"
  [defaultUrgency]="selectedRoutine()?.defaultUrgency ?? null"
  (run)="run()"
  (startEditGraph)="onStartEditGraph()"
  (startEditUrgency)="onStartEditUrgency($event)"
  (saveEdit)="onSaveEdit()"
  (cancelEdit)="onCancelEdit()"
  (confirmOpened)="onConfirmOpened()"
  (retire)="onRetireRoutine($event)"
  (enable)="onEnableRoutine($event)"
/>

@if (panelVm(); as panel) {
  <app-routine-proposal-counts [rows]="proposalCountsRows()" [state]="proposalCountsState()" />
}

@if (runningRoutine(); as routine) {
  <app-gardening-run-dialog
    [routineId]="routine.id"
    [routineName]="routine.name"
    [effectiveUrgency]="runUrgency()"
    (closed)="closeDialog()"
  />
}
