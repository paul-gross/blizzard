<app-routine-panel
  [vm]="panelVm()"
  [state]="panelState()"
  [relatedScopesState]="relatedScopesState()"
  [project]="projectName()"
  [canEdit]="canEdit()"
  [actionError]="lifecycleActionError()"
  [lifecyclePending]="lifecyclePending()"
  [editPending]="editPending()"
  [urgencies]="urgenciesQuery.data() ?? []"
  [urgenciesReady]="urgenciesQuery.isSuccess()"
  [defaultUrgency]="selectedRoutine()?.default_urgency ?? null"
  (run)="run()"
  (editGraph)="onEditGraph($event)"
  (editUrgency)="onEditUrgency($event)"
  (retire)="onRetireRoutine($event)"
  (enable)="onEnableRoutine($event)"
/>

@if (panelVm(); as panel) {
  <app-routine-proposal-counts [rows]="proposalCountsRows()" [state]="proposalCountsState()" />
}

@if (runningRoutine(); as routine) {
  <app-gardening-run-dialog
    [routineId]="routine.routine_id"
    [routineName]="routine.name"
    [routineUrgency]="routine.default_urgency"
    (closed)="closeDialog()"
  />
}
