<app-gardening-run-dialog-view
  [routineName]="routineName()"
  [urgencies]="urgenciesQuery.data() ?? []"
  [routineUrgency]="routineUrgency()"
  [scopes]="orderedScopes()"
  [sweptSlugs]="sweptSlugs()"
  [baselines]="baselinesQuery.data() ?? []"
  [state]="state()"
  [submitting]="submitting()"
  [submitError]="submitError()"
  [confirmedRun]="confirmedRun()"
  (closed)="closed.emit()"
  (runSubmitted)="onSubmit($event)"
/>
