<fleet-kit-master-detail
  class="gr-layout"
  paneId="gardening-runs"
  testidPrefix="gardening-runs"
  backLabel="Runs"
  [drilldown]="mobile()"
  [hasSelection]="chunkId() !== null"
  (back)="onBack()"
>
  <fleet-kit-panel kit-master-detail-list class="gr-list" label="Runs">
    <app-run-list
      [rows]="runs.listRows()"
      [selectedChunkId]="chunkId()"
      [state]="runs.listState()"
      (runPick)="selectRun($event)"
    />
  </fleet-kit-panel>
  <fleet-kit-panel kit-master-detail-detail class="gr-detail" label="Run">
    <router-outlet />
  </fleet-kit-panel>
</fleet-kit-master-detail>
