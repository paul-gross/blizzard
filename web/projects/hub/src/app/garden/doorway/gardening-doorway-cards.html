<ul class="cards" data-testid="gardening-doorway">
  @if (isLoading()) {
    @for (width of [100, 75, 90]; track $index) {
      <li class="card skeleton-card" aria-hidden="true">
        <span class="heading">
          <fleet-kit-skeleton class="skeleton-swatch" [rows]="1" />
          <span class="name skeleton-text" [style.width.px]="width">&nbsp;<fleet-kit-skeleton [rows]="1" /></span>
        </span>
        <span class="counts skeleton-text">&nbsp;<span class="skeleton-counts">
          <fleet-kit-skeleton [rows]="1" />
          <fleet-kit-skeleton [rows]="1" />
          <fleet-kit-skeleton [rows]="1" />
        </span></span>
      </li>
    }
  } @else {
  @for (card of cards(); track card.projectId) {
    <li>
      <a
        fleetKitLinkTile
        class="card"
        [href]="card.href"
        [attr.data-testid]="'gardening-doorway-card-' + card.slug"
        (click)="select($event, card.slug)"
      >
        <span class="heading"><fleet-kit-swatch [color]="card.color" /><span class="name">{{ card.name }}</span></span>
        <span class="counts">{{ card.counts }}</span>
      </a>
    </li>
  }
  }
</ul>
