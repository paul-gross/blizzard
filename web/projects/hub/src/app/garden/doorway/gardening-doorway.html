<fleet-kit-async-state
  [state]="state()"
  loadingMode="content"
  emptyText="NO PROJECTS IN THIS TENANT"
  loadingTestid="gardening-doorway-loading"
  emptyTestid="gardening-doorway-empty"
  errorTestid="gardening-doorway-error"
>
  <app-gardening-doorway-cards loading [cards]="[]" [isLoading]="true" role="status" aria-label="Loading projects" data-testid="gardening-doorway-loading" />
  <app-gardening-doorway-cards [cards]="cards()" (projectSelected)="chooseProject($event)" />
</fleet-kit-async-state>
