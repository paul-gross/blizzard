<div class="gp-filters">
  <fleet-kit-chips
    [options]="waitingChips"
    [selectedValue]="waitingChipValue()"
    (choose)="onWaitingChoose($event)"
  />
  <fleet-kit-select
    ariaLabel="Class"
    testid="gardening-proposal-class-filter"
    [options]="classChips()"
    [selectedValue]="classChipValue()"
    (choose)="onClassChoose($event)"
  />
  <fleet-kit-select
    ariaLabel="Routine"
    testid="gardening-proposal-routine-filter"
    [options]="routineChips()"
    [selectedValue]="routineChipValue()"
    (choose)="onRoutineChoose($event)"
  />
</div>

<fleet-kit-master-detail
  class="gp-layout"
  paneId="gardening-proposals"
  testidPrefix="gardening-proposals"
  backLabel="Proposals"
  [drilldown]="mobile()"
  [hasSelection]="proposalId() !== null"
  (back)="onBack()"
>
  <app-proposal-list
    kit-master-detail-list
    class="gp-list"
    [rows]="listRows()"
    [selectedId]="proposalId()"
    [state]="listState()"
    (proposalPick)="select($event)"
  />
  <div kit-master-detail-detail class="gp-panel">
    <router-outlet />
  </div>
</fleet-kit-master-detail>
