<fleet-kit-dialog
  [open]="true"
  [ariaLabel]="'Pass ' + proposalTitle()"
  testid="gardening-proposal-pass-dialog"
  (closed)="onClosed()"
>
  <h2 fleetKitDialogHeader data-testid="proposal-pass-dialog-title">Pass {{ proposalTitle() }}</h2>

  <p>
    Passing is not a dismissal — it is the note that stops a later run raising the same response as though it were new.
  </p>

  <fleet-kit-form [form]="form()" saveLabel="Pass" (save)="save.emit()" (cancel)="onClosed()">
    <fleet-kit-field label="Reason" [field]="form().reason">
      <fleet-kit-text-input
        multiline
        [rows]="6"
        placeholder="Why the proposal is passed — required"
        [formField]="form().reason"
        testid="proposal-pass-reason-input"
      />
    </fleet-kit-field>
  </fleet-kit-form>
</fleet-kit-dialog>
