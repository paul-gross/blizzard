<app-proposal-panel
  [vm]="panelVm()"
  [state]="panelState()"
  [evidence]="evidenceRows()"
  [evidenceState]="evidenceState()"
  [canControl]="canControl()"
  (pass)="openPass()"
  (accept)="openAccept()"
  (evidenceTriage)="onEvidenceTriage($event)"
/>

<!-- An inline triage has no dialog to report into, so its failure surfaces here
     rather than vanishing while the row's state silently stays put. -->
<fleet-kit-error-line [message]="evidenceError()" testid="gardening-proposal-evidence-error" />

@if (passingProposal(); as proposal) {
  <app-gardening-proposal-pass-dialog
    [proposalId]="proposal.proposal_id"
    [proposalTitle]="proposal.title"
    (closed)="closePass()"
  />
}

@if (acceptingProposal(); as proposal) {
  <app-gardening-proposal-accept-dialog
    [proposalId]="proposal.proposal_id"
    [proposalTitle]="proposal.title"
    [proposalBody]="proposal.body"
    (closed)="closeAccept()"
  />
}
