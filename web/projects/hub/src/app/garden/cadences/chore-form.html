@let f = form();
<fleet-kit-form
  [attr.data-testid]="testid()"
  [form]="f"
  [testid]="testid()"
  saveLabel="Save chore"
  (save)="save.emit()"
  (cancel)="cancel.emit()"
>
  <div class="chf-row">
    @if (adding()) {
      <fleet-kit-field label="Key" [field]="f.key">
        <fleet-kit-text-input [formField]="f.key" placeholder="nightly" [testid]="testid() + '-key'" />
      </fleet-kit-field>
    }
    <fleet-kit-field label="Routine" [field]="f.routine">
      <fleet-kit-text-input [formField]="f.routine" placeholder="nightly" [testid]="testid() + '-routine'" />
    </fleet-kit-field>
  </div>
  <fleet-kit-field label="Scopes" [field]="f.scopes">
    <fleet-kit-text-input
      [formField]="f.scopes"
      placeholder="all, a list of slugs, or blank for the routine's default"
      [testid]="testid() + '-scopes'"
    />
  </fleet-kit-field>
  <div class="chf-row">
    <fleet-kit-field label="Mode" [field]="f.mode">
      <fleet-kit-option-group [formField]="f.mode" ariaLabel="Chore mode">
        @for (mode of modes(); track mode.value) {
          <fleet-kit-option [value]="mode.value" [testid]="testid() + '-mode-' + mode.value">{{ mode.label }}</fleet-kit-option>
        }
      </fleet-kit-option-group>
    </fleet-kit-field>
    <fleet-kit-field label="Promote" [field]="f.promote">
      <fleet-kit-checkbox [formField]="f.promote" label="promote its runs" [testid]="testid() + '-promote'" />
    </fleet-kit-field>
  </div>
  <fleet-kit-field label="Urgency" [field]="f.urgency">
    <fleet-kit-select [formField]="f.urgency" [options]="urgencyOptions()" ariaLabel="Urgency" [testid]="testid() + '-urgency'" />
  </fleet-kit-field>
  <fleet-kit-field label="Note" [field]="f.note">
    <fleet-kit-text-input [formField]="f.note" [testid]="testid() + '-note'" />
  </fleet-kit-field>
</fleet-kit-form>
