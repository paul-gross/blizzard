@let f = form();
<fleet-kit-form
  [attr.data-testid]="testid()"
  [form]="f"
  [testid]="testid()"
  [saveLabel]="creating() ? 'Create' : 'Save'"
  (save)="save.emit()"
  (cancel)="cancel.emit()"
>
  @if (creating()) {
    <fleet-kit-field label="Slug" [field]="f.slug">
      <fleet-kit-text-input [formField]="f.slug" placeholder="evening" [testid]="testid() + '-slug'" />
    </fleet-kit-field>
  }
  <fleet-kit-field label="Name" [field]="f.name">
    <fleet-kit-text-input
      [formField]="f.name"
      [placeholder]="creating() ? 'the slug, when blank' : null"
      [testid]="testid() + '-name'"
    />
  </fleet-kit-field>
  <div class="cf-row">
    <fleet-kit-field label="Cron" [field]="f.cron">
      <fleet-kit-text-input [formField]="f.cron" placeholder="0 20 * * *" [testid]="testid() + '-cron'" />
    </fleet-kit-field>
    <fleet-kit-field label="Zone" [field]="f.zone">
      <fleet-kit-text-input [formField]="f.zone" placeholder="America/Chicago" [testid]="testid() + '-zone'" />
    </fleet-kit-field>
  </div>
  <div class="cf-row">
    <fleet-kit-field label="Spacing" [field]="f.spacing">
      <fleet-kit-text-input [formField]="f.spacing" placeholder="10d" [testid]="testid() + '-spacing'" />
    </fleet-kit-field>
    <fleet-kit-field label="Anchor" [field]="f.anchor">
      <fleet-kit-select [formField]="f.anchor" [options]="anchorOptions" ariaLabel="Anchor" [testid]="testid() + '-anchor'" />
    </fleet-kit-field>
  </div>
</fleet-kit-form>
