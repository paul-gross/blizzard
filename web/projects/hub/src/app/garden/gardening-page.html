<app-gardening-breadcrumb-view
  [doorwayHref]="doorwayUrl"
  [projectLabel]="projectName()"
  [checkedSlug]="lensSlug()"
  [surfaceLabel]="surfaceLabel()"
  [choices]="projectChoices()"
  (doorwayClick)="openDoorway($event)"
  (projectSelected)="chooseProject($event)"
/>
<nav fleetKitTabStrip variant="sub" class="subnav" data-testid="gardening-subnav">
  @for (tab of tabs(); track tab.surface) {
    <a
      fleetKitTab
      variant="sub"
      [count]="tab.count"
      [countHot]="tab.surface === 'proposals' && (tab.count ?? 0) > 0"
      [countTestid]="'gardening-tab-count-' + tab.surface"
      [routerLink]="tab.surface | lensLink"
      [class.active]="tab.surface === surface()"
      [attr.aria-current]="tab.surface === surface() ? 'page' : null"
      [attr.data-testid]="'gardening-tab-' + tab.surface"
    >
      {{ tab.label }}
    </a>
  }
</nav>
<div class="body">
  <router-outlet />
</div>
