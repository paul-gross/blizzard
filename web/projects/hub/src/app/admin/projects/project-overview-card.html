<fleet-kit-panel [label]="heading()" [attr.data-testid]="testid()">
  @if (opens()) {
    <fleet-kit-button fleetKitPanelHeader variant="primary" [testid]="testid() + '-open'" (click)="open.emit()">open</fleet-kit-button>
  }
  <fleet-kit-async-state
    [state]="state()"
    placement="inline"
    loadingText="Loading…"
    errorText="Failed to load."
    [emptyText]="none()"
  >
    <ul class="lines">
      @for (line of lines(); track line.name) {
        <li>
          <span class="name">{{ line.name }}</span>
          <span class="detail">{{ line.detail }}</span>
        </li>
      }
    </ul>
  </fleet-kit-async-state>
</fleet-kit-panel>
