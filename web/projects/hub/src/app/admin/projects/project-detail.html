<fleet-kit-async-state
  [state]="state()"
  placement="inline"
  loadingText="Loading…"
  errorText="Failed to load this project."
  emptyText="Pick a project to see what it links and who serves it."
  emptyTestid="admin-projects-detail-empty"
  errorTestid="admin-projects-detail-error"
>
  @if (project(); as p) {
    <app-project-record-panel
      [project]="p"
      [canEdit]="canEdit()"
      [tabs]="tabs()"
      [tab]="tab()"
      [formerSlugs]="formerSlugs()"
      [counts]="countsQuery.data()"
      [lastChange]="lastChange()"
      [callout]="callout()"
      [sourceRows]="sourceRows()"
      [repositoryRows]="repositoryRows()"
      [servedLines]="servedLines()"
      [sourcesState]="sourcesState()"
      [repositoriesState]="repositoriesState()"
      [servedState]="servedState()"
      [revisions]="revisions()"
      [revisionsState]="revisionsState()"
      [pendingSourceKeys]="pendingSourceKeys()"
      [pendingRepositoryKeys]="pendingRepositoryKeys()"
      [sourceError]="sourceError()"
      [repositoryError]="repositoryError()"
      (edit)="onEdit()"
      (color)="onColorOpen()"
      (tabChange)="onTab($event)"
      (link)="onLinkOpen($event)"
      (unlink)="onUnlink($event)"
    />

    @if (editOpen()) {
      <app-config-form-dialog
        [heading]="'Edit ' + p.name"
        mode="edit"
        [fields]="fields"
        [initial]="shown()"
        [hint]="slugHint"
        submitLabel="Save"
        [submitError]="editError()"
        [submitting]="editMutation.isPending()"
        testidPrefix="admin-projects-edit"
        (closed)="editOpen.set(false)"
        (submitted)="onSave($event)"
      />
    }
    @if (colorOpen()) {
      <fleet-kit-dialog [open]="true" [ariaLabel]="'Color of ' + p.name" testid="admin-projects-color-dialog" (closed)="onColorClose()">
        <h2 fleetKitDialogHeader>Color of {{ p.name }}</h2>
        <app-project-color-picker
          [colors]="palette"
          [current]="p.color"
          [disabled]="editMutation.isPending()"
          (choose)="onColor($event)"
        />
        <div fleetKitDialogFooter class="color-footer">
          <fleet-kit-error-line class="color-error" [message]="colorError()" testid="admin-projects-color-error" />
          <fleet-kit-button size="cta" [disabled]="editMutation.isPending()" testid="admin-projects-color-close" (click)="onColorClose()">
            Close
          </fleet-kit-button>
        </div>
      </fleet-kit-dialog>
    }
    @if (linkOpen() === 'source') {
      <app-project-link-dialog
        [heading]="'Link a work source to ' + p.name"
        fieldLabel="Work source"
        [choices]="sourceChoices()"
        note="Linking changes nothing in the source and nothing already ingested."
        noneText="This project links every work source in the tenant. Add one under Work sources."
        [submitting]="linkMutation.isPending()"
        [submitError]="linkError()"
        testidPrefix="admin-projects-link-source"
        (closed)="linkOpen.set(null)"
        (submitted)="onLink('source', $event)"
      />
    }
    @if (linkOpen() === 'repository') {
      <app-project-link-dialog
        [heading]="'Link a repository to ' + p.name"
        fieldLabel="Repository"
        [choices]="repositoryChoices()"
        note="Linking lets this project's chunks land here. Projects that share a repository land on its one branch, taking turns."
        noneText="This project links every repository in the tenant. Add one under Repositories."
        [submitting]="linkMutation.isPending()"
        [submitError]="linkError()"
        testidPrefix="admin-projects-link-repository"
        (closed)="linkOpen.set(null)"
        (submitted)="onLink('repository', $event)"
      />
    }
  }
</fleet-kit-async-state>
