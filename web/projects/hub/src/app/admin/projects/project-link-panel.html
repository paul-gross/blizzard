<fleet-kit-panel
  [label]="heading()"
  [count]="countShown() ? rows().length : null"
  [attr.data-testid]="testid()"
>
  @if (canEdit()) {
    <fleet-kit-button fleetKitPanelHeader variant="primary" [testid]="testid() + '-link'" (click)="link.emit()">
      {{ linkLabel() }}
    </fleet-kit-button>
  }
  <div class="body">
    <p class="explainer">{{ explainer() }}</p>
    <fleet-kit-error-line class="error" [message]="error()" [testid]="testid() + '-error'" />
    <fleet-kit-async-state
      [state]="state()"
      placement="inline"
      loadingText="Loading…"
      errorText="Failed to load."
      [emptyText]="emptyText()"
      [emptyTestid]="testid() + '-empty'"
    >
      <ul class="rows" [attr.data-testid]="testid() + '-rows'">
        @for (row of rows(); track row.name) {
          <li class="row" [attr.data-testid]="testid() + '-row-' + row.name">
            <span class="name">{{ row.name }}</span>
            <span class="detail">{{ row.detail }}</span>
            <span class="right">
              @if (row.builtIn) {
                <fleet-kit-badge tone="idle" variant="soft">built-in</fleet-kit-badge>
              } @else {
                @if (row.revision !== null) {
                  <span class="rev">r{{ row.revision }}</span>
                }
                @if (canEdit()) {
                  <fleet-kit-button
                    variant="danger"
                    [disabled]="pendingKeys().has(row.key)"
                    [testid]="testid() + '-unlink-' + row.name"
                    (click)="unlink.emit(row)"
                  >
                    Unlink
                  </fleet-kit-button>
                }
              }
            </span>
          </li>
        }
      </ul>
    </fleet-kit-async-state>
  </div>
</fleet-kit-panel>
