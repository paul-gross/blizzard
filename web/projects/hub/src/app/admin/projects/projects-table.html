<fleet-kit-async-state
  [state]="state()"
  placement="inline"
  loadingText="Loading projects…"
  errorText="Failed to load projects."
  emptyText="No projects."
  emptyTestid="projects-table-empty"
  errorTestid="projects-table-error"
>
  <ul class="rows" data-testid="projects-table">
    @for (row of rows(); track row.key) {
      <li>
        <fleet-kit-select-row
          [selected]="row.key === selectedKey()"
          [testid]="'projects-table-row-' + row.key"
          (picked)="pick.emit(row.key)"
        >
          <span class="top">
            <span
              class="light"
              [class.wired]="row.wired"
              [class.missing]="row.needs !== null"
              role="img"
              [attr.aria-label]="lightLabel(row)"
              [attr.data-testid]="'projects-table-light-' + row.key"
            ></span>
            <fleet-kit-swatch class="swatch" [color]="row.color" [attr.title]="row.color" />
            <span class="title">{{ row.name }}</span>
          </span>
          <span class="sub">
            @if (row.needs; as needs) {
              <fleet-kit-badge
                tone="waiting"
                variant="soft"
                [attr.data-testid]="'projects-table-needs-' + row.key"
                >{{ needs }}</fleet-kit-badge
              >
            }
            <span class="ref" [attr.data-testid]="'projects-table-ref-' + row.key">{{ ref(row) }}</span>
          </span>
        </fleet-kit-select-row>
      </li>
    }
  </ul>
</fleet-kit-async-state>
