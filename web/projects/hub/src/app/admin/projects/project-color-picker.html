<div class="colors" role="group" aria-label="Project color" data-testid="project-color-picker">
  @for (color of colors(); track color) {
    <fleet-kit-chip
      [selected]="color === current()"
      [disabled]="disabled()"
      [testid]="'project-color-' + color"
      (click)="onPalette(color)"
    >
      <fleet-kit-swatch class="chip-swatch" [color]="color" />{{ color }}
    </fleet-kit-chip>
  }
  <fleet-kit-chip
    [selected]="isCustom()"
    [disabled]="disabled()"
    testid="project-color-custom"
    (click)="customRequested.set(true)"
  >
    Custom
  </fleet-kit-chip>
</div>
@if (customOpen()) {
  <fleet-kit-color-input
    class="custom-input"
    [value]="current()"
    testid="project-color-custom-input"
    (valueChange)="choose.emit($event)"
  />
}
