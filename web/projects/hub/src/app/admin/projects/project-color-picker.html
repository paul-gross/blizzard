<div class="colors" fleetKitChipGroup orientation="horizontal" selectionMode="follow" [value]="selectedColor()" [disabled]="disabled()" (valueChange)="selectionChanged($event)" [attr.aria-label]="ariaLabel()" data-testid="project-color-picker">
  @for (color of colors(); track color) {
    <fleet-kit-chip
      fleetKitChipOption
      [value]="color"
      [label]="color"
      [disabled]="disabled()"
      [testid]="'project-color-' + color"
    >
      <fleet-kit-swatch class="chip-swatch" [color]="color" />{{ color }}
    </fleet-kit-chip>
  }
  <fleet-kit-chip
    fleetKitChipOption
    [value]="null"
    label="Custom"
    [disabled]="disabled()"
    testid="project-color-custom"
  >
    Custom
  </fleet-kit-chip>
</div>
@if (customOpen()) {
  <fleet-kit-color-input
    class="custom-input"
    [value]="current()"
    [disabled]="disabled()"
    testid="project-color-custom-input"
    (valueChange)="choose.emit($event)"
    (invalidChange)="invalidChange.emit($event)"
  />
}
