<fleet-kit-master-detail
  class="split"
  paneId="admin-projects"
  [drilldown]="mobile()"
  [hasSelection]="selectedKey() !== null"
  backLabel="Projects"
  testidPrefix="admin-projects"
  (back)="onBack()"
>
  <fleet-kit-panel kit-master-detail-list class="list-pane" label="Projects" data-testid="admin-projects-list-panel">
    @if (canCreate()) {
      <fleet-kit-button fleetKitPanelHeader variant="primary" testid="admin-projects-new" (click)="onNew()"
        >+ New project</fleet-kit-button
      >
    }
    <app-projects-table [rows]="rows()" [state]="state()" [selectedKey]="selectedKey()" (pick)="onPick($event)" />
  </fleet-kit-panel>
  <fleet-kit-panel kit-master-detail-detail class="detail-pane" data-testid="admin-projects-detail-panel">
    <router-outlet />
  </fleet-kit-panel>
</fleet-kit-master-detail>
@if (createOpen()) {
  <app-config-form-dialog
    heading="New project"
    mode="create"
    [fields]="fields"
    [hint]="slugHint"
    submitLabel="Create"
    [submitError]="createError()"
    [submitting]="createMutation.isPending()"
    testidPrefix="admin-projects-create"
    (closed)="createOpen.set(false)"
    (submitted)="onCreate($event)"
  />
}
