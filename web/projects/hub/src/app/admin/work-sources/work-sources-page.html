<app-config-master
  paneId="admin-work-sources"
  [listCaption]="caption()"
  [filter]="lifecycle()"
  [rows]="rows()"
  [state]="state()"
  [emptyText]="emptyText()"
  [selectedKey]="selectedKey()"
  [drilldown]="mobile()"
  backLabel="Work sources"
  testidPrefix="admin-work-sources"
  [canCreate]="canCreate()"
  newLabel="New work source"
  (create)="onNew()"
  (filterChange)="onFilter($event)"
  (pick)="onPick($event)"
  (back)="onBack()"
>
  <router-outlet />
</app-config-master>
@if (createOpen()) {
  <app-config-field-tree-dialog
    heading="New work source"
    mode="create"
    [form]="createForm"
    [fields]="fields()"
    submitLabel="Create"
    testidPrefix="admin-work-sources-create"
    (closed)="createOpen.set(false)"
    (save)="onCreate()"
  />
}
