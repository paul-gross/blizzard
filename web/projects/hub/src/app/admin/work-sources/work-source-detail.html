<app-config-record-panel
  [vm]="vm()"
  [state]="state()"
  [lastChange]="lastChange()"
  [revisions]="revisions()"
  [revisionsState]="revisionsState()"
  [cliCommand]="cliCommand()"
  [actions]="actions()"
  [busy]="busy()"
  [actionError]="actionError()"
  (edit)="onEdit()"
  (lifecycle)="onLifecycle($event)"
  emptyText="Pick a work source."
  testidPrefix="admin-work-source"
>
  @if (check(); as target) {
    <app-credential-check [target]="target" />
  }
</app-config-record-panel>
@if (editBaseline(); as baseline) {
  <app-config-field-tree-dialog
    heading="Edit work source"
    mode="edit"
    [form]="editForm"
    [fields]="fields()"
    [baseline]="baseline.draft"
    submitLabel="Save"
    testidPrefix="admin-work-source-edit"
    (closed)="onCancel()"
    (save)="onSave()"
  />
}
