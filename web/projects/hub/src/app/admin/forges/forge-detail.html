<app-config-record-panel
  [vm]="vm()" [state]="state()" [lastChange]="lastChange()" [revisions]="revisions()"
  [revisionsState]="revisionsState()" [cliCommand]="cliCommand()" [actions]="actions()"
  [busy]="busy()" [actionError]="actionError()" (edit)="onEdit()" (lifecycle)="onLifecycle($event)"
  emptyText="Pick a forge." testidPrefix="admin-forge"
/>
@if (editBaseline(); as baseline) {
  <app-config-field-tree-dialog heading="Edit forge" mode="edit" [form]="editTree" [fields]="fields"
    [baseline]="baseline.draft" submitLabel="Save" testidPrefix="admin-forge-edit"
    (closed)="editBaseline.set(null)" (save)="onSave()" />
}
