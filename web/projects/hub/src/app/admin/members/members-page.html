<fleet-kit-async-state
  [state]="triadState()"
  loadingText="Loading users…"
  loadingTestid="members-page-loading"
  errorText="Failed to load users."
  errorTestid="members-page-error"
>
  @if (assignRoleError(); as message) {
    <p class="assign-role-error" data-testid="members-page-assign-role-error">{{ message }}</p>
  }
  <app-members-table
    [users]="usersQuery.data() ?? []"
    [currentUserId]="currentUserId()"
    [assignableRoles]="assignableRoles()"
    [pendingUserIds]="pendingUserIds()"
    (assignRole)="onAssignRole($event)"
  />
</fleet-kit-async-state>
