<app-config-master
  paneId="admin-credentials" listCaption="Credentials" [filter]="lifecycle()" [rows]="rows()" [state]="state()"
  [emptyText]="emptyText()" [selectedKey]="selectedKey()" [drilldown]="mobile()"
  backLabel="Credentials" testidPrefix="admin-credentials" [canCreate]="canCreate()" newLabel="New credential"
  (create)="onNew()" (filterChange)="onFilter($event)" (pick)="onPick($event)" (back)="onBack()"
>
  <router-outlet />
</app-config-master>
@if (createOpen()) {
  <app-config-form-dialog heading="New credential" mode="create" [fields]="fields()" submitLabel="Create"
    [submitError]="createError()" [submitting]="createMutation.isPending()" testidPrefix="admin-credentials-create"
    (closed)="createOpen.set(false)" (submitted)="onCreate($event)" />
}
