<fleet-kit-button testid="credential-check-run" [disabled]="mutation.isPending()" (click)="run()">
  {{ mutation.isPending() ? 'Checking…' : 'Check credential' }}
</fleet-kit-button>
<fleet-kit-error-line testid="credential-check-error" [message]="error()" />
@if (vm(); as vm) {
  <app-credential-check-table [vm]="vm" />
}
