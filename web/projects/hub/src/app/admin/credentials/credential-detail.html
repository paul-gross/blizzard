<app-config-record-panel
  [vm]="vm()" [state]="state()" [lastChange]="lastChange()" [revisions]="revisions()"
  [revisionsState]="revisionsState()" [cliCommand]="cliCommand()" [actions]="actions()"
  [busy]="busy()" [actionError]="actionError()" (edit)="onEdit()" (lifecycle)="onLifecycle($event)"
  emptyText="Pick a credential." testidPrefix="admin-credential"
>
  @if (check(); as target) {
    <app-credential-check [target]="target" />
  }
</app-config-record-panel>
@if (baseline(); as session) {
  <app-credential-form heading="Edit credential" mode="edit" [form]="editForm" [fields]="fields"
    [baseline]="session.draft" [presentationDiff]="changes()" [settingsUnavailable]="unavailable()"
    submitLabel="Save" testidPrefix="admin-credential-edit" (closed)="baseline.set(null)" (save)="onSave()" />
}
