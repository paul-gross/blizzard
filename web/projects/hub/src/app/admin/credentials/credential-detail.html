<app-config-record-panel
  [vm]="vm()" [state]="state()" [lastChange]="lastChange()" [revisions]="revisions()"
  [revisionsState]="revisionsState()" [cliCommand]="cliCommand()" [actions]="actions()"
  [busy]="busy()" [actionError]="actionError()" (edit)="onEdit()" (lifecycle)="onLifecycle($event)"
  emptyText="Pick a credential." testidPrefix="admin-credential"
/>
@if (editOpen() && shown(); as initial) {
  <app-config-form-dialog heading="Edit credential" mode="edit" [fields]="fields()" [initial]="initial"
    submitLabel="Save" [submitError]="editError()" [submitting]="editMutation.isPending()"
    testidPrefix="admin-credential-edit" (closed)="editOpen.set(false)" (submitted)="onSave($event)" />
}
