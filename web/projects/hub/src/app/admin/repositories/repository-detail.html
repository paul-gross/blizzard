<app-config-record-panel
  [vm]="vm()"
  [state]="state()"
  [lastChange]="lastChange()"
  [revisions]="revisions()"
  [revisionsState]="revisionsState()"
  [cliCommand]="cliCommand()"
  [actions]="actions()"
  [busy]="busy()"
  [actionError]="actionError()"
  (edit)="onEdit()"
  (lifecycle)="onLifecycle($event)"
  emptyText="Pick a repository."
  testidPrefix="admin-repository"
>
  @if (check(); as target) {
    <app-credential-check [target]="target" />
  }
</app-config-record-panel>
@if (editBaseline(); as base) {
  <app-config-field-tree-dialog
    heading="Edit repository"
    mode="edit"
    [form]="editForm"
    [fields]="fields()"
    [baseline]="base"
    hint="Allow no CI only permits absent checks, not failing or pending checks. The setting is snapshotted at the first turn of a visit; changes affect later visits."
    submitLabel="Save"
    testidPrefix="admin-repository-edit"
    (closed)="onCloseEdit()"
    (save)="onSave()"
  />
}
