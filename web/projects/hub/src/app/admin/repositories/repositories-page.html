<app-config-master
  paneId="admin-repositories"
  [listCaption]="caption()"
  [filter]="lifecycle()"
  [rows]="rows()"
  [state]="state()"
  [emptyText]="emptyText()"
  [selectedKey]="selectedKey()"
  [drilldown]="mobile()"
  backLabel="Repositories"
  testidPrefix="admin-repositories"
  [canCreate]="canCreate()"
  newLabel="New repository"
  (create)="onNew()"
  (filterChange)="onFilter($event)"
  (pick)="onPick($event)"
  (back)="onBack()"
>
  <router-outlet />
</app-config-master>
@if (createOpen()) {
  <app-config-form-dialog
    heading="New repository"
    mode="create"
    [fields]="fields()"
    hint="Allow no CI only permits absent checks, not failing or pending checks. The setting is snapshotted at the first turn of a visit; changes affect later visits."
    submitLabel="Create"
    [submitError]="createError()"
    [submitting]="createMutation.isPending()"
    testidPrefix="admin-repositories-create"
    (closed)="createOpen.set(false)"
    (submitted)="onCreate($event)"
    (valuesChange)="onValues($event)"
  />
}
