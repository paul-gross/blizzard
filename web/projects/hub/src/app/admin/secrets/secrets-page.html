<app-config-master
  paneId="admin-secrets"
  listCaption="Secrets"
  [filter]="lifecycle()"
  [rows]="rows()"
  [state]="state()"
  [emptyText]="emptyText()"
  [selectedKey]="selectedKey()"
  [drilldown]="mobile()"
  backLabel="Secrets"
  testidPrefix="admin-secrets"
  footer="Values are write-only — the board never receives one."
  [canCreate]="canCreate()"
  newLabel="New secret"
  (create)="onNew()"
  (filterChange)="onFilter($event)"
  (pick)="onPick($event)"
  (back)="onBack()"
>
  <router-outlet />
</app-config-master>
@if (createOpen()) {
  <app-config-form-dialog
    heading="New secret"
    mode="create"
    [fields]="fields"
    submitLabel="Create"
    [submitError]="createError()"
    [submitting]="createMutation.isPending()"
    testidPrefix="admin-secrets-create"
    (closed)="createOpen.set(false)"
    (submitted)="onCreate($event)"
  />
}
