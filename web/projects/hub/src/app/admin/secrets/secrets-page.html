<app-lens-note surface="Secrets" />
<app-config-master
  paneId="admin-secrets"
  listCaption="Secrets"
  [filter]="lifecycle()"
  [rows]="rows()"
  [state]="state()"
  [emptyText]="emptyText()"
  [selectedKey]="selectedKey()"
  [drilldown]="mobile()"
  backLabel="Secrets"
  testidPrefix="admin-secrets"
  [canCreate]="canCreate()"
  newLabel="New secret"
  (create)="onNew()"
  (filterChange)="onFilter($event)"
  (pick)="onPick($event)"
  (back)="onBack()"
>
  <router-outlet />
</app-config-master>
@if (createOpen()) {
  <app-config-field-tree-dialog
    heading="New secret"
    mode="create"
    [form]="createForm"
    [fields]="fields"
    submitLabel="Create"
    testidPrefix="admin-secrets-create"
    (closed)="createOpen.set(false)"
    (save)="onCreate()"
  />
}
