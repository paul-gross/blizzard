<app-config-record-panel
  [vm]="vm()"
  [state]="state()"
  [lastChange]="lastChange()"
  [revisions]="revisions()"
  [revisionsState]="revisionsState()"
  [cliCommand]="cliCommand()"
  [actions]="actions()"
  [busy]="busy()"
  [actionError]="actionError()"
  (replace)="onReplace()"
  (lifecycle)="onLifecycle($event)"
  emptyText="Pick a secret."
  testidPrefix="admin-secret"
/>
@if (replaceOpen()) {
  <app-config-form-dialog
    heading="Replace secret value"
    mode="replace"
    [fields]="fields"
    submitLabel="Replace"
    [submitError]="replaceError()"
    [submitting]="replaceMutation.isPending()"
    testidPrefix="admin-secret-replace"
    (closed)="replaceOpen.set(false)"
    (submitted)="onSave($event)"
  />
}
