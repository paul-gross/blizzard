@if (allowed()) {
  <h1>Hub settings</h1><fleet-kit-section-head label="Keys" />
  <fleet-kit-async-state [state]="state()" placement="inline" loadingText="Loading settings…" errorText="Failed to load settings." emptyText="No settings.">
    @for (row of rows(); track row.key) {
      <article>
        <app-config-record-panel [vm]="record(row)" state="ready" emptyText="No setting" testidPrefix="hub-setting" />
        <fleet-kit-button [disabled]="busy()" (click)="edit.emit(row)">Edit {{ row.key }}</fleet-kit-button>
      </article>
    }
  </fleet-kit-async-state>
  <fleet-kit-section-head label="History" />
  <app-config-revisions [rows]="revisions()" [state]="historyState()" testidPrefix="hub-settings" />
  @for (entry of entries(); track entry.rows[0].id) {
    <app-change-entry-panel [vm]="entry" state="ready" emptyText="" />
  }
  @if (hasNext()) { <fleet-kit-button [disabled]="loadingNext()" (click)="loadMore.emit()">Load more</fleet-kit-button> }
} @else if (!identityPending()) { <p>Hub settings are not available.</p> }
