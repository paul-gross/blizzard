<app-urgency-detail-view [vm]="vm()" [state]="state()" [lastChange]="lastChange()" [changes]="changes()" [changesState]="changesState()"
  [cli]="cli()" [actions]="actions()" [busy]="busy()" [actionError]="actionError()" [mobile]="mobile()" [record]="record()"
  [imageError]="imageError()" [editOpen]="editOpen() && editRevision()?.id === record()?.id" [editForm]="editForm" [editBaseline]="editRevision()?.draft ?? null"
  [retireSnapshot]="retireOpen() ? retireRevision() : null" [destination]="destination()" [destinationOptions]="destinationOptions()"
