<main class="main">
  <div class="col col-center">
    <fleet-board-shell
      class="board"
      [chunks]="boardChunks()"
      [readyOrder]="readyLaneOrder()"
      [backlogOrder]="backlogLaneOrder()"
      [state]="boardState()"
      [selectedChunkId]="selected()"
      [canControl]="canControl()"
      [canReorder]="canReorder()"
      (selectChunk)="select($event)"
      (promote)="onPromote($event)"
      (reposition)="reposition($event)"
    />
    @if (actionError(); as err) {
      <p class="notice action-notice" data-testid="board-action-error" role="alert">{{ err }}</p>
    }
    <fleet-chunk-detail
      class="dock"
      [chunkId]="selected()"
      [graphLinkBase]="['/graphs']"
      (dismiss)="select(null)"
    />
  </div>
  <div class="col rail-right">
    <fleet-runner-panel />
    <fleet-questions-panel (selectChunk)="select($event)" />
    <fleet-activity-panel class="rail-activity" />
  </div>
</main>
