<main class="main">
  <div class="col col-center">
    <app-board-shell
      class="board"
      [chunks]="boardChunks()"
      [counts]="counts()"
      [readyOrder]="readyLaneOrder()"
      [backlogOrder]="backlogLaneOrder()"
      [state]="boardState()"
      [selectedChunkId]="selected()"
      [gatedChunkIds]="gatedChunkIds()"
      [canControl]="canControl()"
      [canReorder]="canReorder()"
      [workItems]="workItems()"
      [projectColors]="projectColors()"
      [runnerHosts]="runnerHosts()"
      [layout]="layout()"
      [laneSkeletons]="laneSkeletons"
      [listSkeletons]="listSkeletons"
      (layoutChange)="setLayout($event)"
      (selectChunk)="select($event)"
      (reposition)="reposition($event)"
      (laneMove)="moveAcrossLanes($event)"
    />
    <fleet-kit-error-line class="action-notice" [message]="actionError()" testid="board-action-error" />
    <app-chunk-detail
      class="dock"
      [class.closed]="!selected()"
      [chunkId]="selected()"
      [graphLinkBase]="['/graphs']"
      (dismiss)="select(null)"
    />
  </div>
  <div class="col rail-right">
    <app-fleet-spend-panel />
    <app-runner-panel class="rail-runners" />
    <app-questions-panel (selectChunk)="select($event)" />
    <app-gates-panel (selectChunk)="select($event)" />
    <app-activity-panel class="rail-activity" />
  </div>
</main>
