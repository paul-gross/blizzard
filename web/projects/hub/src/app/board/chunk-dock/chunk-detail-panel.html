<aside class="dock" data-testid="chunk-detail" role="region" aria-label="Chunk detail">
  <app-chunk-detail-header
    [detail]="detail()"
    [projectColor]="projectColor()"
    [runnerHosts]="runnerHosts()"
    [control]="control()"
    [renderedStatus]="renderedStatus()"
    (dismiss)="dismiss.emit()"
  />

  <fleet-kit-error-line class="action-notice" [message]="actionError()" testid="action-error" />

  @if (actionOutcome(); as outcome) {
    <p class="outcome action-notice" data-testid="action-outcome" role="status">{{ outcome }}</p>
  }

  <div class="d-body">
    <section class="d-sec" aria-label="Work item">
      @if (showDelivery()) {
        <div class="d-box">
          <div class="s-head"><span class="tag">Delivery</span></div>
          <fleet-chunk-delivery [detail]="detail()" />
        </div>
      }
      <div class="d-box">
        <div class="s-head"><span class="tag">Work item · {{ pointerCount() }}</span></div>
        <fleet-chunk-detail-facts [detail]="detail()" />
      </div>
      <fleet-chunk-detail-awaiting-human
        [detail]="detail()"
        [canAnswer]="canAnswer()"
        [canResolve]="canResolve()"
        [resolvePending]="resolvePending()"
        [pendingAnswerQuestionIds]="pendingAnswerQuestionIds()"
        (answerQuestion)="answerQuestion.emit($event)"
        (resolveDecision)="resolveDecision.emit($event)"
      />
      <fleet-chunk-detail-issue-pane [workItems]="workItems()" />
    </section>
    <section class="d-sec d-sec--flush" aria-labelledby="chunk-timeline-heading">
      <fleet-chunk-detail-timeline [detail]="detail()" [graphLinkBase]="graphLinkBase()" />
    </section>
    <section class="d-sec d-sec--flush" aria-labelledby="chunk-artifacts-heading">
      <app-chunk-detail-artifacts [detail]="detail()" />
    </section>
  </div>
</aside>
