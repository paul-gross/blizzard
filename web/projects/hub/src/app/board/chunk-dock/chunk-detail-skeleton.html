<div class="frame">
  <div class="head">
    <div class="title">
      <fleet-kit-skeleton class="id" [rows]="1" />
      <fleet-kit-skeleton class="sub" [rows]="1" />
    </div>
    <div class="controls">
      <fleet-kit-skeleton class="control" [rows]="1" />
      <fleet-kit-skeleton class="control" [rows]="1" />
    </div>
  </div>
  <div class="body">
    <div class="col col--work">
      <div class="box">
        <fleet-kit-skeleton class="tag" [rows]="1" />
        <fleet-kit-skeleton class="bar w-55" [rows]="1" />
      </div>
      <div class="box">
        <fleet-kit-skeleton class="tag" [rows]="1" />
        <fleet-kit-skeleton class="bar w-90" [rows]="1" />
        <div class="edges">
          @for (side of edgeSides; track side) {
            <div class="edge-col">
              <fleet-kit-skeleton class="tag tag--sm" [rows]="1" />
              @for (w of side; track $index) {
                <div class="edge">
                  <fleet-kit-skeleton class="icon" [rows]="1" />
                  <fleet-kit-skeleton class="bar" [style.width.%]="w" [rows]="1" />
                </div>
              }
            </div>
          }
        </div>
      </div>
      @for (w of issueRows; track $index) {
        <div class="acc">
          <fleet-kit-skeleton class="icon" [rows]="1" />
          <fleet-kit-skeleton class="bar" [style.width.%]="w" [rows]="1" />
        </div>
      }
    </div>
    <div class="col col--list">
      <fleet-kit-skeleton class="tag s-head" [rows]="1" />
      <div class="timeline">
        @for (r of historyRows; track $index) {
          <div class="step">
            <fleet-kit-skeleton class="mark" [rows]="1" />
            <div class="cell">
              <fleet-kit-skeleton class="bar" [style.width.%]="r[0]" [rows]="1" />
              <fleet-kit-skeleton class="bar dim" [style.width.%]="r[1]" [rows]="1" />
            </div>
            <div class="cell">
              <fleet-kit-skeleton class="bar" [style.width.%]="r[2]" [rows]="1" />
              <fleet-kit-skeleton class="bar dim" [style.width.%]="r[3]" [rows]="1" />
            </div>
            <div class="cell time">
              <fleet-kit-skeleton class="bar t1" [rows]="1" />
              <fleet-kit-skeleton class="bar dim t2" [rows]="1" />
            </div>
          </div>
        }
      </div>
    </div>
    <div class="col col--list">
      <fleet-kit-skeleton class="tag s-head" [rows]="1" />
      @for (r of artifactRows; track $index) {
        <div class="art">
          <fleet-kit-skeleton class="bar" [style.width.%]="r[0]" [rows]="1" />
          <fleet-kit-skeleton class="bar dim kind" [style.width.px]="r[1]" [rows]="1" />
          <fleet-kit-skeleton class="bar dim date" [rows]="1" />
        </div>
      }
    </div>
  </div>
</div>
