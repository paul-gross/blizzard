<span class="label">Today</span>
<fleet-session-efficiency class="v" data-testid="glance-spend-value" [usage]="efficiency(today())" />
@if (yesterday(); as y) {
  <span class="label">Yesterday</span>
  <fleet-session-efficiency class="v" data-testid="glance-spend-yesterday" [usage]="efficiency(y)" />
}
