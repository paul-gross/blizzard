<div class="mc" data-testid="board-shell">
  <fleet-kit-panel class="board-panel" aria-label="Chunk board" label="Chunk board" [bodyScroll]="false">
    <div fleetKitPanelHeader class="hdr">
      <fleet-kit-tabs variant="sub" [options]="layoutTabs" [activeValue]="layout()" (choose)="chooseLayout($event)" />
    </div>
    @if (layout() === 'list') {
      <app-board-list
        class="list"
        [groups]="listGroups()"
        [selectedChunkId]="selectedChunkId()"
        [gatedChunkIds]="gatedChunkIds()"
        [skeletonRows]="state() === 'loading' ? listSkeletons() : 0"
        [canControl]="canControl()"
        [canReorder]="canReorder()"
        (selectChunk)="selectChunk.emit($event)"
        (reposition)="reposition.emit($event)"
        (laneMove)="laneMove.emit($event)"
      />
    } @else {
      <div class="board" data-testid="board">
        @for (col of columns(); track col.key) {
          <app-board-column
            [column]="col"
            [cards]="cardsFor(col.key)"
            [count]="countFor(col.key)"
            [headTitle]="headTitleFor(col.key)"
            [skeletons]="skeletonsFor(col.key)"
            [selectedChunkId]="selectedChunkId()"
            [gatedChunkIds]="gatedChunkIds()"
            [reorderControls]="col.key === 'ready' || col.key === 'notready'"
            [canControl]="canControl()"
            [canReorder]="canReorder()"
            (selectChunk)="selectChunk.emit($event)"
            (promote)="promote.emit($event)"
            (reposition)="reposition.emit($event)"
            (laneMove)="laneMove.emit($event)"
          />
        }
      </div>
    }
    <fleet-kit-async-state
      [state]="state()"
      loadingMode="content"
      errorText="FAILED TO LOAD FLEET"
      errorTestid="board-error"
      emptyText="NO CHUNKS — FLEET IDLE"
      emptyTestid="empty-state"
    >
      <!-- The lanes and the list draw their own skeletons in place; this only names the wait. -->
      <span loading class="loading-note" role="status" data-testid="board-loading">Loading chunks…</span>
    </fleet-kit-async-state>
  </fleet-kit-panel>
</div>
