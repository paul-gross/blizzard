@if (groups().length) {
  <div class="strip" data-testid="node-strip" role="img" [attr.aria-label]="'Graph progress'">
    @for (group of groups(); track $index) {
      <span class="group" [style.--blocks]="group.length">
        @for (block of group; track block.nodeId) {
          <span class="block" [attr.data-state]="block.state.kind"
            [style.--block-fill]="blockFill(block.state.kind)"
            [style.--block-edge]="blockEdge(block.state.kind)"
            [title]="block.name + ' · ' + blockStateLabel(block.state)"
          ></span>
        }
      </span>
    }
  </div>
}
