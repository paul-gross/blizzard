<fleet-kit-panel
  class="fill"
  aria-label="Open gates"
  data-testid="gates-panel"
  label="Open gates · awaiting decision"
  [count]="gates().length || null"
  countTestid="gates-count"
>
    <fleet-kit-async-state
      [state]="state()"
      placement="inline"
      loadingText="LOADING…"
      loadingTestid="gates-loading"
      errorText="FAILED TO LOAD GATES"
      errorTestid="gates-error"
      emptyText="NO OPEN GATES"
      emptyTestid="gates-empty"
    >
      @for (gate of gates(); track gate.decision_id) {
        <fleet-kit-select-row
          class="gg"
          data-testid="rail-gate"
          [attr.data-chunk]="gate.chunk_id"
          (click)="selectChunk.emit(gate.chunk_id)"
        >
          <span class="h">
            <span class="cid" data-testid="rail-gate-chunk">{{ shortId(gate.chunk_id) }}</span>
            <span class="origin" data-testid="rail-gate-origin">{{ origin(gate) }}</span>
          </span>
          <span class="node" data-testid="rail-gate-node">{{ gate.node_name }}</span>
          @if (choices(gate); as choiceLine) {
            <span class="opts" data-testid="rail-gate-choices">{{ choiceLine }}</span>
          }
        </fleet-kit-select-row>
      }
    </fleet-kit-async-state>
</fleet-kit-panel>
