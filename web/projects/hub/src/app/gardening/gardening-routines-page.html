<div class="gr-layout">
  <fleet-kit-panel class="gr-left" label="Routines">
    <fleet-routine-list
      [rows]="listRows()"
      [selectedName]="selectedRoutineName()"
      [state]="listState()"
      (routinePick)="selectRoutine($event)"
    />
  </fleet-kit-panel>
  <div class="gr-right">
    @if (mobile() && routineNameParam() !== null) {
      <a
        class="back-row"
        routerLink="/gardening/routines"
        queryParamsHandling="preserve"
        data-testid="gardening-routines-back"
      >
        <fleet-kit-back-bar label="Routines" />
      </a>
    }
    <router-outlet />
  </div>
</div>
