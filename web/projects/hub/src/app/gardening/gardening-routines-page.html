<div class="gr-layout">
  <fleet-kit-panel class="gr-left" label="Routines">
    <fleet-routine-list
      [rows]="listRows()"
      [selectedName]="selectedRoutineName()"
      [state]="listState()"
      (routinePick)="selectRoutine($event)"
    />
  </fleet-kit-panel>
  <div class="gr-right">
    <router-outlet />
  </div>
</div>
