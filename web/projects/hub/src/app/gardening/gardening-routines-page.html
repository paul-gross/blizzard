<div class="gr-layout">
  <fleet-routine-list
    class="gr-list"
    [rows]="listRows()"
    [selectedId]="selectedId()"
    [state]="listState()"
    (routinePick)="select($event)"
  />
  <fleet-routine-panel class="gr-panel" [vm]="panelVm()" [state]="panelState()" (run)="run()" />
</div>

@if (runningRoutine(); as routine) {
  <app-gardening-run-dialog
    [routineId]="routine.routine_id"
    [routineName]="routine.name"
    (closed)="closeDialog()"
  />
}
