<fleet-routine-panel
  [vm]="panelVm()"
  [state]="panelState()"
  [canEdit]="canEdit()"
  [actionError]="lifecycleActionError()"
  [lifecyclePending]="lifecyclePending()"
  (run)="run()"
  (retire)="onRetireRoutine()"
  (enable)="onEnableRoutine()"
/>

@if (panelVm(); as panel) {
  <fleet-routine-proposal-counts [rows]="proposalCountsRows()" [state]="proposalCountsState()" />
}

@if (runningRoutine(); as routine) {
  <app-gardening-run-dialog
    [routineId]="routine.routine_id"
    [routineName]="routine.name"
    (closed)="closeDialog()"
  />
}
