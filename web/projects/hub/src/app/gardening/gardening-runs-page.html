<div class="gr-layout">
  <fleet-kit-panel class="gr-list" label="Runs">
    <fleet-run-list
      [rows]="runs.listRows()"
      [selectedChunkId]="chunkId()"
      [state]="runs.listState()"
      (runPick)="selectRun($event)"
    />
  </fleet-kit-panel>

  <fleet-kit-panel class="gr-detail" label="Run">
    @if (mobile() && chunkId() !== null) {
      <a
        class="back-row"
        routerLink="/gardening/runs"
        queryParamsHandling="preserve"
        data-testid="gardening-runs-back"
      >
        <fleet-kit-back-bar label="Runs" />
      </a>
    }
    <router-outlet />
  </fleet-kit-panel>
</div>
