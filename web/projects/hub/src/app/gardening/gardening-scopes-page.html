<div class="gs-layout">
  <fleet-kit-panel class="gs-left" label="Scopes">
    <fleet-scope-list
      [rows]="scopeRows()"
      [selectedSlug]="selectedScopeSlug()"
      [state]="scopesState()"
      (scopePick)="selectScope($event)"
    />
  </fleet-kit-panel>
  <fleet-kit-panel class="gs-right" label="Scope">
    @if (mobile() && scopeSlugParam() !== null) {
      <a
        class="back-row"
        routerLink="/gardening/scopes"
        queryParamsHandling="preserve"
        data-testid="gardening-scopes-back"
      >
        <fleet-kit-back-bar label="Scopes" />
      </a>
    }
    <router-outlet />
  </fleet-kit-panel>
</div>
