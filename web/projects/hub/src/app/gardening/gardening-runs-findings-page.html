<div class="grf-layout">
  <fleet-run-list
    class="grf-list"
    [rows]="listRows()"
    [selectedChunkId]="chunkId()"
    [state]="listState()"
    (runPick)="select($event)"
  />
  <fleet-run-delta class="grf-delta" [vm]="deltaVm()" [state]="deltaState()" />
</div>

<section class="grf-bucket">
  <h3>Findings</h3>

  <div class="grf-bucket-picker">
    <label>
      Routine
      <select data-testid="gardening-findings-routine-select" (change)="onRoutineChoose($event)">
        <option value="" [selected]="selectedRoutine() === null" disabled>Choose a routine</option>
        @for (r of routines(); track r.routine_id) {
          <option [value]="r.name" [selected]="r.name === selectedRoutine()">{{ r.name }}</option>
        }
      </select>
    </label>
    <label>
      Scope
      <select data-testid="gardening-findings-scope-select" (change)="onScopeChoose($event)">
        <option value="" [selected]="selectedScope() === null" disabled>Choose a scope</option>
        @for (s of scopes(); track s.slug) {
          <option [value]="s.slug" [selected]="s.slug === selectedScope()">{{ s.slug }}</option>
        }
      </select>
    </label>
  </div>

  <div class="grf-bucket-filters">
    <fleet-kit-chips [options]="classChips()" [selectedValue]="classChipValue()" (choose)="onClassChoose($event)" />
    <fleet-kit-chips
      [options]="stateChips"
      [selectedValue]="stateFilter() ?? 'all'"
      (choose)="onStateChoose($event)"
    />
  </div>

  <p class="grf-bucket-summary" data-testid="gardening-findings-summary">
    {{ outflowCount() }} resolved · {{ withdrawnCount() }} struck
  </p>

  <fleet-finding-list
    [rows]="findingListRows()"
    [state]="bucketState()"
    [canControl]="canControl()"
    (bulkTriage)="triagingBulkAction.set($event)"
  />
</section>

@if (triagingBulkAction(); as t) {
  <app-gardening-finding-triage-dialog
    [verb]="t.verb"
    [findingIds]="t.findingIds"
    (closed)="triagingBulkAction.set(null)"
  />
}
