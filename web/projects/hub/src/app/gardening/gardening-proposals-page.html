<div class="gp-filters">
  <fleet-kit-chips
    [options]="waitingChips"
    [selectedValue]="waitingChipValue()"
    (choose)="onWaitingChoose($event)"
  />
  <fleet-kit-chips [options]="classChips()" [selectedValue]="classChipValue()" (choose)="onClassChoose($event)" />
</div>

<div class="gp-layout">
  <fleet-proposal-list
    class="gp-list"
    [rows]="listRows()"
    [selectedId]="proposalId()"
    [state]="listState()"
    (proposalPick)="select($event)"
  />
  <div class="gp-panel">
    <router-outlet />
  </div>
</div>
