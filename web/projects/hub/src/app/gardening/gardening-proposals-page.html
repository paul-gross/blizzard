<div class="gp-filters">
  <fleet-kit-chips
    [options]="waitingChips"
    [selectedValue]="waitingChipValue()"
    (choose)="onWaitingChoose($event)"
  />
  <fleet-kit-chips [options]="classChips()" [selectedValue]="classChipValue()" (choose)="onClassChoose($event)" />
  <fleet-kit-chips
    [options]="routineChips()"
    [selectedValue]="routineChipValue()"
    (choose)="onRoutineChoose($event)"
  />
</div>

<div class="gp-layout">
  <fleet-proposal-list
    class="gp-list"
    [rows]="listRows()"
    [selectedId]="proposalId()"
    [state]="listState()"
    (proposalPick)="select($event)"
  />
  <div class="gp-panel">
    @if (mobile() && proposalId() !== null) {
      <a
        class="back-row"
        routerLink="/gardening/proposals"
        queryParamsHandling="preserve"
        data-testid="gardening-proposals-back"
      >
        <fleet-kit-back-bar label="Proposals" />
      </a>
    }
    <router-outlet />
  </div>
</div>
