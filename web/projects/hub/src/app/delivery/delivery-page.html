<div class="page" data-testid="delivery-page">
  <div class="scroll">
    <app-delivery-list [state]="state()" [list]="list()" [now]="now()" [selectedId]="selectedId()" (picked)="pick($event)" />
  </div>
  @if (selectedRow(); as row) {
    <app-delivery-drawer class="drawer" [chunkId]="row.chunk.chunkId" [flows]="flows()" [repositories]="repositories()" (dismiss)="clear()" />
  }
</div>
