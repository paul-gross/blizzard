<span class="gid" data-testid="graph-detail-graph-id">{{ graphId() }}</span>
<fleet-kit-badge class="lifecycle" data-testid="graph-detail-lifecycle-badge" [tone]="lifecycleTone(renderedRetired())">{{
  renderedRetired() ? 'retired' : 'enabled'
}}</fleet-kit-badge>
<!-- Retire/re-enable are graph authoring — gated on graph:edit, an admin-tier
     permission: a contributor sees the lifecycle text but not the control. The
     control shown stays keyed off the real `retired()`, not the pending
     override, so a pending mutation's own predicted outcome never flips which
     verb the next click would fire. -->
@if (canEdit()) {
  @if (retired()) {
    <fleet-kit-button testid="graph-detail-enable" [disabled]="lifecyclePending()" (click)="onEnable()">Re-enable</fleet-kit-button>
  } @else {
    <fleet-kit-button testid="graph-detail-retire" variant="danger" [disabled]="lifecyclePending()" (click)="onRetire()">Retire</fleet-kit-button>
  }
}

@if (pendingConfirm(); as confirm) {
  <fleet-kit-confirm-dialog
    [open]="true"
    [heading]="confirm.heading"
    [message]="confirm.message"
    [confirmLabel]="confirm.confirmLabel"
    [variant]="confirm.variant"
    testid="confirm-dialog"
    (confirmed)="onConfirmed()"
    (cancelled)="onCancelled()"
  />
}
