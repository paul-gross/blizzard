<div class="lens" role="group" aria-label="Project lens" data-testid="project-lens">
  <span class="lens-label" aria-hidden="true">Project lens</span>
  <div class="chips">
    @for (choice of choices(); track choice.slug) {
      <fleet-kit-chip
        [selected]="choice.slug === current()"
        [title]="choice.slug ?? 'every project of the tenant'"
        [testid]="'project-lens-' + (choice.slug ?? 'all')"
        (click)="onChoose(choice)"
        >{{ choice.label }}</fleet-kit-chip
      >
    }
  </div>
</div>
