<fleet-kit-menu class="menu" ariaLabel="Profile menu" testid="app-nav-menu" [menu]="profileMenu">
  <fleet-kit-avatar trigger />
</fleet-kit-menu>
<ng-template #profileMenu>
  <fleet-kit-menu-panel testid="app-nav-menu-panel">
    <fleet-kit-menu-item testid="nav-logout" [disabled]="logoutPending()" (triggered)="logout.emit()">Log out</fleet-kit-menu-item>
    @if (tenants.switchable()) {
      <fleet-kit-menu-item testid="nav-tenant" submenu [cdkMenuTriggerFor]="tenantMenu">Switch tenant</fleet-kit-menu-item>
    }
    <fleet-kit-menu-item testid="nav-appearance" submenu [cdkMenuTriggerFor]="appearanceMenu">
      Appearance
    </fleet-kit-menu-item>
  </fleet-kit-menu-panel>
</ng-template>
<ng-template #tenantMenu>
  <app-tenant-menu
    testid="nav-tenant-panel"
    [tenants]="tenants.memberships()"
    [current]="tenants.current()?.tenant_id ?? null"
    (choose)="tenants.switchTo($event)"
  />
</ng-template>
<ng-template #appearanceMenu>
  <fleet-viewport-menu testid="nav-appearance-panel" />
</ng-template>
