<fleet-mobile-titlebar [live]="live()" [menu]="shellMenu">
  <a fleetMobileTitle class="lens" data-testid="mobile-titlebar-lens" [routerLink]="pickerLink | lensLink" [queryParams]="{ from: fromView() }" [attr.title]="lensName()">
    <span class="sep" aria-hidden="true">·</span>
    @if (lensed()?.color; as color) {
      <fleet-kit-swatch class="swatch" [color]="color" />
    }
    <span class="name">{{ lensName() }}</span>
  </a>
  @if (spendToday(); as spend) {
    <span fleetMobileStatus class="spend" title="Spend today" data-testid="mobile-titlebar-spend">{{
      formatCost(spend.cost_usd, spend.estimated_cost_usd, spend.cost_partial)
    }}</span>
  }
</fleet-mobile-titlebar>
<ng-template #shellMenu>
  <fleet-kit-menu-panel testid="mobile-titlebar-menu-panel">
    @if (tenants.switchable()) {
      <fleet-kit-menu-item testid="mobile-titlebar-tenant" submenu [cdkMenuTriggerFor]="tenantMenu">
        Switch tenant
      </fleet-kit-menu-item>
    }
    <fleet-kit-menu-item testid="mobile-titlebar-appearance" submenu [cdkMenuTriggerFor]="appearanceMenu">
      Appearance
    </fleet-kit-menu-item>
  </fleet-kit-menu-panel>
</ng-template>
<ng-template #tenantMenu>
  <app-tenant-menu
    testid="mobile-titlebar-tenant-panel"
    [tenants]="tenants.memberships()"
    [current]="tenants.current()?.tenant_id ?? null"
    (choose)="tenants.switchTo($event)"
  />
</ng-template>
<ng-template #appearanceMenu>
  <fleet-viewport-menu testid="mobile-titlebar-appearance-panel" />
</ng-template>
