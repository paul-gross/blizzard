<fleet-kit-panel class="dock" data-testid="machine-detail">
  @if (newestLease(); as l) {
    <local-machine-detail-header
      fleetKitPanelHeader
      [chunkId]="l.chunk_id"
      [workRefs]="workRefs()"
      [statusLabel]="status()?.label ?? null"
      [statusTone]="status()?.tone"
      [nodeName]="l.node_name"
      [epoch]="l.epoch"
      [runnerName]="runnerName()"
      [pause]="pause()"
      [pausable]="pausable()"
      [pending]="pausePending()"
      (dismiss)="dismiss.emit()"
      (pauseChunk)="onPause($event)"
      (resumeChunk)="onResume($event)"
    />
  }
  @if (newestLease() && actionError(); as err) {
    <p class="notice action-notice" data-testid="action-error" role="alert">{{ err }}</p>
  }
  <local-machine-detail-view
    [lease]="newestLease()"
    [escalation]="escalation()"
    [leaseRef]="leaseRef()"
    [heartbeatLabel]="heartbeatLabel()"
  />
</fleet-kit-panel>
