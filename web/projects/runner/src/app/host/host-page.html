<div class="page" data-testid="host-page">
  <app-host-title [name]="hostName()" [hostId]="hostId()" [hostRef]="hostRef()" [registration]="registration()" [tone]="hostTone()" />
  <fleet-kit-panel class="sec" label="Subscription usage" [bodyScroll]="false" data-testid="host-subscriptions">
    <fleet-kit-async-state
      [state]="subscriptionsState()"
      placement="inline"
      loadingText="LOADING…"
      errorText="SUBSCRIPTIONS UNAVAILABLE"
      emptyText="NO SUBSCRIPTIONS DECLARED"
      emptyTestid="host-subscriptions-empty"
    >
      <div class="sec-bd">
        <fleet-subscription-pace-group class="subs" [subscriptionPaces]="subscriptions()" />
      </div>
    </fleet-kit-async-state>
  </fleet-kit-panel>
  <fleet-kit-panel class="sec" [label]="'Runners · ' + rows().length" [bodyScroll]="false" data-testid="host-runners">
    <fleet-kit-async-state
      [state]="triadState()"
      placement="inline"
      loadingText="LOADING…"
      errorText="RUNNERS UNAVAILABLE"
      [emptyText]="runnersEmptyText()"
      emptyTestid="host-runners-empty"
    >
      <div role="list">
        @for (row of rows(); track row.key) {
          <app-host-runner-row [row]="row">
            @if (row.runnerId && !row.halted) {
              <app-pause-control verbs [runnerId]="row.runnerId" [compact]="true" />
            }
          </app-host-runner-row>
        }
      </div>
    </fleet-kit-async-state>
  </fleet-kit-panel>
  <app-host-environments [groups]="environments()" [inUseLabel]="envsLabel()" [state]="environmentsState()" />
</div>
