<div class="filter" [attr.data-testid]="testid()">
  <span class="filter-label" aria-hidden="true">{{ label() }}</span>
  <div class="chips" fleetKitChipGroup orientation="horizontal" [attr.aria-label]="label()"
    [value]="current()" [hasSelection]="hasCurrent()" [selectionMode]="hasCurrent() ? 'follow' : 'explicit'"
    (valueChange)="onChoose($event)">
    @for (choice of choices(); track choice.value) {
      <fleet-kit-chip
        fleetKitChipOption
        [value]="choice.value"
        [label]="choice.label"
        [disabled]="choice.disabled"
        [title]="choice.title"
        [testid]="testid() + '-' + (choice.value ?? 'all')"
        >@if (choice.color; as color) {<fleet-kit-swatch class="swatch" [color]="color" />}{{ choice.label }}@if (choice.brake; as glyph) {<fleet-kit-glyph
            class="brake"
            data-testid="runner-brake"
            [glyph]="glyph"
            [label]="choice.title"
          />}</fleet-kit-chip
      >
    }
  </div>
</div>
