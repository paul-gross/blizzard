<fleet-board-header [connection]="connection()" [overridden]="flags.overridden()" connectionLabel="Runner" tagline="runner · host panel" [stats]="headerStats()">
  <!-- Display-only: this shell's logout is the profile menu's item, so it does
       not vanish with the header cell at the narrow tier, and all three of
       the app's profile menus carry the same two items. -->
  <app-identity #identity header-trailing variant="label" />
  <!-- The identity block is display-only here, so a failed logout surfaces in
       the header's own alert — outside the menu panel, where the failure of its
       Log out item has to stay readable. -->
  @if (logout.error(); as error) {
    <span header-trailing class="logout-error" role="alert" data-testid="local-panel-logout-error">{{ error }}</span>
  }
  <!-- A @defer block does not carry its root node's slot attribute through to
       projection, so the wrapper names the slot instead. `on immediate` fetches the
       menu right after first render, so the header is usable before it lands. -->
  <ng-container ngProjectAs="[header-trailing]">
    @defer (on immediate) {
      <app-profile-menu />
    }
  </ng-container>
</fleet-board-header>
