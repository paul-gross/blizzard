<div class="switcher" role="group" aria-label="Runner" data-testid="runner-switcher">
  <span class="switcher-label" aria-hidden="true">Runner</span>
  <div class="chips">
    @for (choice of choices(); track $index) {
      <fleet-kit-chip
        [selected]="choice.runnerId !== null && choice.runnerId === active()"
        [disabled]="!choice.openable"
        [title]="choice.openable ? (choice.brake ?? choice.name) : choice.name + ' is halted'"
        [testid]="'runner-switcher-' + (choice.runnerId ?? choice.name)"
        (click)="choose(choice)"
        >{{ choice.name }}@if (choice.brake) {<span class="brake" data-testid="runner-brake"> · {{ choice.brake }}</span>}</fleet-kit-chip
      >
    }
  </div>
</div>
