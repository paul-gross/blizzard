<fleet-kit-menu class="menu" ariaLabel="Profile menu" testid="local-panel-menu" [menu]="profileMenu">
  <fleet-kit-avatar trigger />
</fleet-kit-menu>
<ng-template #profileMenu>
  <fleet-kit-menu-panel testid="local-panel-menu-panel">
    @if (signedIn()) {
      <fleet-kit-menu-item testid="local-panel-logout" [disabled]="logout.pending()" (triggered)="logout.logout()">Log out</fleet-kit-menu-item>
    }
    <fleet-kit-menu-item testid="local-panel-appearance" submenu [cdkMenuTriggerFor]="appearanceMenu">
      Appearance
    </fleet-kit-menu-item>
  </fleet-kit-menu-panel>
</ng-template>
<ng-template #appearanceMenu>
  <fleet-viewport-menu testid="local-panel-appearance-panel" />
</ng-template>
