@if (recovering()) {
  <app-session-recovery (retry)="onRetry()" />
} @else {
  <fleet-app-shell>
    <!-- Each slotted node sits in its own @if/@else pair rather than
         sharing an @else with a sibling: a control-flow branch with more
         than one root node cannot resolve which named ng-content slot
         each child belongs to (NG8011), so AppShell's ordering
         guarantee only holds when every projected node is the sole root
         of its own branch. -->
    @if (mobile()) {
      <!-- The titlebar's menu stack is interaction-only chrome, so it is
           @defer-loaded: an eager reference from this template would keep the
           CDK menu/overlay code in the initial chunk. `on immediate` fetches it
           right after first render. A @defer block does not carry its root
           node's slot attribute through to projection, so the wrapper names the
           slot instead. -->
      <ng-container ngProjectAs="[shell-header]">
        @defer (on immediate) {
          <app-mobile-titlebar />
        } @placeholder {
          <!-- Holds the titlebar's box so the routed content below does not
               shift when the real titlebar arrives. -->
          <div class="titlebar-placeholder" data-testid="mobile-titlebar-placeholder"></div>
        }
      </ng-container>
    } @else {
      <app-header shell-header />
    }
    @if (mobile()) {
      <app-panel-filters shell-nav variant="mobile" />
    } @else {
      <app-nav shell-nav />
    }
    <router-outlet />
    @if (mobile()) {
      <app-mobile-tab-bar shell-tab-bar />
    }
  </fleet-app-shell>
}
