<div class="wrap" data-testid="hub-panel">
  <fleet-kit-async-state
    [state]="triadState()"
    placement="inline"
    loadingText="LOADING…"
    errorText="HUB LINK UNAVAILABLE"
    emptyText="NO RUNNER REPORTS A HUB"
    emptyTestid="hub-panel-empty"
  >
    <app-hub-panel-view [summary]="summary()" [link]="link()" [fleet]="fleet()" [fleetStale]="fleetStale()" />
  </fleet-kit-async-state>
</div>
