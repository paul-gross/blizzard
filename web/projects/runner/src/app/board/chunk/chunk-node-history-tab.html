<fleet-kit-master-detail data-testid="chunk-node-history-tab" paneId="node-history" backLabel="Node history" listCaption="Timeline">
  <fleet-chunk-detail-timeline-selection
    kit-master-detail-list
    [detail]="detail()"
    [selectedKey]="selectedKey()"
    (pickStep)="pickStep.emit($event)"
  />
  <ng-container kit-master-detail-detail>
    @if (selectedKey() === null) {
      <fleet-kit-async-state
        state="empty"
        placement="inline"
        emptyText="Select a step above."
        emptyTestid="node-history-select-hint"
      />
    } @else {
      <div class="nh-artifacts">
        <div class="s-head"><span class="tag">Artifacts</span></div>
        @if (stepArtifacts().length === 0) {
          <fleet-kit-async-state
            state="empty"
            placement="inline"
            emptyText="No artifacts for this step."
            emptyTestid="node-history-artifacts-empty"
          />
        } @else {
          @for (art of stepArtifacts(); track art.key) {
            <fleet-chunk-detail-artifact-body class="art" [artifact]="art" body="full" testid="node-history-artifact" />
          }
        }
      </div>
    }
  </ng-container>
</fleet-kit-master-detail>
