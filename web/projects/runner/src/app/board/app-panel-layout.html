<div class="lp" data-testid="local-panel">
  <main class="cols">
    <section class="col center">
      <app-chunk-board
        class="board"
        [rows]="machineChunks()"
        [layout]="layout()"
        [state]="chunksTriadState()"
        [selectedChunkId]="selectedChunkId()"
        (selectChunk)="selectChunk.emit($event)"
        (layoutChange)="layoutChange.emit($event)"
      />
      <app-machine-detail
        class="detail-frame"
        [class.closed]="selectedChunkLeases().length === 0"
        [leases]="selectedChunkLeases()"
        [status]="selectedStatus()"
        [escalation]="selectedEscalation()"
        (dismiss)="dismiss.emit()"
      />
    </section>
    <section class="col right">
      <app-board-rail class="rail" [runners]="runners()" [openAskCount]="openAskCount()" />
    </section>
  </main>
</div>
