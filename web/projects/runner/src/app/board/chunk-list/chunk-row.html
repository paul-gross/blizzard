@if (layout() === 'list') {
  <app-chunk-list-row-view
    [row]="row()"
    [projectTint]="projectTint()"
    [selected]="selected()"
    [linkedItems]="linkedItems()"
    (selectChunk)="selectChunk.emit($event)"
  />
} @else {
  <app-chunk-row-view
    [row]="row()"
    [projectTint]="projectTint()"
    [selected]="selected()"
    [linkedItems]="linkedItems()"
    (selectChunk)="selectChunk.emit($event)"
  />
}
