<div
  class="row"
  data-testid="list-row"
  [attr.data-chunk-id]="chunkId()"
  [attr.data-lane]="row().lane"
  [class.selected]="selected()"
  [class.tinted]="projectTint() !== null"
  [style.--project-tint]="projectTint()"
  [attr.title]="row().projectName"
  role="button"
  tabindex="0"
  (click)="onSelect()"
  (keydown.enter)="onSelect($event)"
  (keydown.space)="onSelect($event)"
>
  <div class="work">
    <span class="id" data-testid="list-row-id">{{ chunkRef() }}</span>
    @for (item of linkedItems(); track item.ref) {
      <span class="item">
        <span class="ref" [title]="item.label ?? item.ref">{{ item.label ?? item.ref }}</span>
        @if (item.title; as title) {
          <span class="title" data-testid="list-row-title" [title]="title">{{ title }}</span>
        }
      </span>
    }
  </div>
  <!-- Where the chunk is: the runner holding it, the step beneath, then its live worker. -->
  <span class="cell holder">
    <span class="runner" data-testid="list-row-runner" [title]="row().lease.owner.label">{{ row().lease.owner.label }}</span>
    <span class="step-name" [title]="row().lease.node_name">{{ row().lease.node_name }}</span>
    @if (row().live; as live) {
      <app-worker-line data-testid="list-row-worker" [lease]="live" [showNode]="false" />
    }
  </span>
  <span class="cell state">
    @if (showsStatus()) {
      <fleet-kit-badge [tone]="row().status.tone" data-testid="list-row-status">{{ row().status.label }}</fleet-kit-badge>
    }
  </span>
</div>
