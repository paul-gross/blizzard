<div
  class="c-card"
  data-testid="local-chunk-card"
  [attr.data-chunk-id]="chunkId()"
  [class.selected]="selected()"
  role="button"
  tabindex="0"
  (click)="onSelect()"
  (keydown.enter)="onSelect($event)"
  (keydown.space)="onSelect($event)"
>
  <div class="line1">
    <span class="cid">{{ chunkRef() }}</span>
    <fleet-kit-badge
      class="pill"
      [tone]="status().tone"
      variant="soft"
      data-testid="local-chunk-card-status"
    >
      {{ status().label }}
    </fleet-kit-badge>
  </div>
  <div class="line2" data-testid="local-chunk-card-title">
    @for (item of linkedItems(); track item.ref) {
      <div class="wi">
        <fleet-work-ref-link [workRef]="item" appearance="chip" />
        {{ item.title }}
      </div>
    }
  </div>
  <div class="line3" data-testid="local-chunk-card-node">@if (runnerLabel(); as runner) {<span data-testid="local-chunk-card-runner">{{ runner }}</span> · }{{ lease().node_name }} · a{{ lease().epoch }}</div>
</div>
