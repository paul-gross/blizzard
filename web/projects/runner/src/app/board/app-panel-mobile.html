<div class="lpm" data-testid="local-panel-mobile">
  @if (detailOpen()) {
    <div class="lpm-detail" data-testid="panel-chunk-detail">
      <fleet-kit-button class="back-row" ariaLabel="Back to Machine" testid="mobile-detail-back" (click)="closeDetail.emit()">
        <fleet-kit-back-bar label="Machine" />
      </fleet-kit-button>
      <app-machine-detail
        class="md"
        [leases]="selectedChunkLeases()"
        [status]="selectedStatus()"
        [escalation]="selectedEscalation()"
        (dismiss)="closeDetail.emit()"
      />
    </div>
  } @else {
    <div class="lpm-sections">
      <app-chunk-board
        class="section board"
        data-testid="mobile-chunks-pane"
        [stacked]="true"
        [rows]="machineChunks()"
        [layout]="layout()"
        [state]="chunksTriadState()"
        (selectChunk)="selectChunk.emit($event)"
        (layoutChange)="layoutChange.emit($event)"
      />
      <app-board-rail class="section" [stacked]="true" [openAskCount]="openAskCount()" />
    </div>
  }
</div>
