<div class="pause-control" [class.compact]="compact()" data-testid="pause-control">
  @if (hubPaused() && !compact()) {
    <fleet-kit-badge tone="waiting" variant="pill" data-testid="hub-paused-badge">Paused by hub</fleet-kit-badge>
  }
  <fleet-kit-button
    [variant]="localPaused() ? 'danger' : 'default'"
    [disabled]="pending()"
    [ariaLabel]="(localPaused() ? 'Resume' : 'Pause') + ' this runner'"
    testid="pause-toggle"
    (click)="toggle()"
  >
    {{ localPaused() ? 'Resume' : 'Pause' }}
  </fleet-kit-button>
  @if (!compact() && localPaused() && localReason(); as reason) {
    <fleet-kit-badge tone="waiting" variant="pill" data-testid="pause-reason-badge">{{ reason }}</fleet-kit-badge>
  }
  <fleet-kit-error-line [message]="error()" testid="pause-error" />
</div>
