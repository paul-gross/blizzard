<section class="runner" data-testid="runner-machine" [attr.data-runner-id]="runner().runnerId">
  <fleet-kit-panel class="control-panel" [label]="'runner · ' + runner().label" data-testid="machine-control-pane">
    <div class="control">
      <app-pause-control [runnerId]="runner().runnerId" />
    </div>
  </fleet-kit-panel>
  <fleet-kit-panel label="hub" data-testid="machine-info-pane">
    <app-info [runnerId]="runner().runnerId" />
  </fleet-kit-panel>
  <fleet-kit-panel label="harness health" data-testid="machine-harness-pane">
    <app-harness-health [runnerId]="runner().runnerId" />
  </fleet-kit-panel>
</section>
