<div class="machine" data-testid="machine-page">
  <fleet-kit-panel class="registration-panel" label="registration" data-testid="host-registration-pane">
    <app-host-registration />
  </fleet-kit-panel>
  <fleet-kit-panel label="runners" data-testid="host-runners-pane">
    <app-host-runners />
  </fleet-kit-panel>
  <fleet-kit-panel label="environments" data-testid="host-environments-pane">
    <app-host-environments />
  </fleet-kit-panel>
  <fleet-kit-panel label="subscriptions" data-testid="host-subscriptions-pane">
    <app-host-subscriptions />
  </fleet-kit-panel>
  @for (runner of sections(); track runner.runnerId) {
    <app-runner-machine [runner]="runner" />
  } @empty {
    <p class="none" data-testid="machine-no-runners">NO SERVING RUNNER MATCHES THE FILTERS</p>
  }
</div>
