<nav class="tabbar" [attr.data-testid]="testid()">
  @for (item of items(); track item.testid) {
    @if (item.route && !item.inert) {
      <a
        class="tab"
        [routerLink]="item.route"
        [queryParamsHandling]="item.queryParamsHandling ?? ''"
        routerLinkActive="on"
        [attr.data-testid]="item.testid"
      >
        {{ item.label }}
        @if (item.badge) {
          <fleet-kit-count-badge class="count" [count]="item.badge" [testid]="item.badgeTestid ?? null" />
        }
      </a>
    } @else {
      <!-- eslint-disable-next-line no-restricted-syntax -- Inert navigation tabs share native button semantics and router-link tab chrome. -->
      <button
        class="tab"
        [class.inert]="item.inert"
        [class.on]="item.active"
        type="button"
        [disabled]="!!item.inert"
        [attr.data-testid]="item.testid"
      >
        {{ item.label }}
        @if (item.badge) {
          <fleet-kit-count-badge class="count" [count]="item.badge" [testid]="item.badgeTestid ?? null" />
        }
      </button>
    }
  }
</nav>
