<div class="prose" [class]="'prose--' + kind()" [attr.data-testid]="testid()">
  <span class="rail"><span class="tick"></span></span>
  <div class="body">
    @if (label(); as label) {
      <div class="who">{{ label }}</div>
    }
    @if (format() === 'markdown') {
      <fleet-kit-markdown [text]="text()" />
    } @else {
      <div class="tx">{{ text() }}</div>
    }
  </div>
</div>
