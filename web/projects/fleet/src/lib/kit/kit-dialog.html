@if (open()) {
  <!-- The scrim's click-to-dismiss is a pointer-only convenience, not a keyboard gap:
       Escape (bound below) is the keyboard-equivalent dismissal, and the scrim itself
       holds no content a keyboard user needs to reach — cdkTrapFocusAutoCapture moves
       focus straight into the panel. -->
  <!-- eslint-disable-next-line @angular-eslint/template/interactive-supports-focus -->
  <div class="scrim" (click)="onBackdropClick()" (keydown.escape)="onEscape()">
    <!-- The panel's own click only stops propagation so a click inside it never
         bubbles to the scrim's dismiss handler above — not a user-facing action of
         its own, so it has no keyboard equivalent to pair it with. -->
    <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events -->
    <div
      class="panel"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="ariaLabel()"
      [attr.data-testid]="testid()"
      cdkTrapFocus
      cdkTrapFocusAutoCapture
      (click)="onPanelClick($event)"
    >
      <div class="p-hdr"><ng-content select="[fleetKitDialogHeader]" /></div>
      <!-- The inner wrapper is what `.p-body`'s centering places, and it exists
           because emulated encapsulation cannot style projected children: a
           `.p-body > *` rule here is scoped to this component's attribute, which
           projected nodes never carry. Owning one element instead keeps the
           content's own height out of the flex sizing. -->
      <div class="p-body"><div class="p-body-inner"><ng-content /></div></div>
      <div class="p-ftr"><ng-content select="[fleetKitDialogFooter]" /></div>
    </div>
  </div>
}
