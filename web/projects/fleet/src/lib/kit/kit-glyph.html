<svg class="glyph" viewBox="0 0 12 12" role="img" [attr.aria-label]="label()">
  @switch (glyph()) {
    @case ('pause') {
      <rect x="0.75" y="0.75" width="10.5" height="10.5" />
      <path d="M4.5 3.5v5M7.5 3.5v5" />
    }
    @case ('stop') {
      <path d="M3.9 0.75h4.2l3.15 3.15v4.2l-3.15 3.15h-4.2l-3.15-3.15v-4.2z" />
      <path d="M3.5 6h5" />
    }
    @default {}
  }
</svg>
