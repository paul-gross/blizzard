<div class="tabs" fleetKitTabStrip [variant]="variant()" role="tablist">
  @for (option of options(); track option.value) {
    <button
      type="button"
      class="tab"
      fleetKitTab
      [variant]="variant()"
      role="tab"
      [class.active]="option.value === activeValue()"
      [attr.aria-selected]="option.value === activeValue()"
      [attr.data-testid]="option.testid ?? null"
      [count]="option.count ?? null"
      (click)="choose.emit(option.value)"
    >
      {{ option.label }}
    </button>
  }
</div>
