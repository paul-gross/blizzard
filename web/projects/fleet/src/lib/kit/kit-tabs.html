<div
  class="tabs"
  fleetKitTabStrip
  ngTabList
  [variant]="variant()"
  [selectedTab]="active() ?? undefined"
  (selectedTabChange)="onSelected($event)"
>
  @for (option of options(); track option.value) {
    <button
      type="button"
      class="tab"
      fleetKitTab
      ngTab
      [value]="option.value"
      [variant]="variant()"
      [class.active]="option.value === active()"
      [attr.data-testid]="option.testid ?? null"
      [count]="option.count ?? null"
    >
      {{ option.label }}
    </button>
  }
</div>
