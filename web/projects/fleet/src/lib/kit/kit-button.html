<button
  type="button"
  class="act"
  [class.primary]="variant() === 'primary'"
  [class.danger]="variant() === 'danger'"
  [class.cta]="size() === 'cta'"
  [disabled]="disabled()"
  [attr.aria-label]="ariaLabel()"
  [attr.title]="title()"
  [attr.data-testid]="testid()"
>
  <ng-content />
</button>
