@if (multiline()) {
  <textarea
    class="ctl"
    [rows]="rows()"
    [placeholder]="placeholder()"
    [attr.aria-label]="ariaLabel()"
    [attr.data-testid]="testid()"
    [value]="value()"
    (input)="onInput($event)"
  ></textarea>
} @else {
  <input
    class="ctl"
    [type]="type()"
    [placeholder]="placeholder()"
    [attr.aria-label]="ariaLabel()"
    [attr.data-testid]="testid()"
    [value]="value()"
    (input)="onInput($event)"
  />
}
