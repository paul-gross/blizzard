<span class="pill" [style.--urgency-color]="ink()" [fleetTooltip]="tip()" [attr.aria-label]="focusable() ? name() : null" [attr.aria-hidden]="focusable() ? null : true" [attr.tabindex]="focusable() ? 0 : null">
  @if (emoji(); as mark) {
    <span class="mark" aria-hidden="true">{{ mark }}</span>
  } @else if (iconUrl(); as url) {
    <img class="mark" [src]="url" alt="" />
  } @else {
    <span class="name">{{ name() }}</span>
  }
</span>
