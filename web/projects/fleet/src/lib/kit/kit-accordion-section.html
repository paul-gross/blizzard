<div class="acc-section" data-testid="accordion-section">
  <div class="acc-head-row">
    <button
      type="button"
      class="acc-head"
      ngAccordionTrigger
      [panel]="panel"
      [id]="sectionId() + '-head'"
      [(expanded)]="expanded"
      [disabled]="disabled()"
      data-testid="accordion-section-head"
    >
      <span class="acc-head-content"
        ><ng-content select="[accordionHeader]"
      /></span>
      <span class="acc-chevron" aria-hidden="true"
        >{{ expanded() ? '▾' : '▸' }}</span
      >
    </button>
    <span class="acc-aside"><ng-content select="[accordionAside]" /></span>
  </div>
  <div
    class="acc-body"
    ngAccordionPanel
    #panel="ngAccordionPanel"
    [id]="sectionId() + '-body'"
    [style.display]="expanded() ? null : 'none'"
    data-testid="accordion-section-body"
  >
    <ng-template ngAccordionContent><ng-content /></ng-template>
  </div>
</div>
