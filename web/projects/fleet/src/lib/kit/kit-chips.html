<div class="row">
  @for (option of options(); track option.value) {
    <fleet-kit-chip
      [selected]="option.value === selectedValue()"
      [action]="action()"
      [disabled]="disabled() || !!option.disabled"
      [title]="option.title ?? null"
      [testid]="option.testid ?? null"
      (click)="pick(option)"
    >
      {{ option.label }}
    </fleet-kit-chip>
  }
</div>
