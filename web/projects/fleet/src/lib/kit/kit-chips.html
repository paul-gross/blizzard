<div class="row" fleetKitChipGroup orientation="horizontal" [selectionMode]="hasSelection() ? 'follow' : 'explicit'" [attr.aria-label]="ariaLabel()" [disabled]="disabled()" [value]="selectedValue()" [hasSelection]="hasSelection()" (valueChange)="selectionChanged($event)">
  @for (option of options(); track option.value) {
    <fleet-kit-chip
      fleetKitChipOption
      [value]="option.value"
      [label]="option.label"
      [disabled]="disabled() || !!option.disabled"
      [title]="option.title ?? null"
      [testid]="option.testid ?? null"
    >
      {{ option.label }}
    </fleet-kit-chip>
  }
</div>
