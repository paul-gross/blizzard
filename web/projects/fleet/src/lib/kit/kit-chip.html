@if (toolbarWidget || option) {
  <span class="chip" [class.selected]="option?.selected()" [class.disabled]="disabled()" [attr.title]="title()" [attr.data-testid]="testid()"><ng-container *ngTemplateOutlet="content" /></span>
} @else {
<button
  type="button"
  class="chip"
  [class.selected]="selected()"
  [attr.aria-pressed]="selected()"
  [disabled]="disabled()"
  [attr.title]="title()"
  [attr.data-testid]="testid()"
>
  <ng-container *ngTemplateOutlet="content" />
</button>

}

<ng-template #content><ng-content /></ng-template>
