<div class="s-head">
  @switch (level()) {
    @case (2) {
      <h2 class="tag" [attr.id]="labelId()">{{ text() }}</h2>
    }
    @case (3) {
      <h3 class="tag" [attr.id]="labelId()">{{ text() }}</h3>
    }
    @case (4) {
      <h4 class="tag" [attr.id]="labelId()">{{ text() }}</h4>
    }
    @default {
      <span class="tag" [attr.id]="labelId()">{{ text() }}</span>
    }
  }
  <ng-content />
</div>
