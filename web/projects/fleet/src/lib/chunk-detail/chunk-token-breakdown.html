<div class="s-head"><span class="tag">Usage</span></div>
<ng-template #costValue>
  <span data-testid="cost-total-usd">{{ formatCost(cost().cost_usd, cost().cost_partial) }}</span>
  @if (cost().cost_partial) {
    <span
      class="partial-badge"
      data-testid="cost-partial-badge"
      title="At least one invocation's cost was absent (a crash/reap-path exit) — this total is a lower bound, not the true spend."
      >PARTIAL</span
    >
  }
</ng-template>
<ng-template #inputValue>
  <span [class.zero]="cost().input_tokens === 0">{{ formatTokens(cost().input_tokens) }}</span>
</ng-template>
<ng-template #outputValue>
  <span [class.zero]="cost().output_tokens === 0">{{ formatTokens(cost().output_tokens) }}</span>
</ng-template>
<ng-template #cacheReadValue>
  <span [class.zero]="cost().cache_read_tokens === 0">{{ formatTokens(cost().cache_read_tokens) }}</span>
</ng-template>
<ng-template #cacheCreationValue>
  <span [class.zero]="cost().cache_create_tokens === 0">{{ formatTokens(cost().cache_create_tokens) }}</span>
</ng-template>
<fleet-kit-fact-list
  class="ctb-facts"
  testid="chunk-usage"
  [rows]="factRows(costValue, inputValue, outputValue, cacheReadValue, cacheCreationValue)"
/>
