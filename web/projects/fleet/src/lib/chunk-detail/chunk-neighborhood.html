<div class="nbh" data-testid="chunk-neighborhood">
  <ng-template #row let-n>
    @if (asLink()) {
      <a class="nbh-link" data-testid="neighbor" [routerLink]="[...linkBase(), n.chunk_id]" [attr.title]="n.chunk_id">
        <fleet-kit-badge class="satisfied" [tone]="satisfiedTone(n)" variant="soft" data-testid="neighbor-satisfied">{{
          n.satisfied ? 'satisfied' : 'unmet'
        }}</fleet-kit-badge>
        <fleet-kit-badge [tone]="statusTone(n)">{{ shortId(n.chunk_id) }} · {{ statusLabel(n) }}</fleet-kit-badge>
      </a>
    } @else {
      <button type="button" class="nbh-btn" data-testid="neighbor" [attr.title]="n.chunk_id" (click)="selectChunk.emit(n.chunk_id)">
        <fleet-kit-badge class="satisfied" [tone]="satisfiedTone(n)" variant="soft" data-testid="neighbor-satisfied">{{
          n.satisfied ? 'satisfied' : 'unmet'
        }}</fleet-kit-badge>
        <fleet-kit-badge [tone]="statusTone(n)">{{ shortId(n.chunk_id) }} · {{ statusLabel(n) }}</fleet-kit-badge>
      </button>
    }
  </ng-template>

  @for (group of groups(); track group.testid) {
    <section class="nbh-group" [attr.data-testid]="group.testid">
      <h3 class="nbh-label">{{ group.label }}</h3>
      @if (group.list.length) {
        <ul class="nbh-list">
          @for (n of group.list; track n.chunk_id) {
            <li><ng-container [ngTemplateOutlet]="row" [ngTemplateOutletContext]="{ $implicit: n }" /></li>
          }
        </ul>
      } @else {
        <p class="nbh-empty" [attr.data-testid]="group.testid + '-empty'">None</p>
      }
    </section>
  }
</div>
