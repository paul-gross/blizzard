<fleet-kit-panel
  class="graph-detail"
  aria-label="Graph detail"
  data-testid="graph-detail"
  [label]="graph()?.name ?? null"
  [bodyScroll]="false"
>
  @if (graph(); as g) {
    <fleet-graph-detail-header
      fleetKitPanelHeader
      [graphId]="g.graph_id"
      [retired]="!!g.retired"
      [canEdit]="canEdit()"
      (retire)="onRetire($event)"
      (enable)="onEnable($event)"
    />
  }
  <fleet-kit-async-state
    [state]="state()"
    loadingText="Loading graph…"
    loadingTestid="graph-detail-loading"
    [errorText]="'Unknown graph: ' + graphId()"
    errorTestid="graph-detail-error"
  >
  @if (graph(); as g) {
    <div class="body" data-testid="graph-detail-body">
      <fleet-graph-detail-lifecycle [actionError]="actionError()" [entryNodeName]="entryNodeName()" />

      <fleet-graph-diagram-view [graph]="g" data-testid="graph-detail-diagram" />

      <fleet-graph-node-table [nodes]="nodes()" [entryNodeId]="g.entry_node_id" />

      <fleet-graph-session-table [sessions]="sessions()" />
    </div>
  }
  </fleet-kit-async-state>
</fleet-kit-panel>
