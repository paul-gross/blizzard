<fleet-kit-async-state
  [state]="state()"
  placement="inline"
  emptyText="No runs recorded yet — tending begins when there is growth worth pruning."
  emptyTestid="gardening-runs-findings-empty"
>
  <ul class="rl-list" data-testid="gardening-runs-list">
    @for (row of rows(); track row.chunkId) {
      <li>
        <button
          type="button"
          class="rl-row"
          [class.rl-row--selected]="row.chunkId === selectedChunkId()"
          [class.rl-row--escalated]="row.escalated"
          [attr.data-testid]="'gardening-run-row-' + row.chunkId"
          (click)="pick(row.chunkId)"
        >
          <div class="rl-hdr">
            <span class="rl-routine">{{ row.routineName }}/{{ row.scopeSlug }}</span>
            <span class="rl-mode">mode={{ row.mode }}</span>
            <fleet-kit-badge [tone]="STATUS_TONE[row.outcome]" variant="soft" data-testid="rl-outcome">{{
              row.outcome
            }}</fleet-kit-badge>
            <fleet-when [iso]="row.mintedAt" />
          </div>
          @if (row.escalated) {
            <p class="rl-escalated-note" data-testid="rl-escalated-note">Escalated — needs a human.</p>
          }
          @if (row.delivered.length) {
            <ul class="rl-sets" data-testid="rl-sets">
              @for (set of row.delivered; track set.findingSetId) {
                <li class="rl-set" [attr.data-testid]="'gardening-run-set-' + set.findingSetId">
                  <span class="rl-set-id">{{ set.findingSetId }}</span>
                  <span class="rl-set-revisions">{{ set.revisionsLabel }}</span>
                  @if (set.measurement) {
                    <span class="rl-set-measurement">{{ set.measurement }}</span>
                  }
                </li>
              }
            </ul>
          } @else {
            <p class="rl-no-delivery">No finding set delivered.</p>
          }
        </button>
      </li>
    }
  </ul>
  <p class="rl-cli">list with: <code>hub run list</code></p>
</fleet-kit-async-state>
