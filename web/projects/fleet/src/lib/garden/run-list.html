<fleet-kit-async-state
  [state]="state()"
  placement="inline"
  emptyText="No runs recorded yet — tending begins when there is growth worth pruning."
  emptyTestid="gardening-runs-empty"
>
  <ul class="rl-list" data-testid="gardening-runs-list">
    @for (row of rows(); track row.chunkId) {
      <li>
        <fleet-kit-select-row
          [selected]="row.chunkId === selectedChunkId()"
          [testid]="'gardening-run-row-' + row.chunkId"
          (picked)="pick(row.chunkId)"
        >
          <div class="rl-body" [class.rl-body--escalated]="row.escalated">
            <div class="rl-line">
              <span class="rl-routine">{{ row.routineName }}/{{ row.scopeSlug }}</span>
              <fleet-kit-badge
                class="rl-outcome"
                [tone]="STATUS_TONE[row.outcome]"
                variant="soft"
                [attr.data-testid]="'rl-outcome-' + row.chunkId"
                >{{ row.outcome }}</fleet-kit-badge
              >
            </div>
            <div class="rl-line rl-meta">
              <span class="rl-mode">{{ modeLabel(row.mode) }}</span>
              <span class="rl-ref" [title]="row.chunkId" data-testid="rl-chunk-ref">{{ compactRef(row.chunkId) }}</span>
            </div>
            <div class="rl-line rl-seen">
              <fleet-when [iso]="row.mintedAt" />
              @if (row.counts; as counts) {
                <span class="rl-counts" data-testid="rl-counts">
                  @for (leg of countLegs(counts); track $index) {
                    <span [class]="leg.cssClass">{{ leg.text }}</span>
                  }
                </span>
              }
            </div>
          </div>
        </fleet-kit-select-row>
      </li>
    }
  </ul>
</fleet-kit-async-state>
