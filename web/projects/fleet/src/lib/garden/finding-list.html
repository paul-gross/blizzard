<fleet-kit-async-state
  [state]="state()"
  placement="inline"
  emptyText="No findings in this bucket."
  emptyTestid="gardening-findings-empty"
>
  <ul class="fl-list" data-testid="gardening-findings-list">
    @for (row of rows(); track row.findingId) {
      <li>
        <fleet-kit-select-row
          [selected]="row.findingId === selectedId()"
          [testid]="'gardening-finding-row-' + row.findingId"
          (picked)="findingPick.emit(row.findingId)"
        >
          <div class="fl-body" [class.fl-body--gone]="isGone(row)" [class.fl-body--exited]="isExited(row)">
            <p class="fl-summary">{{ row.summary }}</p>
            <div class="fl-hdr">
              <span class="fl-class">{{ row.findingClass }}</span>
              <span class="fl-ref" [title]="row.findingId">{{ compactRef(row.findingId) }}</span>
            </div>
            <p class="fl-locus">{{ row.locus }}</p>
            <p class="fl-seen">
              @if (row.lastSeenAt) {
                <fleet-when [iso]="row.lastSeenAt" />
              } @else {
                —
              }
            </p>
          </div>
        </fleet-kit-select-row>
      </li>
    }
  </ul>
  <p class="fl-cli">list with: <code>hub finding list</code></p>
</fleet-kit-async-state>
