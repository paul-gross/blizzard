<!-- The chunk's total session efficiency cost — the node history rows' own figure, summed over the chunk. -->
<fleet-session-efficiency class="cf-eff" data-testid="chunk-efficiency" [usage]="usage()" />
@if (prerequisites().length || dependents().length) {
  <div class="cf-deps" data-testid="chunk-deps">
    <div class="dep-col" data-testid="fact-depends-on">
      <span class="tag">Depends on</span>
      <ng-container [ngTemplateOutlet]="edges" [ngTemplateOutletContext]="{ $implicit: prerequisites(), testid: 'depends-on-neighbor' }" />
    </div>
    <div class="dep-col" data-testid="fact-blocks">
      <span class="tag">Blocks</span>
      <ng-container [ngTemplateOutlet]="edges" [ngTemplateOutletContext]="{ $implicit: dependents(), testid: 'blocks-neighbor' }" />
    </div>
  </div>
}
<ng-template #edges let-list let-testid="testid">
  @for (n of list; track n.chunk_id) {
    <a class="edge" [attr.data-testid]="testid" [routerLink]="[...chunkLinkBase(), n.chunk_id] | lensLink" [title]="n.chunk_id">
      @if (n.status) {
        <fleet-lane-icon class="edge-icon" [lane]="lane(n.status)" [status]="n.status" />
      }
      <span class="edge-ref">{{ shortId(n.chunk_id) }}</span>
    </a>
  } @empty {
    <span class="empty">—</span>
  }
</ng-template>
