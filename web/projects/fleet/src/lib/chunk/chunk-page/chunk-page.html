<fleet-chunk-page-shell fleetKitTabGroup>
  <a chunk-page-back class="back-row" [routerLink]="boardLinkBase() | appLink: backParams()" data-testid="mobile-chunk-back">
    <fleet-kit-back-bar label="Board" />
  </a>
  <fleet-kit-error-line chunk-page-notice class="notice" [message]="actionError()" testid="mobile-chunk-action-error" />
  @if (actionOutcome(); as outcome) {
    <p chunk-page-notice class="outcome" data-testid="mobile-chunk-action-outcome" role="status">{{ outcome }}</p>
  }
  <!-- Each of the shell's named slots below gets its own single-root @if
       rather than sharing one — an @if whose root has more than one
       projectable node can leave slot-selector matching unresolved
       (NG8011); a solo root per block is unambiguous. -->
  @if (detail(); as d) {
    <fleet-chunk-page-header
      chunk-page-header
      data-testid="board-chunk-detail"
      [chunkId]="chunkId() ?? ''"
      [status]="d.status"
      [tone]="tone()"
      [pointers]="d.work_refs"
      [projectName]="d.project_name ?? null"
      [projectColor]="projectColor()"
      [route]="d.route ?? null"
      [detail]="d"
      [control]="control"
      [afterDelete]="backToBoard"
    />
  }
  @if (detail()) {
    <fleet-kit-tabs chunk-page-tabs [options]="tabOptions()" [active]="tab()" (activeChange)="onChooseTab($event)" />
  }
  @if (detail(); as d) {
    <div [fleetKitTabPanel]="'general'">
      <ng-template fleetKitTabContent>
        <fleet-chunk-general-tab
          [detail]="d"
          [workItems]="workItems()"
          issuePanePlacement="inline"
          [canAnswer]="canAnswer()"
          [canResolve]="canResolve()"
          [awaitingHumanActions]="awaitingHumanActions"
          [graphLinkBase]="graphLinkBase"
          [chunkLinkBase]="chunkLinkBase()"
          [eventsLinkBase]="mobile() ? null : eventsLinkBase"
          [showNodeHistory]="!mobile()"
          (pickStep)="onSelectStep($event)"
        />
      </ng-template>
    </div>
    <div [fleetKitTabPanel]="'node-history'">
      <ng-template fleetKitTabContent>
        <fleet-chunk-node-history-container
          [chunkId]="chunkId()"
          [detail]="d"
          [selectedKey]="selection.stepKey()"
          [graphLinkBase]="graphLinkBase"
          [drilldown]="mobile()"
          (pickStep)="onSelectStep($event)"
        />
      </ng-template>
    </div>
    <div [fleetKitTabPanel]="'artifacts'">
      <ng-template fleetKitTabContent>
        <fleet-chunk-artifacts-panel
          [artifacts]="d.artifacts"
          [selectedKey]="selection.artifactKey()"
          [drilldown]="mobile()"
          testidPrefix="artifacts-tab"
          (pickArtifact)="onSelectArtifact($event)"
          (clearArtifact)="onSelectArtifact(null)"
        />
      </ng-template>
    </div>
    <div [fleetKitTabPanel]="'transcripts'">
      <ng-template fleetKitTabContent>
        <fleet-chunk-transcripts-container
          [target]="daemon.target()"
          [chunkId]="chunkId()"
          [history]="d.history"
          [currentNodeId]="d.current_node_id"
          [currentNodeName]="d.current_node_name ?? null"
          [latestEpoch]="d.latest_epoch"
          [currentNodeTerminal]="d.current_node_terminal"
          [segmentId]="selection.transcriptSegment()"
          [sidechainPath]="selection.transcriptSidechain()"
          [drilldown]="mobile()"
          (pickSegment)="onSelectTranscriptSegment($event)"
          (pickSidechain)="onSelectTranscriptSidechain($event)"
        />
      </ng-template>
    </div>
  } @else {
    <fleet-kit-async-state
      [state]="state()"
      loadingText="LOADING…"
      loadingTestid="mobile-chunk-loading"
      errorText="CHUNK UNAVAILABLE"
      errorTestid="mobile-chunk-error"
    />
  }
</fleet-chunk-page-shell>
