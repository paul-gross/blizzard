<div class="general" data-testid="chunk-general-tab">
  <!-- Delivery, work item and issues stack in one column, so Delivery always sits
       directly above Work item at every width. -->
  <div class="lhs">
  @if (showDelivery()) {
    <fleet-kit-panel class="section" data-testid="section-delivery" label="delivery">
      <fleet-chunk-delivery [detail]="detail()" />
    </fleet-kit-panel>
  }
  <fleet-kit-panel class="section" data-testid="section-work-item" label="work item" [count]="pointerCount() || null">
    <fleet-chunk-detail-facts [detail]="detail()" [chunkLinkBase]="chunkLinkBase()" />
  </fleet-kit-panel>
  <fleet-kit-panel class="section" data-testid="section-issues" label="issues">
    <fleet-chunk-detail-issue-pane [workItems]="workItems()" [placement]="issuePanePlacement()" />
  </fleet-kit-panel>
  </div>
  @if (showNodeHistory()) {
    <fleet-kit-panel class="section" data-testid="section-node-history" label="node history">
      <span fleetKitPanelHeader class="graph-slot">
        <span class="graph-sep" aria-hidden="true">·</span>
        @if (graphLinkBase(); as base) {
          <a class="graph-link" data-testid="node-history-graph" [routerLink]="[...base, detail().graph_id] | lensLink" [title]="detail().graph_id">{{ graphLabel() }}</a>
        } @else {
          <span class="graph-link" data-testid="node-history-graph" [title]="detail().graph_id">{{ graphLabel() }}</span>
        }
      </span>
      @if (eventsLinkBase()) {
        <span fleetKitPanelHeader class="events-slot"><ng-container [ngTemplateOutlet]="eventsLink" /></span>
      }
      <!-- The panel above already engraves "node history"; the section's own
           heading would repeat it word for word, so this call site opts out. -->
      <fleet-chunk-detail-timeline
        [detail]="detail()"
        [heading]="false"
        [activatable]="true"
        (pickStep)="pickStep.emit($event)"
      />
    </fleet-kit-panel>
  }
  @if (!showNodeHistory() && eventsLinkBase()) {
    <div class="section events-row"><ng-container [ngTemplateOutlet]="eventsLink" /></div>
  }
  <fleet-kit-panel class="section" data-testid="section-asks" label="asks · decisions">
    <fleet-chunk-detail-awaiting-human
      [detail]="detail()"
      [canAnswer]="canAnswer()"
      [canResolve]="canResolve()"
      [resolvePending]="resolvePending()"
      [pendingAnswerQuestionIds]="pendingAnswerQuestionIds()"
      (answerQuestion)="answerQuestion.emit($event)"
      (resolveDecision)="resolveDecision.emit($event)"
    />
  </fleet-kit-panel>
</div>
<!-- The chunk's own events, on the daemon's events view filtered by `?chunk=` — beside
     node history when General shows it, on a line of its own otherwise. -->
<ng-template #eventsLink>
  @if (eventsLinkBase(); as base) {
    <a class="events-link" data-testid="chunk-events-link" [routerLink]="base | lensLink" [queryParams]="{ chunk: detail().chunk_id }"
      >events →</a
    >
  }
</ng-template>
