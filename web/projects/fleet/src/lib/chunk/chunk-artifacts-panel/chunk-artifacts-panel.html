<fleet-kit-master-detail
  data-testid="chunk-artifacts-panel"
  paneId="artifacts"
  backLabel="Artifacts"
  [testidPrefix]="testidPrefix()"
  [drilldown]="drilldown()"
  [hasSelection]="hasSelection()"
  (back)="clearArtifact.emit()"
>
  <nav class="art-nav" kit-master-detail-list>
    <fleet-kit-async-state
      [state]="navState()"
      placement="inline"
      emptyText="No artifacts yet."
      [emptyTestid]="testidPrefix() + '-nav-empty'"
    >
      <ul class="art-list" [attr.data-testid]="testidPrefix() + '-nav'">
        @for (art of sortedArtifacts(); track art.key) {
          <li class="art-row" [class.selected]="art.key === effectiveKey()">
            <!-- eslint-disable-next-line no-restricted-syntax -- A whole artifact summary is the pick target, laid out by the summary it wraps, not the kit button's own chrome. -->
            <button
              type="button"
              class="art-item"
              [attr.data-testid]="testidPrefix() + '-nav-item'"
              [attr.data-artifact-key]="art.key"
              [attr.aria-pressed]="art.key === effectiveKey()"
              (click)="pickArtifact.emit(art.key)"
            >
              <fleet-chunk-detail-artifact-body [artifact]="art" body="summary" />
            </button>
          </li>
        }
      </ul>
    </fleet-kit-async-state>
  </nav>
  <section class="art-view" kit-master-detail-detail>
    <fleet-kit-async-state
      [state]="viewState()"
      [emptyText]="emptyMessage()"
      [emptyTestid]="testidPrefix() + '-empty'"
    >
      @if (selectedArtifact(); as art) {
      <fleet-chunk-detail-artifact-body
        class="body"
        [artifact]="art"
        body="full"
        [testid]="testidPrefix() + '-artifact'"
        [attr.data-testid]="testidPrefix() + '-artifact'"
      />
      }
    </fleet-kit-async-state>
  </section>
</fleet-kit-master-detail>
