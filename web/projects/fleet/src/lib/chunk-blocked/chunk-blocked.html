@if (linkBase(); as base) {
  <a
    class="blocked-link"
    data-testid="chunk-blocked"
    [routerLink]="[...base, prerequisiteChunkId()]"
    [attr.title]="'Blocked on ' + prerequisiteChunkId()"
  >
    <fleet-kit-badge tone="waiting" variant="soft">blocked on {{ shortId() }}</fleet-kit-badge>
  </a>
} @else {
  <button
    type="button"
    class="blocked-btn"
    data-testid="chunk-blocked"
    [attr.title]="'Blocked on ' + prerequisiteChunkId()"
    (click)="selectChunk.emit(prerequisiteChunkId())"
  >
    <fleet-kit-badge tone="waiting" variant="soft">blocked on {{ shortId() }}</fleet-kit-badge>
  </button>
}
