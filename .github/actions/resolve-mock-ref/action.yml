name: resolve-mock-ref
description: >-
  Resolve the ref of a sibling repository (blizzard-mock by default) that this run
  proves against, and check it out by commit. Every sibling resolves by the mock's rules:
  a v* tag uses the sibling's same-named tag; a pull request uses its branch of the
  head's name if it exists, else its line branch (release/X.Y or master); a push to
  master uses its master. A `baseline` release tag overrides all of these with its tag
  of that name, else its master. The rules live in resolve-mock-ref.sh.

inputs:
  repository:
    description: The sibling repository to resolve and check out, as owner/name on github.com.
    default: paul-gross/blizzard-mock
  path:
    description: Where to check the sibling out, relative to the workspace.
    default: blizzard-mock
  baseline:
    description: >-
      A release tag a rehearsal leg seeds; the sibling's tag of that name, else its master.
    default: ""
  sha:
    description: >-
      A sibling commit to check out as-is, skipping resolution — how every job of one
      run shares the commit the first resolved.
    default: ""

outputs:
  ref:
    description: The sibling ref resolved (the sha itself when `sha` was given).
    value: ${{ steps.resolve.outputs.ref }}
  sha:
    description: The sibling commit checked out.
    value: ${{ steps.resolve.outputs.sha }}

runs:
  using: composite
  steps:
    - name: resolve the ${{ inputs.repository }} ref
      id: resolve
      shell: bash
      env:
        PINNED_SHA: ${{ inputs.sha }}
        BASELINE: ${{ inputs.baseline }}
        EVENT_NAME: ${{ github.event_name }}
        REF: ${{ github.ref }}
        BASE_REF: ${{ github.base_ref }}
        HEAD_REF: ${{ github.head_ref }}
        REPOSITORY: ${{ inputs.repository }}
        MOCK_URL: https://github.com/${{ inputs.repository }}
      run: |
        if [ -n "$PINNED_SHA" ]; then
          printf 'ref=%s\nsha=%s\n' "$PINNED_SHA" "$PINNED_SHA" >> "$GITHUB_OUTPUT"
        else
          "$GITHUB_ACTION_PATH/resolve-mock-ref.sh" >> "$GITHUB_OUTPUT"
        fi
        sed "s|^|resolved $REPOSITORY: |" "$GITHUB_OUTPUT" | tail -2
    - name: checkout ${{ inputs.repository }}
      uses: actions/checkout@v5
      with:
        repository: ${{ inputs.repository }}
        path: ${{ inputs.path }}
        ref: ${{ steps.resolve.outputs.sha }}
        persist-credentials: false
