# The merge gate — the reusable check suite.
#
# This is the PR-to-master gate. `pr.yml` runs it on every pull request;
# `push.yml` and `release.yml` call it too, then add their own extra tiers, so
# the gate is defined once and never drifts between triggers.
#
# Every check here is seams-mocked and token-free: it installs dependencies and
# runs, needing no real forge, no tokens, and no network beyond the package
# installs (blizzard-context verification/blizzard/tier-rules.md).
name: gate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  python-quality:
    name: ruff + pyright + structural gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync
      - name: ruff format --check
        run: uv run ruff format --check .
      - name: ruff check
        run: uv run ruff check .
      - name: pyright
        run: uv run pyright
      - name: structural gate (blizzard:structural-gate)
        run: uv run ast-grep scan --error=unused-suppression . && uv run ast-grep test
      - name: repo-path pointers (blizzard:pointer-check)
        run: uv run python scripts/repo_pointers.py check

  # Five checks of seconds each share one job, so the gate's opening burst holds one runner for them, not five. Every
  # check runs once the setup has, whichever check failed before it, so one CI cycle reports every failure.
  repo-checks:
    name: spec drift + change notes + flag lifecycle + dprint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The change notes' `owed` range and the flag lifecycle's release tags may be arbitrarily far back.
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@v2
        with:
          version: 2026.9.2
          install: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - id: sync
        run: uv sync
      - name: dprint check (blizzard:markdown-format)
        if: ${{ !cancelled() && steps.sync.conclusion == 'success' }}
        run: mise x dprint@0.55.2 -- dprint check
      # Regenerate the committed specs the frontend's openapi-ts client is built
      # from, and fail on any uncommitted difference — the Python half of the
      # client-drift check (bzh:generated-client). The TypeScript half runs in
      # the `frontend` job.
      - name: OpenAPI spec drift
        if: ${{ !cancelled() && steps.sync.conclusion == 'success' }}
        run: |
          uv run blizzard-export-openapi --out-dir openapi
          git diff --exit-code -- openapi/ \
            || { echo "::error::OpenAPI specs under openapi/ are stale — run 'mise run export-openapi' and commit."; exit 1; }
      # Regenerate the committed contract documents under contracts/ and fail on
      # any uncommitted difference.
      - name: contract drift
        if: ${{ !cancelled() && steps.sync.conclusion == 'success' }}
        run: |
          uv run blizzard-export-contracts --out-dir contracts
          git diff --exit-code -- contracts/ \
            || { echo "::error::Contract documents under contracts/ are stale — run 'mise run export-contracts' and commit."; exit 1; }
          # `git diff` ignores a document the exporter wrote that was never committed.
          [ -z "$(git ls-files --others --exclude-standard -- contracts/)" ] \
            || { echo "::error::Contract documents under contracts/ are untracked — run 'mise run export-contracts' and commit them."; git ls-files --others --exclude-standard -- contracts/; exit 1; }
      - name: change notes (blizzard-change-notes check)
        if: ${{ !cancelled() && steps.sync.conclusion == 'success' }}
        run: uv run blizzard-change-notes check
      # The range is judged against the pull request's base branch; a push has already been judged.
      - name: change notes owed (blizzard-change-notes owed)
        if: ${{ !cancelled() && steps.sync.conclusion == 'success' && github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: uv run blizzard-change-notes owed --against "origin/$BASE_REF"
      # A release cut is judged in `cut` mode, found by the same detector the upgrade rehearsal
      # uses; flips are judged against the pull request's base.
      - name: flag lifecycle (cut on a release cut, else pr)
        if: ${{ !cancelled() && steps.sync.conclusion == 'success' && github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$(./scripts/release-cut-in-range.sh "$BASE_SHA" "$HEAD_SHA")" = "true" ]; then mode="cut"; else mode="pr"; fi
          uv run blizzard-flag-lifecycle "$mode" --base "$BASE_SHA"

  # The tier is the gate's longest job, so it runs as parallel shards — each a disjoint,
  # stable slice of the collected suite (`BLIZZARD_TEST_SHARD`, tests/suite_plugin.py) — and
  # `python-tests-result` reports them under the single check name a required-check list
  # names.
  python-tests:
    name: pytest (unit + component) — shard ${{ matrix.shard }}/${{ matrix.shards }}
    runs-on: ubuntu-latest
    strategy:
      # Every shard runs to the end, so one CI cycle reports every failure, not the first.
      fail-fast: false
      matrix:
        shards: [6]
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync
      # The unit and component tiers both run under pytest against sqlite (hermetic,
      # token-free). The e2e acceptance loop (tests/e2e, marked e2e + skipif
      # BLIZZARD_E2E!=1) is excluded here — it is the local `mise run e2e` smoke test
      # that self-manages the live stack over a blizzard-mock fixture.
      - name: pytest
        env:
          BLIZZARD_TEST_SHARD: ${{ matrix.shard }}/${{ matrix.shards }}
        run: uv run pytest -n auto

  python-tests-result:
    name: pytest (unit + component)
    needs: [python-tests]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: every shard passed
        env:
          RESULT: ${{ needs.python-tests.result }}
        run: test "$RESULT" = success || { echo "::error::a pytest shard finished '$RESULT'"; exit 1; }

  # Playwright runs TypeScript without checking its types, so the gate does: tsc, eslint (with the bans a service
  # spec keeps), and a regenerate-and-diff of the committed wire types (bzh:generated-client). Starts no daemon and
  # checks out no blizzard-mock.
  playwright-static:
    name: playwright static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v2
        with:
          version: 2026.9.2
          install: true
      - name: npm ci
        working-directory: tests
        run: npm ci
      - name: typecheck
        working-directory: tests
        run: npm run typecheck
      - name: lint
        working-directory: tests
        run: npm run lint
      - name: wire types drift
        working-directory: tests
        run: |
          npm run generate:wire
          git diff --exit-code -- harness/client/wire/ \
            || { echo "::error::tests/harness/client/wire/ is stale — run 'npm run generate:wire' in tests/ and commit."; exit 1; }

  compat:
    name: compatibility against supported releases
    # Holds HEAD's committed surface documents to every supported release, and attributes a break to the
    # change that makes it. A tag runs the same check in release.yml, over each release's own range.
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The tags the supported releases resolve from, and the range's base, may be arbitrarily far back.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync
      - name: compatibility against supported releases (blizzard:compat)
        env:
          RANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          RANGE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          LINE_REF: ${{ github.base_ref || github.ref_name }}
        run: |
          # An all-zero or unreachable base would check nothing; fail on it by name.
          if [[ "$RANGE_BASE" =~ ^0*$ ]] || ! git cat-file -e "${RANGE_BASE}^{commit}"; then
            echo "::error::no usable base commit for the compatibility range (got '${RANGE_BASE}')"
            exit 1
          fi
          ARGS=(--commits "${RANGE_BASE}..${RANGE_HEAD}")
          case "$LINE_REF" in release/*) ARGS+=(--line "$LINE_REF") ;; esac
          uv run blizzard-compat "${ARGS[@]}"

  frontend:
    name: eslint + vitest + client drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Declared interface (P5 frontend builder owns the Angular workspace; the
      # integrate step reconciles the exact path/script names): the workspace is
      # `web/` with `npm run lint` (eslint), `npm run test` (vitest), and
      # `npm run generate:client` (openapi-ts codegen of the committed client).
      # Until it lands, every frontend step is a clearly-labeled no-op so the
      # gate stays green.
      - id: detect
        name: detect frontend workspace
        run: |
          if [ -f web/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Frontend workspace (web/) not scaffolded yet (P5 frontend builder) — eslint, vitest, and generated-client drift are PENDING and skipped."
          fi
      - if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - if: steps.detect.outputs.present == 'true'
        name: npm ci
        run: cd web && npm ci
      - if: steps.detect.outputs.present == 'true'
        name: eslint
        run: cd web && npm run lint
      - if: steps.detect.outputs.present == 'true'
        name: vitest
        run: cd web && npm run test
      - if: steps.detect.outputs.present == 'true'
        name: structural gate
        run: cd web && npm run structural-gate
      - if: steps.detect.outputs.present == 'true'
        name: install chromium
        run: cd web && npx playwright install --with-deps chromium
      - if: steps.detect.outputs.present == 'true'
        name: story render
        run: cd web && npm run story-render
      - if: steps.detect.outputs.present == 'true'
        name: bundle composition
        run: cd web && npm run bundle-check
      - if: steps.detect.outputs.present == 'true'
        name: generated-client drift
        run: |
          cd web && npm run generate:client
          cd "$GITHUB_WORKSPACE"
          git diff --exit-code -- web/ \
            || { echo "::error::generated API client is stale — regenerate and commit."; exit 1; }

  # The web exemplars (blizzard:exemplar-check). The Python exemplars ride the ruff, pyright, and pytest jobs above;
  # this half needs node, and the Python env as well to export the exemplar router's spec.
  exemplars:
    name: exemplar check (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        run: cd web && npm ci
      - name: exemplar check
        run: web/scripts/exemplar-check.sh

  process-ref-lint:
    name: process-reference and change-history lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install mise + vale
        uses: jdx/mise-action@v2
        with:
          version: 2026.9.2
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync
      - name: process-reference, change-history and route-clause prose lint (mise run process-ref-lint)
        run: mise run process-ref-lint
