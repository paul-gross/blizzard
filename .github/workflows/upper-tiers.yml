# The upper tiers — service, kill-9 crash sweep, and (behind `full_suite`) e2e, journey and the two
# container smokes — as a reusable check suite.
#
# `pr.yml`, `push.yml` and `release.yml` all call this exactly as they call `gate.yml`, so each tier
# is defined once and never drifts between triggers — the same reasoning `gate.yml`'s header states
# for the merge gate itself. Callers differ only in the two inputs below: `pr.yml` and `release.yml`
# run the whole suite (`full_suite: true`, the full sweep), while `push.yml` runs the service tier and
# the bounded sweep, since an `edge` publish is not held behind e2e and an admin's direct push is
# ungated by design.
#
# The mock-backed tiers need what a single-repo checkout does not carry: the sibling
# `blizzard-mock` worktree (the mock fleet + fixture scaffold), which the `mock-ref` job
# resolves once through .github/actions/resolve-mock-ref. They are winter-free:
# their runners run on the built-in `basic` provider over a fixture of bare `file://`
# origins the scaffold mints with no winter source — no tokens, no forge, no network
# beyond package installs. This workflow provides the sibling with a two-repo checkout:
# `blizzard` and `blizzard-mock` laid out as SIBLINGS under $GITHUB_WORKSPACE — exactly the
# on-disk layout the tiers' discovery expects (`tests/service/support.py`,
# `tests/crash/support.py`: `blizzard_root().parent / "blizzard-mock"`). The winter
# binding's own tests are the local-only `winter-binding` tier and never run here. The two smokes
# build their own wheel and need only docker, compose v2, node and uv.
#
# The FULL kill-9 sweep is too slow for the push gate, so `push.yml` runs the sweep's bounded CI
# profile (`crash_sweep_ci: "1"` — a representative crash point per boundary family plus the
# whole-process cases and the recovery-critical windows); `pr.yml` and `release.yml` pass an empty
# value for the whole registry. The wall-time figures for both profiles are owned by
# blizzard-context verification/blizzard/commands/test-tiers/crash-sweep.md, not here.
#
# Each job name carries its method id and is stable across the inputs: the names are the required
# status contexts on `master` (blizzard-context verification/blizzard/commands/packaging.md).
name: upper-tiers

on:
  workflow_call:
    inputs:
      crash_sweep_ci:
        description: >-
          BLIZZARD_CRASH_SWEEP_CI value — "1" for the bounded representative CI
          subset, empty/unset for the FULL kill-9 sweep.
        type: string
        default: "1"
      full_suite:
        description: >-
          Run the e2e, journey, image-smoke and compose-smoke jobs as well as the
          service tier and the crash sweep.
        type: boolean
        default: false
    outputs:
      mock_sha:
        description: The blizzard-mock commit every tier of this run proved against.
        value: ${{ jobs.mock-ref.outputs.sha }}

jobs:
  # Resolves the mock once so every tier, and the `proven-against` record `push.yml`
  # uploads, name one commit even if the mock lands mid-run. The resolution rules are
  # owned by the action, .github/actions/resolve-mock-ref.
  mock-ref:
    name: resolve blizzard-mock ref
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.mock.outputs.sha }}
    steps:
      - name: checkout blizzard (the resolution action lives here)
        uses: actions/checkout@v4
        with:
          path: blizzard
          persist-credentials: false
      - name: resolve blizzard-mock
        id: mock
        uses: ./blizzard/.github/actions/resolve-mock-ref

  # Sharded like gate.yml's pytest tier: disjoint `BLIZZARD_TEST_SHARD` slices in parallel,
  # reported under the single check name by `service-tier-result`.
  service-tier:
    needs: [mock-ref]
    name: service tier (blizzard:service-test) — shard ${{ matrix.shard }}/${{ matrix.shards }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shards: [3]
        shard: [1, 2, 3]
    steps:
      - name: checkout blizzard
        uses: actions/checkout@v4
        with:
          path: blizzard
          persist-credentials: false
      - name: resolve and checkout blizzard-mock (the mock fleet + fixture scaffold)
        uses: ./blizzard/.github/actions/resolve-mock-ref
        with:
          sha: ${{ needs.mock-ref.outputs.sha }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
          working-directory: blizzard
          # Relative to working-directory, so the default `**/uv.lock` alone only
          # sees blizzard's own lockfile — name blizzard-mock's sibling lockfile
          # too, so its `uv sync` below shares this same cache.
          cache-dependency-glob: |
            uv.lock
            ../blizzard-mock/uv.lock
      - name: git identity for fixture/forge git operations
        run: |
          git config --global user.email "ci@blizzard.local"
          git config --global user.name "blizzard CI"
      - name: provision blizzard (hub + runner daemons)
        run: cd blizzard && uv sync
      - name: provision blizzard-mock (mock hub/runner/forge + fixture + mock-claude-code)
        run: cd blizzard-mock && uv sync
      - name: service tier — a running daemon's HTTP API vs. its mocked counterpart
        # `mise run service-test` == `BLIZZARD_SERVICE=1 uv run pytest -n auto tests/service/`.
        env:
          BLIZZARD_SERVICE: "1"
          BLIZZARD_TEST_SHARD: ${{ matrix.shard }}/${{ matrix.shards }}
        run: cd blizzard && uv run pytest -n auto tests/service/ -v

  # The service tier's Playwright half — the harness's own specs and the `service-*` projects — in two
  # shards, reported under the same check name by `service-tier-result`. A failing shard uploads the run's
  # evidence.
  service-playwright:
    needs: [mock-ref]
    name: service tier (blizzard:service-test) — playwright shard ${{ matrix.shard }}/2
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: checkout blizzard
        uses: actions/checkout@v4
        with:
          path: blizzard
          persist-credentials: false
      - name: resolve and checkout blizzard-mock (the mock fleet + fixture scaffold)
        uses: ./blizzard/.github/actions/resolve-mock-ref
        with:
          sha: ${{ needs.mock-ref.outputs.sha }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
          working-directory: blizzard
          cache-dependency-glob: |
            uv.lock
            ../blizzard-mock/uv.lock
      - name: Node from mise.toml
        uses: jdx/mise-action@v2
        with:
          version: 2026.9.2
          install: true
          working_directory: blizzard
        env:
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}/blizzard
      - name: git identity for fixture/forge git operations
        run: |
          git config --global user.email "ci@blizzard.local"
          git config --global user.name "blizzard CI"
      - name: provision blizzard (hub + runner daemons)
        run: cd blizzard && uv sync
      - name: provision blizzard-mock (mock hub/runner/forge + fixture + mock-claude-code)
        run: cd blizzard-mock && uv sync
      - name: Node version (the cache key's)
        id: node
        run: echo "version=$(node --version)" >> "$GITHUB_OUTPUT"
      - name: cache the Playwright package's dependencies
        id: node-modules
        uses: actions/cache@v4
        with:
          path: blizzard/tests/node_modules
          key: playwright-node-modules-${{ runner.os }}-${{ steps.node.outputs.version }}-${{ hashFiles('blizzard/tests/package-lock.json') }}
      - name: npm ci
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: cd blizzard/tests && npm ci
      - name: service tier — the Playwright half, `mise run playwright`
        timeout-minutes: 30
        env:
          CI: "1"
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}/blizzard
        run: cd blizzard && mise run playwright -- --project='service-*' --project=harness --project=harness-auth --shard=${{ matrix.shard }}/2
      - name: keep the failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: service-playwright-${{ matrix.shard }}
          path: |
            blizzard/tests/playwright-report/
            blizzard/tests/test-results/
            blizzard/tests/.run/
          retention-days: 14
          if-no-files-found: ignore

  service-tier-result:
    name: service tier (blizzard:service-test)
    needs: [service-tier, service-playwright]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: every shard of each half passed
        env:
          PYTEST: ${{ needs.service-tier.result }}
          PLAYWRIGHT: ${{ needs.service-playwright.result }}
        run: |
          test "$PYTEST" = success || { echo "::error::a service-tier pytest shard finished '$PYTEST'"; exit 1; }
          test "$PLAYWRIGHT" = success || { echo "::error::a service-playwright shard finished '$PLAYWRIGHT'"; exit 1; }

  crash-sweep:
    needs: [mock-ref]
    name: kill-9 crash sweep (blizzard:crash-sweep)
    runs-on: ubuntu-latest
    steps:
      - name: checkout blizzard
        uses: actions/checkout@v4
        with:
          path: blizzard
          persist-credentials: false
      - name: resolve and checkout blizzard-mock (the mock fleet + fixture scaffold)
        uses: ./blizzard/.github/actions/resolve-mock-ref
        with:
          sha: ${{ needs.mock-ref.outputs.sha }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
          working-directory: blizzard
          # Relative to working-directory, so the default `**/uv.lock` alone only
          # sees blizzard's own lockfile — name blizzard-mock's sibling lockfile
          # too, so its `uv sync` below shares this same cache.
          cache-dependency-glob: |
            uv.lock
            ../blizzard-mock/uv.lock
      - name: git identity for fixture/forge git operations
        run: |
          git config --global user.email "ci@blizzard.local"
          git config --global user.name "blizzard CI"
      - name: provision blizzard (hub + runner daemons)
        run: cd blizzard && uv sync
      - name: provision blizzard-mock (mock fleet + fixture + mock-claude-code)
        run: cd blizzard-mock && uv sync
      - name: kill-9 sweep (CI profile) — arm each subset crash point, SIGKILL, assert recovery
        # `mise run crash-sweep-ci` == the FULL sweep gated to the representative CI subset:
        # `BLIZZARD_CRASH_SWEEP=1 BLIZZARD_CRASH_SWEEP_CI=1 uv run pytest -n auto -m crash_sweep`.
        # The FULL sweep is `mise run crash-sweep` (local + tag release).
        #
        # The ceiling tracks `crash_sweep_ci`: the bounded CI profile the pr/push callers
        # use gets a tight ceiling sized for its own wall time, while a FULL-sweep caller
        # (crash_sweep_ci unset) gets enough headroom for the whole registry instead of
        # being killed at the bounded profile's ceiling.
        timeout-minutes: ${{ inputs.crash_sweep_ci == '1' && 15 || 60 }}
        env:
          BLIZZARD_CRASH_SWEEP: "1"
          BLIZZARD_CRASH_SWEEP_CI: ${{ inputs.crash_sweep_ci }}
        run: cd blizzard && uv run pytest -n auto -m crash_sweep tests/crash/ -v

  e2e:
    needs: [mock-ref]
    if: ${{ inputs.full_suite }}
    name: e2e acceptance loop (blizzard:e2e)
    runs-on: ubuntu-latest
    steps:
      - name: checkout blizzard
        uses: actions/checkout@v4
        with:
          path: blizzard
          persist-credentials: false
      - name: resolve and checkout blizzard-mock (the mock fleet + fixture scaffold)
        uses: ./blizzard/.github/actions/resolve-mock-ref
        with:
          sha: ${{ needs.mock-ref.outputs.sha }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
          working-directory: blizzard
          cache-dependency-glob: |
            uv.lock
            ../blizzard-mock/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install mise (the e2e task pins its own tools)
        uses: jdx/mise-action@v2
        with:
          # Pinned: mise's VERSION endpoint can advertise a release before that
          # release's assets exist, and the unpinned action then 404s fetching one.
          version: 2026.9.2
          install: false
      - name: git identity for fixture/forge git operations
        run: |
          git config --global user.email "ci@blizzard.local"
          git config --global user.name "blizzard CI"
      - name: provision blizzard (hub + runner daemons)
        run: cd blizzard && uv sync
      - name: provision blizzard-mock (mock fleet + fixture + mock-claude-code)
        run: cd blizzard-mock && uv sync
      - name: install Chromium for the e2e browser scenario (Playwright)
        run: cd blizzard && uv run playwright install --with-deps chromium
      - name: install the frontend's dependencies (the e2e task builds it into the wheel-embed dir)
        # The e2e browser scenario drives the *served* Angular board — the hub mounts
        # src/blizzard/static/{hub,runner} at / and falls back to the runtime placeholder
        # when index.html is absent (foundation/web.py). The source checkout ships only
        # the placeholder, so without a build the board scenario hits the placeholder
        # and board-shell never appears. `mise run e2e` depends on `web-build`, which
        # fills these dirs (src/blizzard/static/README.md); it needs `npm ci` first.
        run: cd blizzard/web && npm ci
      - name: cache the pinned otelcol-contrib (~390 MB) the fleet-trace subtests need
        # The pin's single source is the `e2e` task's `tools` in mise.toml; the key follows that file,
        # so a bumped pin re-downloads and an unchanged one is a cache hit.
        uses: actions/cache@v4
        with:
          path: ~/.local/share/mise/installs/github-open-telemetry-opentelemetry-collector-releases
          key: otelcol-contrib-${{ runner.os }}-${{ hashFiles('blizzard/mise.toml') }}
      - name: e2e acceptance loop incl. the browser scenario and fleet traces — `mise run e2e`
        # Through the task, so the collector the `e2e` task pins is on PATH; a bare `uv run pytest`
        # would skip every fleet-trace subtest.
        timeout-minutes: 60
        env:
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}/blizzard
        run: cd blizzard && mise run e2e

  journey:
    needs: [mock-ref]
    if: ${{ inputs.full_suite }}
    name: acceptance journey (blizzard:journey)
    runs-on: ubuntu-latest
    steps:
      - name: checkout blizzard
        uses: actions/checkout@v4
        with:
          path: blizzard
          persist-credentials: false
      - name: resolve and checkout blizzard-mock (the mock fleet + fixture scaffold)
        uses: ./blizzard/.github/actions/resolve-mock-ref
        with:
          sha: ${{ needs.mock-ref.outputs.sha }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
          working-directory: blizzard
          cache-dependency-glob: |
            uv.lock
            ../blizzard-mock/uv.lock
      - name: git identity for fixture/forge git operations
        run: |
          git config --global user.email "ci@blizzard.local"
          git config --global user.name "blizzard CI"
      - name: provision blizzard (hub + runner daemons)
        run: cd blizzard && uv sync
      - name: provision blizzard-mock (mock fleet + fixture + mock-claude-code)
        run: cd blizzard-mock && uv sync
      - name: acceptance journey — `mise run journey`
        timeout-minutes: 30
        env:
          BLIZZARD_JOURNEY: "1"
        run: cd blizzard && uv run pytest -m journey tests/journey/ -v

  image-smoke:
    if: ${{ inputs.full_suite }}
    name: hub image smoke (blizzard:image-smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: build the hub image and boot it — `mise run image-smoke`
        timeout-minutes: 30
        run: ./scripts/image-smoke.sh

  compose-smoke:
    if: ${{ inputs.full_suite }}
    name: reference compose smoke (blizzard:compose-smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: stand up the reference compose deployment — `mise run compose-smoke`
        timeout-minutes: 30
        run: ./scripts/compose-smoke.sh
