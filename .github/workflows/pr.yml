# PR to master or a release line — the merge gate.
#
# ruff + pyright + eslint + client-drift check + the unit and component tiers,
# with the SERVICE tier and the kill-9 CRASH SWEEP running alongside as REAL gates too
# (blizzard-context verification/blizzard.md: blizzard:service-test,
# blizzard:crash-sweep) — a subset of the `push` workflow's jobs (everything but
# the dev-build wheel artifact), so a PR that breaks either upper tier fails its
# own check instead of only breaking master after merge.
#
# Both upper tiers need what a single-repo checkout does not carry: the sibling
# `blizzard-mock` worktree (the mock fleet + fixture scaffold). The tiers are winter-free:
# their runners run on the built-in `basic` provider over a fixture of bare `file://`
# origins the scaffold mints with no winter source — no tokens, no forge, no network
# beyond package installs. This workflow provides the sibling with a two-repo checkout:
# `blizzard` and `blizzard-mock` laid out as SIBLINGS under $GITHUB_WORKSPACE — exactly the
# on-disk layout the tiers' discovery expects (`tests/service/support.py`,
# `tests/crash/support.py`: `blizzard_root().parent / "blizzard-mock"`). The winter
# binding's own tests are the local-only `winter-binding` tier and never run here.
#
# The crash-sweep-profile rationale (why this workflow runs the bounded CI subset rather
# than the FULL sweep, and where the wall-time figures live) is owned by
# upper-tiers.yml, not restated here. The e2e acceptance loop (`mise run e2e`, incl. the
# Playwright board scenario) remains a local + tag-only tier, not a `pr`/`push` gate
# (build.md).
name: pr

on:
  pull_request:
    branches: [master, "release/**"]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    uses: ./.github/workflows/gate.yml

  upper-tiers:
    uses: ./.github/workflows/upper-tiers.yml
    with:
      crash_sweep_ci: "1"

  # The proof needs the floor release's wheel and a Postgres service, so it runs only when the pull request
  # changes a revision; the check sits here, at job level, so no other job is gated on the paths.
  versions-changed:
    name: store revisions changed
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: either store's versions/ directory differs from the base
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet "$BASE_SHA...$HEAD_SHA" -- \
            src/blizzard/hub/store/migrations/versions src/blizzard/runner/store/migrations/versions; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  store-baseline:
    needs: [versions-changed]
    if: ${{ needs.versions-changed.outputs.changed == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/store-baseline.yml

  # Only a pull request into a release line is held to where its commits came from.
  line-provenance:
    name: line provenance
    if: ${{ startsWith(github.base_ref, 'release/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: every commit is a cherry-pick of master, line-only, or a cut
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/check-line-provenance.sh "$BASE_SHA" "$HEAD_SHA"
