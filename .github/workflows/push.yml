# Push to master — the merge gate plus the extra tiers and a dev build.
#
# Runs the full PR gate with the SERVICE tier and the kill-9 CRASH SWEEP alongside as REAL
# gates (blizzard-context verification/blizzard.md: blizzard:service-test,
# blizzard:crash-sweep), then publishes a dev-build wheel as a workflow artifact for
# fleet dogfooding.
#
# Both upper tiers need what a single-repo checkout does not carry: the sibling
# `blizzard-mock` worktree (the mock fleet + fixture scaffold). The tiers are winter-free:
# their runners run on the built-in `basic` provider over a fixture of bare `file://`
# origins the scaffold mints with no winter source — no tokens, no forge, no network
# beyond package installs. This workflow provides the sibling with a two-repo checkout:
# `blizzard` and `blizzard-mock` laid out as SIBLINGS under $GITHUB_WORKSPACE — exactly the
# on-disk layout the tiers' discovery expects (`tests/service/support.py`,
# `tests/crash/support.py`: `blizzard_root().parent / "blizzard-mock"`). The winter
# binding's own tests are the local-only `winter-binding` tier and never run here.
#
# The crash-sweep-profile rationale (why this workflow runs the bounded CI subset rather
# than the FULL sweep, and where the wall-time figures live) is owned by
# upper-tiers.yml, not restated here. The e2e acceptance loop (`mise run e2e`, incl. the
# Playwright board scenario) remains a local + tag-only tier, not a `push` gate
# (build.md).
name: push

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: push-master
  cancel-in-progress: false

jobs:
  gate:
    uses: ./.github/workflows/gate.yml

  upper-tiers:
    uses: ./.github/workflows/upper-tiers.yml
    with:
      crash_sweep_ci: "1"

  wire-compat-deployed:
    name: hub↔runner wire compatibility (deployed baseline)
    # Diffs every undeployed commit's openapi/hub.openapi.json against the spec the
    # newest successful push.yml run published as edge — blocking dev-image (below)
    # from ever publishing an unacknowledged break the hosted hub would receive
    # (bzh:fleet-wire-additive, docs/versioning.md's hub↔runner skew window).
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync
      - name: wire compatibility against the last deployed edge (blizzard:wire-compat)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run blizzard-wire-compat --baseline deployed --repo paul-gross/blizzard

  dev-build:
    name: dev build wheel artifact
    needs: [gate]
    runs-on: ubuntu-latest
    # Exposes the computed dev version so dev-image (below) can stamp the same
    # string into its image's org.opencontainers.image.version annotation —
    # one source of truth for "what dev version is this" across the wheel and
    # the image built from the same commit.
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      # Node builds the embedded Angular apps once the web workspace lands; until
      # then build-wheel.sh ships the committed placeholder assets (node-free).
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: compute next-train dev version X.(Y+1).0.dev<run>+<sha>
        id: ver
        run: |
          # pyproject.toml names the release most recently cut on this branch;
          # only a cut commit carrying Release-Cut: X.Y.Z moves it. The minor
          # counts trains. Master builds target the next minor train at patch 0,
          # so they sort after the most recently cut release and its candidates.
          #
          # Plus a PEP 440 local segment carrying the commit. A deployment that
          # follows the edge channel updates itself, so "what is this hub
          # running" is a question asked of the running daemon rather than of
          # whoever deployed it — and the run number alone answers it only via a
          # lookup in this repo's Actions history. The OCI image annotations do
          # carry the revision, but they are *manifest* annotations: they are not
          # in `.Config.Labels`, so they are unreadable from the running
          # container and resolvable only back at the registry.
          #
          # Carrying it in the version means the answer arrives in the reply the
          # operator already has (`GET /api/health`), and it matches what
          # scripts/build-wheel.sh stamps onto a local build, so both kinds of
          # build name their commit the same way. Tag releases deliberately do
          # NOT get this — a release version is the tag, exactly.
          BASE=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          IFS=. read -r MAJOR MINOR _ <<< "$BASE"
          DEV="${MAJOR}.$((MINOR + 1)).0.dev${{ github.run_number }}+${GITHUB_SHA:0:9}"
          echo "version=$DEV" >> "$GITHUB_OUTPUT"
          echo "Dev build version: $DEV"
      - name: build the dev wheel (embedded frontend + node-free install proof)
        env:
          BLIZZARD_VERSION: ${{ steps.ver.outputs.version }}
        run: ./scripts/build-wheel.sh
      - name: export the locked requirements beside the wheel (the dev image installs from them)
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          WHEEL="$(ls dist/blizzard-*.whl)"
          ./scripts/export-requirements.sh "$VERSION" "$WHEEL" --no-project \
            > "dist/blizzard-${VERSION}-requirements.txt"
          ./scripts/export-requirements.sh "$VERSION" "$WHEEL" --extra postgres --no-project \
            > "dist/blizzard-${VERSION}-requirements-pg.txt"
      - name: upload dev wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: blizzard-dev-wheel-${{ steps.ver.outputs.version }}
          path: |
            dist/*.whl
            dist/*-requirements*.txt
          if-no-files-found: error

  dev-image:
    name: build + publish dev hub image (edge + sha)
    # Needs dev-build (not just gate + upper-tiers) solely for its computed dev
    # version string (outputs.version, above) — do not "simplify" this away by
    # recomputing the version inline here, or the wheel and the image can drift
    # apart on what "the dev version" means for the same commit. wire-compat-deployed
    # is needed so edge never advances past an unacknowledged wire break.
    needs: [gate, upper-tiers, dev-build, wire-compat-deployed]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless signing + provenance attestation of the pushed image, this job only:
      # id-token mints the OIDC identity (push.yml@refs/heads/master), attestations
      # stores the provenance.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      # packaging/docker/Dockerfile does `COPY dist/blizzard-*.whl` and the `-pg`
      # requirements file — it installs them from the build context rather than
      # building one itself. The tag
      # `release` job satisfies that by running build-wheel.sh earlier in its OWN
      # job; here the wheel already exists as dev-build's uploaded artifact, so
      # download it into dist/ instead of building a second one. That also makes
      # the image carry byte-identical the wheel published for this commit.
      - name: fetch the dev wheel dev-build produced (the Dockerfile's build context)
        uses: actions/download-artifact@v4
        with:
          name: blizzard-dev-wheel-${{ needs.dev-build.outputs.version }}
          path: dist
      - name: derive dev image tags (edge + sha-<full-git-sha>) and OCI annotations
        id: image_meta
        run: |
          # Unlike the release fan-out (scripts/image-tags.sh), the dev channel
          # has no branching logic to unit-test — it's always exactly these two
          # tags — so it's inlined here rather than farmed out to a script.
          {
            echo "tags<<IMAGE_TAGS_EOF"
            echo "ghcr.io/paul-gross/blizzard-hub:edge"
            echo "ghcr.io/paul-gross/blizzard-hub:sha-${GITHUB_SHA}"
            echo "IMAGE_TAGS_EOF"
          } >> "$GITHUB_OUTPUT"
          {
            echo "annotations<<IMAGE_ANNOTATIONS_EOF"
            echo "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"
            echo "org.opencontainers.image.version=${{ needs.dev-build.outputs.version }}"
            echo "org.opencontainers.image.revision=${GITHUB_SHA}"
            echo "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "IMAGE_ANNOTATIONS_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@v3
      - name: set up buildx
        uses: docker/setup-buildx-action@v3
      - name: log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push the hub image (linux/amd64, linux/arm64), retried on a transient GHCR error
        env:
          IMAGE_TAGS: ${{ steps.image_meta.outputs.tags }}
          IMAGE_ANNOTATIONS: ${{ steps.image_meta.outputs.annotations }}
        id: build_push
        run: |
          set -uo pipefail

          tag_args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && tag_args+=(--tag "$tag")
          done <<< "$IMAGE_TAGS"

          annotation_args=()
          while IFS= read -r annotation; do
            [ -n "$annotation" ] && annotation_args+=(--annotation "$annotation")
          done <<< "$IMAGE_ANNOTATIONS"

          # A GHCR 403 secondary rate limit, 429, or 5xx is transient — the
          # same push that fails now typically succeeds moments later, and
          # the build's layers are already exported after the first attempt,
          # so a retry only repeats the push. scripts/is-retryable-push-error.sh
          # owns the classification; anything else (a genuine auth or manifest
          # error) fails the job on the spot instead of burning the remaining
          # attempts.
          max_attempts=3
          backoff_seconds=15
          attempt=1
          while :; do
            log="$(mktemp)"
            metadata="$(mktemp)"
            if docker buildx build \
                --file packaging/docker/Dockerfile \
                --platform linux/amd64,linux/arm64 \
                --push \
                --metadata-file "$metadata" \
                "${tag_args[@]}" \
                "${annotation_args[@]}" \
                . 2>&1 | tee "$log"; then
              # The manifest-list digest, which signing and attestation address.
              digest="$(jq -r '."containerimage.digest"' "$metadata")"
              [ -n "$digest" ] && [ "$digest" != null ] || { echo "no image digest in build metadata" >&2; exit 1; }
              echo "digest=$digest" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" -ge "$max_attempts" ] || ! ./scripts/is-retryable-push-error.sh "$log"; then
              exit 1
            fi
            echo "Transient GHCR error on attempt $attempt/$max_attempts — retrying in ${backoff_seconds}s"
            sleep "$backoff_seconds"
            attempt=$((attempt + 1))
            backoff_seconds=$((backoff_seconds * 2))
          done
      # The dev channel is signed under its own identity,
      # https://github.com/paul-gross/blizzard/.github/workflows/push.yml@refs/heads/master,
      # which the release identity regexp never matches. No SBOM, no attached files.
      - name: install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: sign the pushed manifest list and each platform manifest (keyless)
        env:
          IMAGE_DIGEST: ${{ steps.build_push.outputs.digest }}
        run: cosign sign --yes --recursive "ghcr.io/paul-gross/blizzard-hub@${IMAGE_DIGEST}"
      - name: attest build provenance of the pushed image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/paul-gross/blizzard-hub
          subject-digest: ${{ steps.build_push.outputs.digest }}
          push-to-registry: true
