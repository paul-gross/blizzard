# Tag v* — the release build.
#
# Pushing a `v*` tag IS cutting the milestone build: the full suite runs, the
# wheel is built with the embedded frontend, and a GitHub Release is published
# from the tag. Prerelease candidates are `v*-rc.*` tags.
#
# The full suite at a tag is the merge gate (unit + component) PLUS the three upper
# tiers — the service tier, the FULL kill-9 crash sweep (every registry point, not the
# bounded CI subset the master `push` gate runs), and the e2e acceptance loop including
# the Playwright browser scenario. All three need the multi-repo checkout (blizzard +
# blizzard-mock + the public blizzard-workspace as the winter source) laid out as the
# siblings their discovery expects — the same setup the `push` workflow proves green.
#
# The GitHub Release is published with the workflow's built-in GITHUB_TOKEN — no
# external registry and no user-supplied secret. The wheel is attached to the
# release; there is no package-index publish.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  gate:
    uses: ./.github/workflows/gate.yml

  full-suite-tiers:
    name: service + FULL crash sweep + e2e
    needs: [gate]
    runs-on: ubuntu-latest
    steps:
      - name: checkout blizzard
        uses: actions/checkout@v4
        with:
          path: blizzard
      - name: checkout blizzard-mock (the mock fleet + fixture scaffold)
        uses: actions/checkout@v4
        with:
          repository: paul-gross/blizzard-mock
          path: blizzard-mock
      - name: checkout blizzard-workspace (the winter source)
        uses: actions/checkout@v4
        with:
          repository: paul-gross/blizzard-workspace
          path: blizzard-workspace
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install mise (the fixture drives the winter CLI via `mise exec -- uv run`)
        uses: jdx/mise-action@v2
        with:
          install: false
      - name: git identity for fixture/forge git operations
        run: |
          git config --global user.email "ci@blizzard.local"
          git config --global user.name "blizzard CI"
      - name: provision blizzard (hub + runner daemons)
        run: cd blizzard && uv sync
      - name: provision blizzard-mock (mock fleet + fixture + mock-claude-code)
        run: cd blizzard-mock && uv sync
      - name: install Chromium for the e2e browser scenario (Playwright)
        run: cd blizzard && uv run playwright install --with-deps chromium
      - name: build the mission-control frontend into the wheel-embed dir (the browser e2e serves the real board)
        # The e2e browser scenario drives the *served* Angular board — the hub mounts
        # src/blizzard/static/{hub,runner} at / and falls back to the runtime placeholder
        # when index.html is absent (foundation/web.py). The source checkout ships only
        # the placeholder, so without this build the board scenario hits the placeholder
        # and board-shell never appears. This mirrors the local `npm run build` step
        # that fills these dirs before `mise run e2e` (src/blizzard/static/README.md).
        run: cd blizzard/web && npm ci && npm run build
      - name: service tier (blizzard:service-test)
        env:
          BLIZZARD_SERVICE: "1"
          BLIZZARD_MOCK_WINTER_SOURCE: ${{ github.workspace }}/blizzard-workspace
        run: cd blizzard && uv run pytest tests/service/ -v
      - name: FULL kill-9 crash sweep (every registry point) — `mise run crash-sweep`
        env:
          BLIZZARD_CRASH_SWEEP: "1"
          BLIZZARD_MOCK_WINTER_SOURCE: ${{ github.workspace }}/blizzard-workspace
        run: cd blizzard && uv run pytest -m crash_sweep tests/crash/ -v
      - name: e2e acceptance loop incl. the browser scenario — `mise run e2e`
        env:
          BLIZZARD_E2E: "1"
          BLIZZARD_MOCK_WINTER_SOURCE: ${{ github.workspace }}/blizzard-workspace
        run: cd blizzard && uv run pytest tests/e2e/ -v

  release:
    name: build wheel + image, publish release
    needs: [gate, full-suite-tiers]
    runs-on: ubuntu-latest
    # A job-level `permissions:` block REPLACES the workflow-level one rather than
    # merging with it — every unlisted scope becomes `none`. `packages: write`
    # (the GHCR push below) must therefore be declared *alongside* `contents:
    # write` (the `gh release create` step already here), not instead of it — the
    # repo's first job-level permissions block, no local precedent to copy from.
    # tests/test_release_workflow.py pins both scopes stay present.
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # release-notes.sh needs the commit range since the previous tag, and
          # `git describe` needs every tag reachable — a shallow (depth-1)
          # checkout would see neither.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: check pyproject.toml's version agrees with the tag (fail before building anything)
        run: ./scripts/check-version-tag.sh "${GITHUB_REF_NAME}"
      - name: derive version from tag
        id: ver
        run: |
          # v0.1.0 -> 0.1.0 ; v0.1.0-rc.1 -> 0.1.0-rc.1 (hatchling normalizes the
          # PEP 440 pre-release form). The version scheme is 0.<milestone>.<patch>.
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          case "$TAG" in
            *-rc.*) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *)      echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "Release version: $VERSION"
      - name: build the release wheel (embedded frontend + node-free install proof)
        env:
          BLIZZARD_VERSION: ${{ steps.ver.outputs.version }}
        run: ./scripts/build-wheel.sh
      - name: generate release notes (scripts/release-notes.sh)
        run: |
          PREV_TAG="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -n "$PREV_TAG" ]; then
            echo "Notes range: $PREV_TAG..${GITHUB_REF_NAME}"
            ./scripts/release-notes.sh --range "$PREV_TAG..${GITHUB_REF_NAME}" > release-notes.md
          else
            echo "No previous tag found — first release, an empty commit range."
            ./scripts/release-notes.sh --from-stdin < /dev/null > release-notes.md
          fi
          cat release-notes.md
      - name: derive the GHCR tag fan-out (scripts/image-tags.sh) and OCI annotations
        id: image_meta
        run: |
          TAGS_RAW="$(./scripts/image-tags.sh "${GITHUB_REF_NAME}")"
          echo "Image tag fan-out for ${GITHUB_REF_NAME}: $TAGS_RAW"
          {
            echo "tags<<IMAGE_TAGS_EOF"
            while IFS= read -r t; do echo "ghcr.io/paul-gross/blizzard-hub:$t"; done <<< "$TAGS_RAW"
            echo "IMAGE_TAGS_EOF"
          } >> "$GITHUB_OUTPUT"
          {
            echo "annotations<<IMAGE_ANNOTATIONS_EOF"
            echo "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"
            echo "org.opencontainers.image.version=${{ steps.ver.outputs.version }}"
            echo "org.opencontainers.image.revision=${GITHUB_SHA}"
            echo "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "IMAGE_ANNOTATIONS_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@v3
      - name: set up buildx
        uses: docker/setup-buildx-action@v3
      - name: log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push the hub image (linux/amd64, linux/arm64)
        # Before `gh release create` (decision 5) — a failed image build must never
        # leave a published Release advertising an image that does not exist.
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image_meta.outputs.tags }}
          annotations: ${{ steps.image_meta.outputs.annotations }}
      - name: publish GitHub Release with the wheel attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FLAGS=(--notes-file release-notes.md --title "${GITHUB_REF_NAME}")
          if [ "${{ steps.ver.outputs.prerelease }}" = "true" ]; then
            FLAGS+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" dist/*.whl "${FLAGS[@]}"
