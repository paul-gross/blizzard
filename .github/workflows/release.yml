# Tag v* — the release build.
#
# Pushing a `v*` tag builds a release. `proof` runs first: a stable tag whose commit carries a
# green candidate (`vX.Y.Z-rc.K`) run borrows it and skips the full suite, a promotion without one
# is refused, and a patch runs the suite. Otherwise the full suite runs, the
# wheel is built with the embedded frontend, and a GitHub Release is published
# from the tag. Prerelease candidates are `v*-rc.*` tags; on those alone, the
# upgrade rehearsal (rehearsal.yml) upgrades each supported release to the wheel
# before the image is built from it. The store baseline proof (store-baseline.yml) runs
# on candidate and patch tags, and not on a stable promotion.
#
# The full suite at a tag is the merge gate (unit + component) PLUS every upper tier, which
# upper-tiers.yml defines once for this workflow and `pr.yml` alike: the service tier, the FULL
# kill-9 crash sweep (every registry point, not the bounded subset the master `push` gate runs),
# the e2e acceptance loop including the Playwright browser scenario, the acceptance journey, and
# the hub-image and compose smokes. The mock-backed tiers run against the two-repo checkout
# (blizzard + blizzard-mock) with the mock at the tag of the same name
# (.github/actions/resolve-mock-ref). They are winter-free: no winter source is checked out, and
# the winter binding's tests (`winter-binding`) are local-only.
#
# The GitHub Release is published with the workflow's built-in GITHUB_TOKEN — no
# external registry and no user-supplied secret. The wheel is attached to the
# release; there is no package-index publish. The last job, `verify`, proves the
# published release from outside with scripts/verify-release.sh.
name: release

on:
  push:
    tags:
      - "v*"

# Read-only by default: the test jobs hold no write scope. Every job past the tiers declares
# their own scopes at job level; only `publish` holds `contents: write`, and `verify` reads only.
permissions:
  contents: read

jobs:
  proof:
    name: borrow the candidate's proof, or refuse
    # First, so a refusal fails the run before anything is built. A stable tag whose commit carries
    # a green `vX.Y.Z-rc.K` run borrows it and skips the full suite; a promotion without one is
    # refused; a patch has no candidate and runs the suite. The only job holding `actions: read`.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      borrowed: ${{ steps.proof.outputs.borrowed }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: scripts/borrowed-proof.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - id: proof
        run: ./scripts/borrowed-proof.sh "${GITHUB_REF_NAME}" "${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  gate:
    needs: [proof]
    if: ${{ needs.proof.outputs.borrowed != 'true' }}
    uses: ./.github/workflows/gate.yml

  compat:
    name: compatibility against supported releases
    # The backstop: the tag's tree against every supported release, before any build. It writes
    # compat-breaks.json, which `build` attaches to the release.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Every tag, and each release's range up to this commit.
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync
      - name: compatibility against supported releases (blizzard:compat)
        run: uv run blizzard-compat --tag "${GITHUB_REF_NAME#v}"
      - name: hand the report to build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compat-breaks
          path: compat-breaks.json
          if-no-files-found: error

  upper-tiers:
    needs: [proof, gate]
    if: ${{ needs.proof.outputs.borrowed != 'true' }}
    uses: ./.github/workflows/upper-tiers.yml
    with:
      full_suite: true
      crash_sweep_ci: ""

  isolation-cross-check:
    # The suite's placements hold only if it passes the same tests raised a level; see the workflow.
    needs: [proof]
    if: ${{ needs.proof.outputs.borrowed != 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/isolation-cross-check.yml

  wheel:
    name: build the release wheel
    # Built once: `rehearsal` upgrades the supported releases to this wheel, and `build`
    # publishes this same wheel and builds the image from it.
    needs: [proof]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The version check holds the tagged commit to origin/release/X.Y (or an open master).
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: check pyproject.toml's version agrees with the tag and the commit sits on its line (fail before building anything)
        run: ./scripts/check-version-tag.sh "${GITHUB_REF_NAME}"
      - name: derive version from tag
        id: ver
        run: |
          # The minor counts release trains. pyproject.toml names the release
          # most recently cut on this branch, moved only by a cut commit with
          # Release-Cut: X.Y.Z. Both candidate and stable tags can share it;
          # stamp the full tag version (the wheel builder normalizes rc for PEP 440).
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          case "$TAG" in
            *-rc.*) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *)      echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "Release version: $VERSION"
      - name: build the release wheel (embedded frontend + node-free install proof)
        env:
          BLIZZARD_VERSION: ${{ steps.ver.outputs.version }}
        run: ./scripts/build-wheel.sh
      - name: export the locked requirements (the image installs from them)
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          WHEEL="$(ls dist/blizzard-*.whl)"
          ./scripts/export-requirements.sh "$VERSION" "$WHEEL" --no-project \
            > "dist/blizzard-${VERSION}-requirements.txt"
          ./scripts/export-requirements.sh "$VERSION" "$WHEEL" --extra postgres --no-project \
            > "dist/blizzard-${VERSION}-requirements-pg.txt"
      - name: hand the wheel and its requirements to rehearsal and build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-wheel
          path: |
            dist/*.whl
            dist/*-requirements*.txt
          if-no-files-found: error

  rehearsal:
    # A candidate only: a stable tag's tree is its last candidate's, already rehearsed.
    if: contains(github.ref_name, '-rc.')
    needs: [wheel]
    permissions:
      contents: read
    uses: ./.github/workflows/rehearsal.yml
    with:
      candidate_artifact: release-wheel
      tag: ${{ github.ref_name }}

  store-baseline:
    # A candidate or a patch: a stable promotion `vX.Y.0` carries its last candidate's tree, already proved.
    if: ${{ contains(github.ref_name, '-rc.') || !endsWith(github.ref_name, '.0') }}
    permissions:
      contents: read
    uses: ./.github/workflows/store-baseline.yml

  build:
    name: build the image, sign and attest, assemble the inventory
    needs: [proof, gate, compat, upper-tiers, isolation-cross-check, wheel, rehearsal, store-baseline]
    # Runs when `rehearsal`, `store-baseline`, or (on a borrowed proof) the suite was skipped, never
    # when any need failed.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ needs.wheel.outputs.prerelease }}
      latest: ${{ steps.image_meta.outputs.latest }}
    # A job-level `permissions:` block REPLACES the workflow-level one rather than
    # merging with it — every unlisted scope becomes `none`. This job pushes to GHCR,
    # mints the OIDC identity the signature and attestations carry, and stores them;
    # it cannot write the Release, which `publish` alone does.
    # tests/test_release_workflow.py pins the exact scopes.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.wheel.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The release-note renderer needs the commit range since the previous tag, and
          # `git describe` needs every tag reachable — a shallow (depth-1)
          # checkout would see neither.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - name: fetch the wheel `wheel` built (the image's build context and the released wheel)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-wheel
          path: dist
      - name: fetch the compatibility report the compat job wrote
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: compat-breaks
          path: .
      - name: generate release notes from the tag tree
        run: |
          uv run blizzard-change-notes render "${GITHUB_REF_NAME}" > release-notes.md
          cat release-notes.md
      - name: derive the GHCR tag fan-out (scripts/image-tags.sh) and OCI annotations
        id: image_meta
        run: |
          mapfile -t REPO_TAGS < <(git tag --list 'v*')
          TAGS_RAW="$(./scripts/image-tags.sh "${GITHUB_REF_NAME}" "${REPO_TAGS[@]}")"
          echo "Image tag fan-out for ${GITHUB_REF_NAME}: $TAGS_RAW"
          if grep -qx latest <<< "$TAGS_RAW"; then echo "latest=true" >> "$GITHUB_OUTPUT"; else echo "latest=false" >> "$GITHUB_OUTPUT"; fi
          {
            echo "tags<<IMAGE_TAGS_EOF"
            while IFS= read -r t; do echo "ghcr.io/paul-gross/blizzard-hub:$t"; done <<< "$TAGS_RAW"
            echo "IMAGE_TAGS_EOF"
          } >> "$GITHUB_OUTPUT"
          {
            echo "annotations<<IMAGE_ANNOTATIONS_EOF"
            echo "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"
            echo "org.opencontainers.image.version=${{ needs.wheel.outputs.version }}"
            echo "org.opencontainers.image.revision=${GITHUB_SHA}"
            echo "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "IMAGE_ANNOTATIONS_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@v3
      - name: set up buildx
        uses: docker/setup-buildx-action@v3
      - name: log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push the hub image (linux/amd64, linux/arm64)
        # Before `publish` — a failed image build must never leave a published Release
        # advertising an image that does not exist. The `digest` output is the
        # manifest-list digest of the multi-platform push.
        id: build_push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image_meta.outputs.tags }}
          annotations: ${{ steps.image_meta.outputs.annotations }}
      - name: install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: sign the pushed manifest list and each platform manifest (keyless)
        env:
          IMAGE_DIGEST: ${{ steps.build_push.outputs.digest }}
        run: cosign sign --yes --recursive "ghcr.io/paul-gross/blizzard-hub@${IMAGE_DIGEST}"
      - name: attest build provenance of the pushed image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/paul-gross/blizzard-hub
          subject-digest: ${{ steps.build_push.outputs.digest }}
          push-to-registry: true
      - name: resolve each platform's image digest from the pushed manifest list
        id: platform_digests
        env:
          IMAGE_DIGEST: ${{ steps.build_push.outputs.digest }}
        run: |
          mkdir -p inventory
          MANIFEST="$(docker buildx imagetools inspect --raw "ghcr.io/paul-gross/blizzard-hub@${IMAGE_DIGEST}")"
          for ARCH in amd64 arm64; do
            DIGEST="$(jq -r --arg arch "$ARCH" \
              '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest' \
              <<< "$MANIFEST")"
            [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "no linux/$ARCH digest in the manifest list" >&2; exit 1; }
            echo "$ARCH=$DIGEST" >> "$GITHUB_OUTPUT"
          done
      - name: bill of materials for the linux/amd64 image (Syft, SPDX 2.3 JSON)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/paul-gross/blizzard-hub@${{ steps.platform_digests.outputs.amd64 }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: inventory/blizzard-hub-${{ needs.wheel.outputs.version }}-linux-amd64.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: attest the linux/amd64 image bill of materials against its platform digest
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/paul-gross/blizzard-hub
          subject-digest: ${{ steps.platform_digests.outputs.amd64 }}
          sbom-path: inventory/blizzard-hub-${{ needs.wheel.outputs.version }}-linux-amd64.spdx.json
          push-to-registry: true
      - name: bill of materials for the linux/arm64 image (Syft, SPDX 2.3 JSON)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/paul-gross/blizzard-hub@${{ steps.platform_digests.outputs.arm64 }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: inventory/blizzard-hub-${{ needs.wheel.outputs.version }}-linux-arm64.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: attest the linux/arm64 image bill of materials against its platform digest
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/paul-gross/blizzard-hub
          subject-digest: ${{ steps.platform_digests.outputs.arm64 }}
          sbom-path: inventory/blizzard-hub-${{ needs.wheel.outputs.version }}-linux-arm64.spdx.json
          push-to-registry: true
      - name: stage the wheel's runtime for its bill of materials (clean venv + the board's lockfile)
        run: |
          # The venv holds exactly the hashed base requirements plus the wheel; the board's
          # JavaScript ships compiled inside the wheel, so its lockfile stands in for the
          # packages no Python scan sees (Syft leaves the lockfile's dev packages out).
          uv venv sbom-wheel/venv
          uv pip install --python sbom-wheel/venv --require-hashes -r "dist/blizzard-${VERSION}-requirements.txt"
          uv pip install --python sbom-wheel/venv --no-deps dist/blizzard-*.whl
          cp web/package-lock.json sbom-wheel/package-lock.json
      - name: bill of materials for the wheel (Syft, SPDX 2.3 JSON)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: sbom-wheel
          format: spdx-json
          output-file: inventory/blizzard-${{ needs.wheel.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: attest the wheel bill of materials against the wheel
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/blizzard-*.whl
          sbom-path: inventory/blizzard-${{ needs.wheel.outputs.version }}.spdx.json
      - name: assemble the attached files and their checksums (scripts/release-inventory.sh)
        env:
          IMAGE_DIGEST: ${{ steps.build_push.outputs.digest }}
        run: |
          ./scripts/release-inventory.sh "$VERSION" "$(ls dist/blizzard-*.whl)" "$IMAGE_DIGEST" inventory \
            --compat-breaks compat-breaks.json
          ls -l inventory
      - name: attest build provenance of every attached file
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: inventory/*
      - name: hand the attached files and the notes to publish
        # Two paths whose common ancestor is the workspace root, so the archive keeps
        # the `inventory/` prefix `publish` globs on.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-files
          path: |
            inventory/
            release-notes.md
          if-no-files-found: error

  publish:
    name: publish GitHub Release with every file attached
    needs: [build]
    # `build` itself may run past a skipped `rehearsal`; publish follows only its success.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-files
          path: .
      - name: publish GitHub Release (one call, so immutable releases see every file)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          LATEST: ${{ needs.build.outputs.latest }}
        run: |
          FLAGS=(--notes-file release-notes.md --title "${GITHUB_REF_NAME}")
          if [ "$PRERELEASE" = "true" ]; then
            FLAGS+=(--prerelease)
          fi
          # `latest` moves only to the highest stable version, as the image's does.
          if [ "$LATEST" != "true" ]; then
            FLAGS+=(--latest=false)
          fi
          gh release create "${GITHUB_REF_NAME}" inventory/* "${FLAGS[@]}"

  verify:
    name: verify the published release from outside (scripts/verify-release.sh)
    needs: [publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # `gh` needs a token to read a public repository; the job holds no write scope.
      GH_TOKEN: ${{ github.token }}
    steps:
      # Only the script, from the tag's own tree: the job then runs it with no checkout in reach,
      # as a stranger who holds nothing but the tools would.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: scripts/verify-release.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - run: cp scripts/verify-release.sh "${RUNNER_TEMP}/verify-release.sh"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
          # No lockfile in the sparse tree to key a cache on.
          enable-cache: false
      - name: install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: verify the release (scripts/verify-release.sh)
        working-directory: ${{ runner.temp }}
        run: ./verify-release.sh "${GITHUB_REF_NAME}"
