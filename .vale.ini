StylesPath = styles

[*.md]
BasedOnStyles = Blizzard
Blizzard.RouteClause = NO

[{src,tests,scripts}/**/*.py]
BasedOnStyles = Blizzard
Blizzard.RouteClause = NO

[src/**/*.{yaml,yml}]
BasedOnStyles = Blizzard
Blizzard.RouteClause = NO

[web/projects/**/*.{ts,css}]
BasedOnStyles = Blizzard
Blizzard.RouteClause = NO

# The route clause is gated only where it is rendered as command help.
[src/blizzard/{hub,runner}/cli/**/*.py]
BasedOnStyles = Blizzard
Blizzard.RouteClause = YES

# The generated client is openapi/'s description text rendered (bzh:comment-locality
# §Generated docstrings) — it is not hand-authored comment prose, so the rule does not
# reach it.
[web/projects/*/src/lib/api/**]
BasedOnStyles =
