StylesPath = styles

[*.md]
BasedOnStyles = Blizzard
Blizzard.RouteClause = NO
Blizzard.UiSurface = NO

[{src,tests,scripts}/**/*.py]
BasedOnStyles = Blizzard
Blizzard.RouteClause = NO
Blizzard.UiSurface = NO

[src/**/*.{yaml,yml}]
BasedOnStyles = Blizzard
Blizzard.RouteClause = NO
Blizzard.UiSurface = NO

[web/projects/**/*.{ts,css}]
BasedOnStyles = Blizzard
Blizzard.RouteClause = NO
Blizzard.UiSurface = NO

# The route clause is gated only where it is rendered as command help.
[src/blizzard/{hub,runner}/cli/**/*.py]
BasedOnStyles = Blizzard
Blizzard.RouteClause = YES

# The UI-surface rule is gated only on the seams shared by every daemon, where a comment
# naming the client that renders a value (bzh:comment-locality, bzh:comment-encapsulation)
# is a leak; hub, runner and web prose name their own surfaces freely.
[src/blizzard/{wire,foundation,auth_core}/**/*.py]
BasedOnStyles = Blizzard
Blizzard.RouteClause = NO
Blizzard.UiSurface = YES

# The generated client is openapi/'s description text rendered (bzh:comment-locality
# §Generated docstrings) — it is not hand-authored comment prose, so the rule does not
# reach it.
[web/projects/*/src/lib/api/**]
BasedOnStyles =
