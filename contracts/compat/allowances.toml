reason = "component schema deleted"
because = "RepositoryDocument is the version-1 document's repository entry alone; 0.4's only readers of the version-1 configuration document are the CLI's config export, which echoes the decoded document without a model and asks for version 2 by default (v0.4.0-rc.1:src/blizzard/hub/cli/config.py:134-139 and :155-156), and its config apply, which sends the file's bytes unparsed and prints a refusal's message (v0.4.0-rc.1:src/blizzard/hub/cli/config.py:115-126 and :60-71), so a version-1 request meets the hub's coded refusal naming version 2; the board ships no reader of it, and 0.4.0 deprecates the document version for removal in 0.5."

