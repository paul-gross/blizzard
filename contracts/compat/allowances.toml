[[allowance]]
line = "0.3"
surface = "http-api"
where = "HubMarkerRequest"
reason = "component schema deleted"
because = "HubMarkerRequest is the request body of the deprecated POST /api/chunks/{chunk_id}/hub-markers alone, read and written only by that route in the hub that serves it (v0.3.0:src/blizzard/hub/api/chunks.py:456); no 0.3 runner, CLI or board code names the schema outside its generated client, and the route itself goes with it, deprecated in every supported release."

