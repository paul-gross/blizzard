# Recorded allowances for blizzard-compat, each keyed on a release line. README.md beside this file owns the format.

[[allowance]]
line = "0.3"
surface = "http-api"
where = "ProjectDocument.landing_order"
reason = "property added to a forbid schema a response reaches"
because = "0.3's only consumer of GET /api/config/export's body is the hub CLI's config export, which decodes the response as untyped JSON and re-encodes it to the operator unparsed (v0.3.0:src/blizzard/hub/cli/config.py:138-139), so the new landing_order reaches the printed document as data; no 0.3 runner or board code reads the export."

[[allowance]]
line = "0.3"
surface = "http-api"
where = "RepositoryDocument.landing_policy"
reason = "property added to a forbid schema a response reaches"
because = "0.3's only consumer of GET /api/config/export's body is the hub CLI's config export, which decodes the response as untyped JSON and re-encodes it to the operator unparsed (v0.3.0:src/blizzard/hub/cli/config.py:138-139), so the new landing_policy reaches the printed document as data; no 0.3 runner or board code reads the export (the board names RepositoryDocument only as a request body type, v0.3.0:web/projects/hub/src/app/admin/repositories/repositories.mutations.ts:39, and the board is served by the hub it calls)."

