# Recorded allowances for blizzard-compat, each keyed on a release line. README.md beside this file owns the format.

[[allowance]]
line = "0.4"
surface = "http-api"
where = "HubMarkerRequest"
reason = "component schema deleted"
because = "HubMarkerRequest is the request body of the deprecated POST /api/chunks/{chunk_id}/hub-markers alone, read and written only by that route in the hub that serves it (v0.4.0-rc.1:src/blizzard/hub/api/chunks.py:479); no 0.4 runner, CLI or board code names the schema outside its generated client, and the route itself goes with it, deprecated in every supported release."

[[allowance]]
line = "0.4"
surface = "http-api"
where = "HubMarkerResponse"
reason = "component schema deleted"
because = "HubMarkerResponse is the response of the deprecated POST /api/chunks/{chunk_id}/hub-markers alone, read and written only by that route in the hub that serves it (v0.4.0-rc.1:src/blizzard/hub/api/chunks.py:481); no 0.4 runner, CLI or board code names the schema outside its generated client, and the route itself goes with it, deprecated in every supported release."

