[[allowance]]
line = "0.3"
surface = "cli"
where = "hub record-marker"
reason = "command removed"
because = "0.3's record-marker refuses on every invocation, recording nothing (v0.3.0:src/blizzard/hub/cli/marker.py:8-17), and nothing in 0.3 runs it: a hub node runs no commands, so its only caller, a hub node's run: script, no longer exists; a person running it is told it is removed in either release."

