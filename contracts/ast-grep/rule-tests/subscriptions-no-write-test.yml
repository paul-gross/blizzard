id: bzh:subscriptions-no-write
valid:
  # Read-only access — the shape every sampler and renewer binding actually uses.
  - |
    class OpenAISubscriptionSampler:
        def _read_credential(self):
            raw = Path(self._credentials_path).read_text()
            data = json.loads(raw)
            return data
  - |
    class OpenAICredentialRenewer:
        def _read_access_token_expiry(self):
            raw = Path(self._credentials_path).read_text()
            return raw
  - |
    class LegacySampler:
        def sample(self):
            with open(self._path) as f:
                return f.read()
  - |
    class LegacySampler:
        def sample(self):
            with open(self._path, "r") as f:
                return f.read()
  - |
    class LegacySampler:
        def sample(self):
            with self._path.open("r") as f:
                return f.read()
  - |
    class LegacySampler:
        def sample(self):
            fd = os.open(self._path, os.O_RDONLY)
            return fd
  - |
    class LegacySampler:
        def sample(self):
            fd = os.open("/creds/auth.json", os.O_RDONLY)
            return fd
