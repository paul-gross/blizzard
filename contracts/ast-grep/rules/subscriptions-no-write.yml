# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json

id: bzh:subscriptions-no-write
language: Python
severity: error
message: >-
  A sampler or renewer under runner/subscriptions/ never opens a credential file for
  writing (D1) — the vendor CLI owns its own lock, atomic write, and refresh-token
  rotation; a second writer risks corrupting it mid-refresh or invalidating the login
  it just renewed. Read the file; never write it.
files:
  - src/blizzard/runner/subscriptions/**
rule:
  any:
    - pattern: $X.write_text($$$ARGS)
    - pattern: $X.write_bytes($$$ARGS)
    # os.open must precede the `$X.open` patterns: an earlier pattern that matches the node but
    # fails the MODE constraint ends the `any` without trying the rest.
    - all:
        - pattern: os.open($$$ARGS)
        - regex: '(?s).*\bO_(WRONLY|RDWR|CREAT|APPEND|TRUNC)\b.*'
    - pattern: open($PATH, $MODE)
    - pattern: open($PATH, $MODE, $$$REST)
    - pattern: $X.open($MODE)
    - pattern: $X.open($MODE, $$$REST)
    - pattern: os.replace($$$ARGS)
    - pattern: os.rename($$$ARGS)
constraints:
  MODE:
    regex: "['\"][^'\"]*[wax+][^'\"]*['\"]"
