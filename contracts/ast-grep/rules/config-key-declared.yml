# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json

id: bzh:config-key-declared
language: Python
severity: error
message: >-
  Decode daemon config through its loader and read keys through a ConfigView over the declared
  registry; ingested TOML documents decode through the config codec.
files:
  - src/blizzard/runner/**
  - src/blizzard/hub/**
ignores:
  - src/blizzard/runner/host_config.py
  - src/blizzard/hub/config.py
  - src/blizzard/hub/domain/runners/version_window.py
  - src/blizzard/hub/documents/internal/toml_codec.py
rule:
  any:
    - pattern: import tomllib
    - pattern: import tomllib as $ALIAS
    - pattern: from tomllib import $$$NAMES
