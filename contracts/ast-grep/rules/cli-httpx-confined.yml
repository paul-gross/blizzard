# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json

id: bzh:cli-httpx-confined
language: Python
severity: error
message: >-
  httpx is imported only by blizzard.cli.collaborators, the CLI tree's one client-factory module. A command builds
  its client through CliCollaborators.client_factory and takes httpx's types from that module (bzh:dependency-injection).
files:
  - src/blizzard/cli/**
  - src/blizzard/hub/cli/**
  - src/blizzard/runner/cli/**
ignores:
  - src/blizzard/cli/collaborators.py
rule:
  any:
    - pattern: import httpx
    - pattern: import httpx as $ALIAS
    - pattern: from httpx import $$$NAMES
    - pattern: from httpx.$$$SUB import $$$NAMES
