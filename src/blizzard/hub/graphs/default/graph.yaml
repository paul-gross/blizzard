# The default workflow graph — build -> review -> deliver.
#
# The autonomous-baseline shape: the canonical review-fail cycle with NO
# human gate. Promoted from the P6 walking-skeleton `build -> deliver` slice to the
# full MVP graph (milestone:mvp): build hands to a cold-eyes review node, review
# either passes to delivery or fails the work back into build carrying its findings
# asset (the review node). Insert an `approve-gate` human node
# ahead of `deliver` to dial HITL back up — graphs are
# immutable, so that is a re-mint, not an edit.
#
# Conforms to the canonical authoring schema: fused choice/edge entries, prompts as
# file references inlined at mint, retries escaping to escalation, the review-fail
# edge carrying the findings asset + its prompt_addendum back into build. Delivery is
# authored as graph CONTENT, not an engine special case: `deliver` is a generic hub
# command node (`executor: hub` + `run:`) whose script the hub itself executes — no
# agent, ever (`bzh:deterministic-shell`). Its `run:` step invokes
# `hub/graphs/scripts/land_default.py`, which owns the check-all-then-push-all mechanics
# and the `merged/<repo>` marker convention; the hub-command-node authoring contract
# both scripts honor lives in `blizzard-context:/standards/hub-nodes.md`. A conflict at
# the check stage routes `conflict -> build` (nothing pushed); a clean land routes
# `landed -> done`. See `tests/e2e/test_delivery_pr_ci_e2e.py` and the
# `advanced-development-workflow` graph's own `deliver` node for the alternative PR +
# CI-watch delivery policy this same primitive expresses — proof that delivery policy
# lives in YAML, not code.
# A judgement choice's `to:` normally names a sibling node or the reserved terminal
# `done`; it may instead name `graph:<name>` — a cross-graph MIGRATION target (issue
# #90). Taking such a choice re-pins the chunk to that graph and re-queues it at the
# name-matched landing node (else the target's entry), recording a migration fact rather
# than a transition; an optional per-choice `model:` re-pins the chunk's model on the
# hop. The target binds by name when taken, so a target not yet minted warns at mint, not
# errors. The full authoring contract lives in `blizzard-context:/domain/graphs.md`. This
# default graph uses no cross-graph targets.
#
# Operational metadata is NOT authored here. The retire/re-enable lifecycle (issue
# #101) is set after mint via POST /graphs/{id}/retire|enable, an append-only fact —
# this graph's row is never touched. The broader auto_migrate/migration_target
# surface (P7) remains out of scope beyond that lifecycle.

name: default-delivery
entry: build

# Named session pools (issue #144). Two lineages, both on the basic tier:
#
#   code  the mechanical build lineage, BOUNDED — it is the one that can accumulate
#         indefinitely across a review-fail loop.
#   gate  the cold-eyes review. No `rotate:` block: a gate is only ever reached through
#         `fresh:gate`, so its head is minted every entry and rotation never applies.
#
# A re-EXPRESSION of the lineages these nodes already had, not a re-shaping: `--resume
# <sid>` reuses the session id in place, so the members already share one session and
# every prior spelling resolved to the same value. What the pool adds is the bound and
# the tier pin. Declared here rather than inherited — a graph referencing a pool it does
# not declare is rejected at mint, and `graph_sync` would go red on first boot.
sessions:
  code:
    model: ["blizzard:basic"]
    rotate:
      # Harness INVOCATIONS, not node-steps: one node-step burns two or three.
      max_invocations: 30
      max_context_tokens: 300000
      max_transcript_bytes: 50000000
  gate:
    model: ["blizzard:basic"]

nodes:
  build:
    executor: runner
    prompt: ./prompts/build.md
    session: resume:code  # re-entered build resumes its OWN prior lineage, not the reviewer's
    produces:
      - {name: commit, kind: git_commit}  # the pushed branch(es); kind-matched, not name-matched
    judgement:
      prompt: ./prompts/build.judgement.md
      choices:
        pass:
          description: The work meets this node's criteria, committed and pushed.
          to: review
        fail:
          description: The work does not meet the criteria; the failure output is attached.
          to: build
          prompt_addendum: ./prompts/build.from-build.md
    retries:
      max: 2
      exhausted: escalate

  review:
    executor: runner
    prompt: ./prompts/review.md
    session: fresh:gate  # cold eyes for review; the default is resume
    produces:
      - review-findings  # asset artifact — carried back into build on a fail
    judgement:
      prompt: ./prompts/review.judgement.md
      choices:
        pass:
          description: The submitted work passes review and is ready to deliver.
          to: deliver
        fail:
          description: Review found blocking issues, recorded in the review-findings asset.
          to: build  # THE LOOP: the findings asset rides this edge back into build
          prompt_addendum: ./prompts/build.from-review.md
    retries:
      max: 2
      exhausted: escalate

  deliver:
    executor: hub
    run:
      - name: land-every-repo
        command: python3 -m blizzard.hub.graphs.scripts.land_default
    judgement:
      choices:
        landed:
          description: Every repo merged cleanly into its base branch.
          to: done
        conflict:
          description: A repo did not merge cleanly; kicked back to build with the bounce envelope.
          to: build
