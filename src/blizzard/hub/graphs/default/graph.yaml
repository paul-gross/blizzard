# The default workflow graph — a triage router, not a delivery lane.
#
# Every chunk ingested without an explicit graph pin lands here: `ensure_default`
# (POST /chunks) resolves the packaged doc by NAME, which is why the graph keeps the
# name `default-delivery` even though it no longer delivers — the name is the ingest
# default pin's resolution key, and superseded mints of it stay in the store for the
# chunks already pinned to them. This graph is the fleet's front door: one `triage`
# node reads the chunk's work items, verifies their premise against the environment's
# current code, and routes the chunk OUT — a cross-graph migration to the lane that
# fits, or straight to the `done` terminal when the work is already satisfied. Nothing
# is built, committed, or delivered from this graph itself.
#
# Routing is authored as graph content, on the two primitives the engine already has:
# a judgement choice whose `to:` names `graph:<name>` (a cross-graph MIGRATION target,
# issue #90 — late-bound by name when taken, `bzh:ids-exact-names-correlate`), and the
# reserved `done` terminal. Neither lane declares a `triage` node, so a migration lands
# at the target's entry — `bas-dwf`'s `build`, `adv-dwf`'s `plan` — per the landing
# rule in `blizzard-context:/domain/graphs.md`. The choice table is the extension
# point: a future lane is a new choice row and a re-mint, never an engine change.
#
# The packaged set reconciles in directory order (`packaged_graph_paths`, issue #146):
# `advanced-development-workflow` and `basic-development-workflow` sort before
# `default`, so both migration targets are minted before the graph that names them and
# the late-binding mint warning never fires on a fresh store.
#
# Conforms to the canonical authoring schema: fused choice/edge entries, prompts as
# file references inlined at mint, retries escaping to escalation. The full authoring
# contract lives in `blizzard-context:/domain/graphs.md`.

name: default-delivery
entry: triage

# One named pool (issue #144): the routing call is the only judgement this graph
# makes, and getting it wrong mis-lanes the whole chunk — so triage runs on the
# advanced tier, falling back to frontier (resolution is left-to-right; the tiers are
# unordered roles, so the fallback is author-written, never implicit). The node is
# never resumed: a routed chunk leaves this graph, and a re-entered triage after a
# retry wants clean context, not a stale read of the repo. The pool cannot share the
# node's own name (session and node names share one reference namespace), so it takes
# `gate` — the cold-eyes pool name the delivery lanes use.
sessions:
  gate:
    model: ["blizzard:advanced", "blizzard:frontier"]

nodes:
  triage:
    executor: runner
    prompt: ./prompts/triage.md
    session: fresh:gate  # every entry is a fresh cold read; rotation never applies
    produces:
      - triage-findings  # asset artifact — the routing decision and its evidence
    judgement:
      prompt: ./prompts/triage.judgement.md
      choices:
        already-done:
          description: Every work item's desired behavior already holds on the current base branch, with per-criterion evidence recorded in the triage-findings asset; the chunk closes without entering a lane.
          to: done
        basic:
          description: Small, well-specified work — a prompt, doc, or skill change, or a single well-anchored code change with clear acceptance criteria and no design decisions; migrates to the lightweight bas-dwf lane.
          to: graph:bas-dwf
        advanced:
          description: Work that warrants a plan — design or architecture decisions, multi-repo or schema changes, or vague acceptance criteria; migrates to the plan-gated adv-dwf lane.
          to: graph:adv-dwf
    retries:
      max: 2
      exhausted: escalate
