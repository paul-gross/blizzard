# The basic-harness-workflow graph — build -> review -> deliver -> retrospective, on one
# single linear track, at the frontier capability tier.
#
# Harness work — workspace skills, `blizzard-context` convention rules, graph prompts,
# agent docs, and other agent-capability surfaces — is the fleet's own operating rules:
# unusually high-leverage per token and judgement-heavy per line, so this lane runs on
# the strongest available model rather than the mechanical `blizzard:basic` tier the
# other lightweight lane (`bas-dwf`) pins. It is otherwise the SAME lightweight shape as
# `basic-development-workflow`, cut down one node further: no `pre-push` node at all.
#
# Why no pre-push: `bas-dwf` keeps one so a rejected fast-forward (the base moved) can be
# resolved by rebasing without re-earning verification — the point of that node is
# recovering from a moved base without disturbing an already-reviewed change. This lane
# is the user-stated minimum instead (issue #231): build, review, deliver, plus the
# closing retrospective every lane owes. A rejected fast-forward here routes straight
# back to `build` — the only station left that can rebase and revalidate — carrying the
# same "why you're back" context `bas-dwf`'s `pre-push.from-deliver.md` gives its own
# re-entry, just landing one node earlier.
#
# Like `bas-dwf`: no `plan` node (harness changes are prose-and-convention shaped; inline
# planning suffices) and no standalone `verify` node (`build` fuses build and
# verification into one node).
#
# Delivery is PR-free: `deliver` runs the packaged `land_ff` script, which fast-forwards
# each repo's base branch ref directly to the chunk's own commit instead of opening and
# merging a PR — no merge commit, so history stays linear.
#
# A landing closes on `retrospective`, same as `bas-dwf` — the lightweight lane is cut
# down on *gates*, not on learning from itself.
#
# Conforms to the canonical authoring schema: fused choice/edge entries, prompts as
# file references inlined at mint, retries escaping to escalation. Every prompt below
# is this graph's own copy, isolated in ./prompts — never shared with another graph's
# directory.

name: bas-hwf
entry: build

# Named session pools (issue #144), both pinned to the frontier tier — the whole point
# of this lane (issue #231). Two lineages:
#
#   code  the mechanical build lineage, BOUNDED — it is the one that can accumulate
#         indefinitely across a review-fail (or deliver-conflict) loop.
#   gate  the cold-eyes review. No `rotate:` block: a gate is only ever reached through
#         `fresh:gate`, so its head is minted every entry and rotation never applies.
#
# Declared here rather than inherited — a graph referencing a pool it does not declare
# is rejected at mint, and `graph_sync` would go red on first boot.
sessions:
  code:
    model: ["blizzard:frontier"]
    rotate:
      # Harness INVOCATIONS, not node-steps: one node-step burns two or three.
      max_invocations: 12
      # The conversation's SIZE at the next resume, not spend accumulated across it —
      # see `advanced-development-workflow` for where these three numbers come from.
      max_context_tokens: 300000
      max_transcript_bytes: 10000000
  gate:
    model: ["blizzard:frontier"]
  iteration:
    # The `iterate` node's own lineage, on the advanced tier — reads the code cold
    # rather than resuming `code`'s own build context, giving the fixer a lineage
    # that has not already argued with the reviewer. Named `iteration`, not `iterate`:
    # a session name colliding with a node name is a mint-time error.
    model: ["blizzard:advanced"]
    # code's three numbers, inherited as bounds for this lineage: it accumulates
    # across the review-fail loop the same way code does across a deliver-conflict one.
    rotate:
      max_invocations: 12
      max_context_tokens: 300000
      max_transcript_bytes: 10000000
  prepush:
    # The `pre-push` node's own lineage, on the advanced tier — it accumulates across
    # the deliver-conflict loop the same way `iteration` accumulates across review-fail.
    model: ["blizzard:advanced"]
    # code's three numbers again, inherited as bounds rather than re-derived for this
    # lineage.
    rotate:
      max_invocations: 12
      max_context_tokens: 300000
      max_transcript_bytes: 10000000

nodes:
  build:
    executor: runner
    prompt: ./prompts/build.md
    session: resume:code  # explicit: re-entry from review/deliver should pull build's
      # own prior context, not whichever node ran last (review is deliberately fresh, so
      # bare `resume` would otherwise hand build its cold-read session instead of its own)
    produces:
      - {name: commit, kind: git_commit}  # the pushed branch(es); kind-matched, not name-matched
    judgement:
      prompt: ./prompts/build.judgement.md
      choices:
        pass:
          description: The work meets the item's intent, committed and pushed.
          to: review
        fail:
          description: The work does not yet meet the criteria; the failure output is attached.
          to: build
          prompt_addendum: ./prompts/build.from-build.md
    retries:
      max: 2
      exhausted: escalate

  review:
    executor: runner
    prompt: ./prompts/review.md
    session: fresh:gate  # cold eyes for review; the default is resume
    produces:
      - review-findings  # asset artifact — carried back into iterate on a fail
    judgement:
      prompt: ./prompts/review.judgement.md
      choices:
        pass:
          description: The submitted work passes review and is ready for the pre-push integration step.
          to: pre-push
        fail:
          description: Review found blocking issues, recorded in the review-findings asset.
          to: iterate  # THE LOOP: the findings asset rides this edge back into iterate
          prompt_addendum: ./prompts/iterate.from-review.md
    retries:
      max: 2
      exhausted: escalate

  iterate:
    executor: runner
    prompt: ./prompts/iterate.md
    session: resume:iteration  # explicit: the review-fail loop's own lineage,
      # separate from build's — a fixer that has not already argued with the reviewer
    produces:
      # The refutation channel (see prompts/iterate.from-review.md): review findings
      # this node declines rather than fixes, with the argument. `review` is a fresh
      # cold read every pass, so without this it re-raises a deliberately declined
      # finding forever; it now must accept or reject each refutation explicitly.
      - review-finding-refutes
      - {name: commit, kind: git_commit}  # the pushed branch(es); kind-matched, not name-matched
    judgement:
      prompt: ./prompts/iterate.judgement.md
      choices:
        pass:
          description: Every review finding is answered — fixed or refuted on the record — committed and pushed.
          to: review
        fail:
          description: The findings are not yet fully answered; the failure output is attached.
          to: iterate
          prompt_addendum: ./prompts/iterate.from-iterate.md
    retries:
      max: 2
      exhausted: escalate

  pre-push:
    executor: runner
    prompt: ./prompts/pre-push.md
    session: resume:prepush  # its own lineage — accumulates across the
      # deliver-conflict loop, distinct from `code` and `iteration`
    produces:
      - pre-push-summary
      - retrospective
      # A rebase REWRITES the branch, so the commit build (or iterate) declared is
      # orphaned the moment this node runs. Re-declaring here is what lets `deliver`
      # fast-forward to the rebased tip instead of the stale one it can never
      # fast-forward to.
      - {name: commit, kind: git_commit}
    judgement:
      prompt: ./prompts/pre-push.judgement.md
      choices:
        clean:
          description: The rebase applied with no conflicts (or trivial mechanical ones) and the read-back holds.
          to: deliver
        insignificant:
          description: Conflicts were resolved without semantic choices; the rebased result re-enters review for cold eyes.
          to: review
          prompt_addendum: ./prompts/review.from-pre-push.md
        significant:
          description: Conflict resolution required semantic choices (or the rebase reshaped the change); with no verify node in this lane, the work re-enters iterate to revalidate.
          to: iterate
          prompt_addendum: ./prompts/iterate.from-pre-push.md
    retries:
      max: 2
      exhausted: escalate

  deliver:
    executor: hub
    run:
      - name: land-every-repo
        command: python3 -m blizzard.hub.graphs.scripts.land_ff
    judgement:
      choices:
        landed:
          description: Every repo's base branch ref fast-forwarded cleanly to this chunk's commit; the chunk closes with a retrospective.
          to: retrospective
        conflict:
          description: A repo did not fast-forward cleanly (the base moved out from under it); returned to pre-push to rebase against the base as it now stands, not to build.
          to: pre-push
          prompt_addendum: ./prompts/pre-push.from-deliver.md
        failure:
          description: land_ff itself failed or crashed (a missing env var, an unauthorized or failed marker write) rather than reporting a clean outcome; this lane has no resolve node, so it returns to pre-push — the same recovery point as conflict — to diagnose and retry without discarding the validated spine.
          to: pre-push
          prompt_addendum: ./prompts/pre-push.from-deliver.md

  retrospective:
    executor: runner
    prompt: ./prompts/retrospective.md
    session: resume:prepush  # explicit: `deliver` is a script node with no session,
      # so the chunk's most-recent session is `pre-push`'s own. Unlike `bas-dwf`, that
      # lineage never saw build or iterate — it only ever entered cold — so this node
      # leans on the chunk's asset trail and `chunk history`, not on lineage memory.
    produces:
      - retrospective
    judgement:
      prompt: ./prompts/retrospective.judgement.md
      choices:
        recorded:
          description: The retrospective is written as the retrospective asset and the workspace's post-delivery work is done; the work is complete.
          to: done
    retries:
      max: 1
      exhausted: escalate
