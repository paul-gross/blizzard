# The basic-development-workflow graph — build -> review -> pre-push -> deliver ->
# retrospective, on one single linear track.
#
# This is the LIGHTWEIGHT lane, deliberately cut down from
# advanced-development-workflow's shape: no `plan` or `plan-review` node — small work
# should not pay for a planning phase, and `build` licenses inline planning instead
# (the worker may think an approach through as part of building; no plan artifact is
# produced and nothing waits on one). There is also no standalone `verify` node:
# `build` fuses build and verification into one node — validate and satisfy the
# item's intent before declaring done, full stop.
#
# Because there is no `verify` node, `pre-push`'s three-way severity triage (mirroring
# advanced-development-workflow's clean/insignificant/significant judgement) differs
# from that graph's in exactly one edge: where its `significant` outcome (conflict
# resolution that required semantic choices) re-earns verification, this graph's
# `significant` routes to `build` instead — the only node left that can revalidate
# the change. `insignificant`
# still rides back into `review` for cold eyes, and `clean` proceeds straight to
# delivery.
#
# Delivery is PR-free: `deliver` runs the packaged `land_ff` script, which fast-forwards
# each repo's base branch ref directly to the chunk's own commit instead of opening and
# merging a PR — no merge commit, so history stays linear. A rejected fast-forward
# (the base moved out from under the chunk) reports `conflict`, routed back to
# `pre-push` — NOT to `build`. That edge is the point of having a pre-push node at all:
# a rejected fast-forward means the base moved, not that the work is wrong, so the
# recovery is to rebase again, not to rebuild a change that already passed review.
# `pre-push` re-triages and returns to delivery; the hub node's bounce_cap bounds the
# loop if the base keeps moving under it.
#
# A landing closes on `retrospective`, the same post-delivery node
# advanced-development-workflow ends on — the lightweight lane is cut down on *gates*,
# not on learning from itself, and the harness/context improvements a retrospective
# names are worth strictly more from the lane that runs most often. It differs from that
# graph's in one way: this lane's nodes carry no per-node `retrospective` diary to
# synthesize (adding one to every node is exactly the per-node overhead this lane exists
# to avoid), so the node reconstructs the journey from the assets the chunk did produce
# — review-findings, the pre-push summary, the bounces — plus its own resumed session.
#
# Conforms to the canonical authoring schema: fused choice/edge entries, prompts as
# file references inlined at mint, retries escaping to escalation. Every prompt below
# is this graph's own copy, isolated in ./prompts — never shared with another graph's
# directory.

name: bas-dwf
entry: build

# Named session pools (issue #144). Two lineages, both on the basic tier:
#
#   code  the mechanical build lineage, BOUNDED — it is the one that can accumulate
#         indefinitely across a review-fail loop.
#   gate  the cold-eyes review. No `rotate:` block: a gate is only ever reached through
#         `fresh:gate`, so its head is minted every entry and rotation never applies.
#
# A re-EXPRESSION of the lineages these nodes already had, not a re-shaping: `--resume
# <sid>` reuses the session id in place, so the members already share one session and
# every prior spelling resolved to the same value. What the pool adds is the bound and
# the tier pin. Declared here rather than inherited — a graph referencing a pool it does
# not declare is rejected at mint, and `graph_sync` would go red on first boot.
sessions:
  code:
    model: ["blizzard:basic"]
    rotate:
      # Harness INVOCATIONS, not node-steps: one node-step burns two or three.
      max_invocations: 12
      # The conversation's SIZE at the next resume, not spend accumulated across it —
      # see `advanced-development-workflow` for where these three numbers come from.
      max_context_tokens: 300000
      max_transcript_bytes: 10000000
  gate:
    model: ["blizzard:basic"]

nodes:
  build:
    executor: runner
    prompt: ./prompts/build.md
    session: resume:code  # explicit: re-entry from review/pre-push should pull
      # build's own prior context, not whichever node ran last (review/pre-push
      # are deliberately fresh, so bare `resume` would otherwise hand build their
      # cold-read session instead of its own)
    produces:
      # The refutation channel (see prompts/build.from-review.md): review findings the
      # build declines rather than fixes, with the argument. `review` is a fresh cold read
      # every pass, so without this it re-raises a deliberately declined finding forever;
      # it now must accept or reject each refutation explicitly.
      - review-finding-refutes
      - {name: commit, kind: git_commit}  # the pushed branch(es); kind-matched, not name-matched
    judgement:
      prompt: ./prompts/build.judgement.md
      choices:
        pass:
          description: The work meets the item's intent, committed and pushed.
          to: review
        fail:
          description: The work does not yet meet the criteria; the failure output is attached.
          to: build
          prompt_addendum: ./prompts/build.from-build.md
    retries:
      max: 2
      exhausted: escalate

  review:
    executor: runner
    prompt: ./prompts/review.md
    session: fresh:gate  # cold eyes for review; the default is resume
    produces:
      - review-findings  # asset artifact — carried back into build on a fail
    judgement:
      prompt: ./prompts/review.judgement.md
      choices:
        pass:
          description: The submitted work passes review and is ready for the pre-push integration step.
          to: pre-push
        fail:
          description: Review found blocking issues, recorded in the review-findings asset.
          to: build  # THE LOOP: the findings asset rides this edge back into build
          prompt_addendum: ./prompts/build.from-review.md
    retries:
      max: 2
      exhausted: escalate

  pre-push:
    executor: runner
    prompt: ./prompts/pre-push.md
    session: resume:code  # integration is mechanical (rebase, lint, targeted
      # tests), not a judgement call needing cold eyes — build's own context
      # saves re-learning the codebase from scratch; the default is resume
    produces:
      - pre-push-summary
      # A rebase REWRITES the branch, so the commit `build` declared is orphaned the
      # moment this node runs. Re-declaring here is what lets `deliver` fast-forward to
      # the rebased tip instead of the stale one it can never fast-forward to.
      - {name: commit, kind: git_commit}
    judgement:
      prompt: ./prompts/pre-push.judgement.md
      choices:
        clean:
          description: The rebase applied with no conflicts (or trivial mechanical ones) and lint plus the targeted unit tests are green.
          to: deliver
        insignificant:
          description: Conflicts were resolved without semantic choices; the rebased result re-enters review for cold eyes.
          to: review
          prompt_addendum: ./prompts/review.from-pre-push.md
        significant:
          description: Conflict resolution required semantic choices (or the rebase reshaped the change); with no verify node in this lane, the work re-enters build to revalidate.
          to: build
          prompt_addendum: ./prompts/build.from-pre-push.md
    retries:
      max: 2
      exhausted: escalate

  deliver:
    executor: hub
    run:
      - name: land-every-repo
        command: python3 -m blizzard.hub.graphs.scripts.land_ff
    judgement:
      choices:
        landed:
          description: Every repo's base branch ref fast-forwarded cleanly to this chunk's commit; the chunk closes with a retrospective.
          to: retrospective
        conflict:
          description: A repo did not fast-forward cleanly (the base moved out from under it); returned to pre-push to rebase against the base as it now stands, not to build.
          to: pre-push
          prompt_addendum: ./prompts/pre-push.from-deliver.md
        failure:
          description: land_ff itself failed or crashed (a missing env var, an unauthorized or failed marker write) rather than reporting a clean outcome; this lane has no resolve node, so it returns to pre-push — the same recovery point as conflict — to diagnose and retry without discarding the validated spine.
          to: pre-push
          prompt_addendum: ./prompts/pre-push.from-deliver.md

  retrospective:
    executor: runner
    prompt: ./prompts/retrospective.md
    session: resume  # the default, spelled out: `deliver` is a script node with no
      # session, so the chunk's most-recent session is pre-push's — which is build's
      # own (pre-push is `resume:build`). That is the session holding the whole
      # journey, which is exactly what a retrospective synthesizes.
    produces:
      - retrospective
    judgement:
      prompt: ./prompts/retrospective.judgement.md
      choices:
        recorded:
          description: The retrospective is written as the retrospective asset and the workspace's post-delivery work is done; the work is complete.
          to: done
    retries:
      max: 1
      exhausted: escalate
