# The advanced-development-workflow graph — plan -> plan-review -> build -> verify ->
# review -> pre-push -> deliver, on one single linear track.
#
# Modeled on the winter-workflow `glacier` skill: adopt-or-produce a plan gated on the
# verifiability matrix and architecture guidance, build the phases strictly in order,
# close the build with the verify finale, cold multi-axes review, then a pre-push
# rebase: rebase every ahead repo onto the current base branch, resolve conflicts
# inside the rebase, run lint plus judgement-scoped unit tests, and triage severity —
# clean proceeds to delivery, insignificant conflicts re-enter review, semantic
# conflict resolutions re-earn verification. Every backward edge carries its
# findings asset into the node it re-enters — a bounce is contention, not failure.
# Delivery is authored as graph content: `deliver` is a generic hub command node
# running the packaged land_pr_ci script — the PR + CI-watch delivery policy, which
# polls until every PR is cleanly mergeable rather than merging straight through as
# the default graph's land_default does.

name: adv-dwf
entry: plan

# Named session pools (issue #144). Three lineages, each with its own capability tier:
#
#   planning  the plan node's own long-running context, on the advanced tier — authoring
#             a plan against the verifiability matrix and architecture guidance is the
#             judgement-heaviest work this graph does.
#   code      the mechanical build lineage — build -> verify -> pre-push -> resolve — on
#             the basic tier and BOUNDED, since it is the one lineage that can accumulate
#             indefinitely across a review-fail loop.
#   gate      the two cold-eyes gates, on the basic tier. No `rotate:` block: a gate is
#             only ever reached through `fresh:gate`, so its head is minted every entry
#             and rotation never applies.
#
# This is a re-EXPRESSION of the lineages these nodes already had, not a re-shaping of
# them. Naming `code` changes nothing about which session each member continues:
# `--resume <sid>` reuses the session id in place (forking is opt-in and never used), so
# build/verify/pre-push/resolve already share ONE session id today — `resume:build`,
# bare `resume`, `resume:verify` and `resume:pre-push` all resolve to the same value.
# What the pool adds is the bound and the tier pin.
#
# Deliberately NOT the issue's illustrative YAML, which shows `plan`/`build` on
# `fresh:<name>`. `fresh:` mints on EVERY entry, so transcribing it would re-enter `plan`
# with no memory of authoring the plan and `build` cold after a review-fail — silently
# reverting the deliberate `resume:<node>` decisions the comments below still carry. The
# `rotate:` thresholds supply the bounding `fresh:` was standing in for.
sessions:
  planning:
    model: ["blizzard:advanced"]
    effort: high
  code:
    model: ["blizzard:basic"]
    rotate:
      # Harness INVOCATIONS, not node-steps: one node-step burns two or three (a spawn
      # plus a judge, plus any nudge), so this is roughly ten node-steps, not thirty.
      max_invocations: 30
      max_context_tokens: 300000
      max_transcript_bytes: 50000000
  gate:
    model: ["blizzard:basic"]

nodes:
  plan:
    executor: runner
    prompt: ./prompts/plan.md
    session: resume:planning  # explicit: a must-fix loop-back from plan-review (fresh)
      # would otherwise hand plan the gate's cold-read session via bare resume
      # instead of its own prior drafting context
    produces:
      - plan
      - retrospective
    judgement:
      prompt: ./prompts/plan.judgement.md
      choices:
        drafted:
          description: The plan and its ordered phases are written and ready for the gate.
          to: plan-review
    retries:
      max: 2
      exhausted: escalate

  plan-review:
    executor: runner
    prompt: ./prompts/plan-review.md
    session: fresh:gate  # cold eyes for the gate; the default is resume
    produces:
      - plan-findings
      - retrospective
    judgement:
      prompt: ./prompts/plan-review.judgement.md
      choices:
        pass:
          description: The plan clears the verifiability and architecture gates with no must-fix findings.
          to: build
        must-fix:
          description: The gate found blocking findings, recorded in the plan-findings asset.
          to: plan
          prompt_addendum: ./prompts/plan.from-plan-review.md
    retries:
      max: 2
      exhausted: escalate

  build:
    executor: runner
    prompt: ./prompts/build.md
    session: resume:code  # explicit: loop-backs arrive from verify/review/resolve
      # (all non-build sessions); bare resume would hand build whichever of
      # those ran last instead of its own coding context
    produces:
      - retrospective
      - {name: commit, kind: git_commit}  # the pushed branch(es); kind-matched, not name-matched
    judgement:
      prompt: ./prompts/build.judgement.md
      choices:
        pass:
          description: Every phase is implemented in order, committed and pushed.
          to: verify
        fail:
          description: The work does not yet meet the plan; the failure output is attached.
          to: build
          prompt_addendum: ./prompts/build.from-build.md
    retries:
      max: 3  # this graph's per-phase hard cap
      exhausted: escalate

  verify:
    executor: runner
    prompt: ./prompts/verify.md
    session: resume:code  # was bare `resume`, which already resolved to this same
      # lineage — named so the whole mechanical track shares one bounded, tier-pinned
      # pool rather than two spellings of the same thing
    produces:
      - verification-report
      - retrospective
    judgement:
      prompt: ./prompts/verify.judgement.md
      choices:
        pass:
          description: The change verified end to end through declared matrix methods.
          to: review
        fail:
          description: Verification surfaced failures the finale could not close, recorded in the verification-report asset.
          to: build
          prompt_addendum: ./prompts/build.from-verify.md
    retries:
      max: 2
      exhausted: escalate

  review:
    executor: runner
    prompt: ./prompts/review.md
    session: fresh:gate
    produces:
      - review-findings
      - retrospective
    judgement:
      prompt: ./prompts/review.judgement.md
      choices:
        pass:
          description: The work passes the multi-axes review with no blocking findings.
          to: pre-push
        fail:
          description: Review found blocking issues, recorded in the review-findings asset.
          to: build
          prompt_addendum: ./prompts/build.from-review.md
    retries:
      max: 2
      exhausted: escalate

  pre-push:
    executor: runner
    prompt: ./prompts/pre-push.md
    session: resume:code  # integration is mechanical (rebase, lint, targeted
      # tests), not a judgement call — the `code` lineage already carries build's
      # context plus whatever gaps verify itself closed
    produces:
      - pre-push-summary
      - retrospective
      # A rebase REWRITES the branch, so the commit `build` declared is orphaned the
      # moment this node runs. Re-declaring here is what lets `deliver` fast-forward to
      # the rebased tip instead of the stale one it can never fast-forward to.
      - {name: commit, kind: git_commit}
    judgement:
      prompt: ./prompts/pre-push.judgement.md
      choices:
        clean:
          description: The rebase applied with no conflicts (or trivial mechanical ones) and lint plus the targeted unit tests are green.
          to: deliver
        insignificant:
          description: Conflicts were resolved without semantic choices; the rebased result re-enters review for cold eyes.
          to: review
          prompt_addendum: ./prompts/review.from-pre-push.md
        significant:
          description: Conflict resolution required semantic choices or the rebase reshaped the change; the work re-earns its verification.
          to: verify
          prompt_addendum: ./prompts/verify.from-pre-push.md
    retries:
      max: 2
      exhausted: escalate

  deliver:
    executor: hub
    run:
      - name: land-every-repo
        command: python3 -m blizzard.hub.graphs.scripts.land_pr_ci
    # land_pr_ci reports the reserved `pending` outcome while any PR is `unstable`/
    # `unknown`/not-yet-clean, so a transient forge state polls in place (freeing the
    # fleet-wide hub slot between polls) instead of bouncing validated work to build.
    # A PR that NEVER goes clean within poll_timeout, a crash of the land script itself,
    # or a `blocked`/`unstable` PR whose check run has already completed with a terminal
    # conclusion (routed immediately, without waiting out poll_timeout — issue #232) all
    # route the authored `failure` edge, and that lands on `resolve`, not `build`: a merge
    # conflict invalidates none of verify/review/pre-push.
    poll_interval: 30
    poll_timeout: 1800
    judgement:
      choices:
        landed:
          description: Every repo's PR merged cleanly into its base branch; the chunk closes with a retrospective.
          to: retrospective
        failure:
          description: poll_timeout exceeded with a repo never going cleanly mergeable, or the land script crashed; routed to resolve to diagnose and repair without discarding the validated spine.
          to: resolve

  resolve:
    executor: runner
    prompt: ./prompts/resolve.md
    session: resume:code  # mechanical (base-merge, transient CI/forge blip),
      # not a judgement call — deliver is a script node with no session, so the
      # `code` lineage is the closest context holding the branch/rebase history
    produces:
      - resolve-report
      - retrospective
      # `resolved` routes straight back to `deliver`, and clearing a delivery blocker
      # (a base-merge, a re-push) moves the branch — so this node re-declares its tip for
      # the same reason `pre-push` does.
      - {name: commit, kind: git_commit}
    judgement:
      prompt: ./prompts/resolve.judgement.md
      choices:
        resolved:
          description: The blocker was mechanical — a base-merge with no semantic choices, a transient forge/CI state, or an infra crash; the change's semantics are untouched and delivery retries.
          to: deliver
        substantive:
          description: Resolving the conflict required semantic choices; the change re-earns its verification before delivering again.
          to: verify
        broken:
          description: The PR never went clean because CI exposed a real defect in the change itself; kicked back to build with the resolve-report findings.
          to: build
          prompt_addendum: ./prompts/build.from-resolve.md
    retries:
      max: 2
      exhausted: escalate

  retrospective:
    executor: runner
    prompt: ./prompts/retrospective.md
    produces:
      - retrospective
    judgement:
      prompt: ./prompts/retrospective.judgement.md
      choices:
        recorded:
          description: The retrospective is written as the retrospective asset; the work is complete.
          to: done
    retries:
      max: 1
      exhausted: escalate
