# The advanced-development-workflow graph — plan -> plan-review -> build -> verify ->
# review -> pre-push -> deliver, on one single linear track.
#
# The heavyweight lane: adopt-or-produce a plan gated on the project's declared
# verification methods and architecture guidance, build the phases strictly in order,
# close the build with the verify finale, cold multi-axes review, then a pre-push
# rebase: rebase every ahead repo onto the current base branch, resolve conflicts
# inside the rebase, run lint plus judgement-scoped unit tests, and triage severity —
# clean proceeds to delivery, insignificant conflicts re-enter review, semantic
# conflict resolutions re-earn verification. The plan gate folds its own
# improvement-tier findings into the reviewed-plan it publishes — the asset build
# implements — and bounces to plan only on must-fix. Every backward edge carries its
# findings asset into the node it re-enters — a bounce is contention, not failure.
# Delivery is authored as graph content: `deliver` takes the packaged `land`
# action. The PR + CI-watch delivery policy is in
# blizzard-context:/workflows/feature-delivery.md.

name: adv-dwf
entry: plan

# Named session pools, each with its own capability tier:
#
#   planning      the plan node's own long-running context, on the advanced tier —
#                 authoring a plan against the project's declared verification methods
#                 and architecture guidance is the judgement-heaviest work this graph
#                 does.
#   code          the build lineage — `build` alone — on the basic tier and BOUNDED,
#                 since it accumulates across every review-fail loop.
#   integration   the integration lineage — pre-push -> resolve — on the basic tier and
#                 bounded with `code`'s numbers. Held apart from `code` because every
#                 resume re-reads the whole lineage: pre-push read ~281 cache tokens per
#                 output token resuming the build conversation, against far less on the
#                 cold-started `prepush` pool of basic-harness-workflow. What the cold
#                 lineage needs reaches it through the reviewed-plan, the commit messages,
#                 and the diff rather than through the build conversation.
#   verification  the verify finale's own lineage, on the basic tier and bounded the same
#                 way. Held apart from `code` because `build` is always the later node in
#                 the build/verify/review cycle: on one shared id every build resume
#                 re-reads the preceding verify's whole transcript, and one measured
#                 `build` cost $7.74 entering at 128k context against $22.24 entering at
#                 276k. What verify establishes still reaches the nodes that need it —
#                 through the verification-report asset and the `fail` edge's prompt
#                 addendum — rather than through a shared conversation.
#   gate          the two cold-eyes gates, on the basic tier. No `rotate:` block: a gate
#                 is only ever reached through `fresh:gate`, so its head is minted every
#                 entry and rotation never applies.
#   retro         the closing retrospective, on the advanced tier and fresh every entry,
#                 so no `rotate:` block either. The pool pins the tier every entry. The node
#                 synthesizes the per-node `retrospective` diaries and the asset trail, not
#                 a resumed conversation.
#
# A pool bounds and tier-pins a lineage; it does not fork one. `--resume <sid>` reuses the
# session id in place (forking is opt-in and never used), so every member of a pool
# continues the one head the pool holds — which is why `build` re-entered after a
# review-fail still resumes its own prior build turns.
#
# Deliberately NOT `fresh:<name>` on `plan`/`build`. `fresh:` mints on EVERY entry, so it
# would re-enter `plan` with no memory of authoring the plan and `build` cold after a
# review-fail. The `rotate:` thresholds supply the bounding instead.
sessions:
  planning:
    model: ["blizzard:advanced"]
    effort: high
    # `planning` carries no `rotate:` block, so the window is the only bound on its context:
    # the plan node's long-running lineage shrinks at the ceiling rather than climbing
    # unchecked toward the model maximum.
    compaction_window: "450000"
  code:
    model: ["blizzard:basic"]
    # Above `rotate.max_context_tokens`, so rotation bounds a lineage and the window is a
    # ceiling; see docs/deployment/worker-spawn.md §Compaction windows.
    compaction_window: "450000"
    # All three numbers are set from the same measured distribution — 757 fleet sessions,
    # every figure below observed rather than assumed.
    rotate:
      # Harness INVOCATIONS, not node-steps: one node-step burns two or three (a spawn
      # plus a judge, plus an occasional resume), so this is roughly five node-steps, not twelve.
      # Observed p99 is 10 and the most any session ever reached is 21, so this bounds the
      # tail without touching the body — but it IS the bound that rotates a real lineage
      # first, since `code` is `build` alone and accumulates across every review-fail loop.
      max_invocations: 12
      # The context the next resume starts from, in tokens — measured off the pool head's
      # last main-chain turn, so it is the conversation's SIZE, not spend accumulated
      # across it. Sits around the 93rd percentile of observed session context: an
      # outlier cut, not routine churn.
      max_context_tokens: 300000
      # The main transcript file, sidecars excluded — the same quantity `max_context_tokens`
      # measures, since a resume re-reads neither a subagent's context nor its bytes. A
      # backstop under the context bound rather than a peer of it: bytes track context only
      # loosely, and the largest main file ever observed is 5.2MB, so this is ~2x the tail.
      max_transcript_bytes: 10000000
  integration:
    model: ["blizzard:basic"]
    compaction_window: "450000"
    # `code`'s three numbers, unchanged: only the context differs, not the tier.
    rotate:
      max_invocations: 12
      max_context_tokens: 300000
      max_transcript_bytes: 10000000
  verification:
    model: ["blizzard:basic"]
    compaction_window: "450000"
    # `code`'s three numbers, inherited as backstops rather than derived for this
    # lineage: they were fit to combined build+verify sessions, and a one-member pool
    # will rarely reach them. Re-fit them off a verify-only slice when one exists.
    rotate:
      max_invocations: 12
      max_context_tokens: 300000
      max_transcript_bytes: 10000000
  gate:
    # The plan gate's fold stays basic-tier deliberately: it transcribes the gate's own
    # already-rendered findings into the plan text — editing, not authoring. The
    # judgement-heavy authoring stays in `planning`. It still carries no `rotate:` block:
    # `fresh:gate` mints its head on every entry, so rotation never applies. The window is
    # declared anyway — uniform across the pools, and inert here for the same reason,
    # since a freshly minted head has no long-lived context to reach it.
    model: ["blizzard:basic"]
    compaction_window: "450000"
  retro:
    # Fresh every entry, like `gate`: the window is inert here too.
    model: ["blizzard:advanced"]
    compaction_window: "450000"

# `docket` is this graph's own findings-docket definition — the format every plan-review/review
# finding and refutation restates.
#
# MAINTAINERS: a prompt restates the slice of this format its node needs, and a worker reads that
# restatement first — it retrieves the full docket only on request. So an edit to docket.md is not
# done until it has been carried into every prompt restating the affected slice; the prompt set is
# the census tests/test_adw_docket.py pins. This note lives here rather than in docket.md because
# docket.md is baked into the mint verbatim and reaches worker sessions, where maintainer
# bookkeeping is noise — YAML comments are dropped when the mint parses this file, so nothing here
# travels with it.
#
# On the `artifacts:` key itself, see
# https://github.com/paul-gross/blizzard/blob/master/docs/deployment/artifacts.md#graph-scoped-artifacts
artifacts:
  docket: ./docket.md

nodes:
  plan:
    executor: runner
    prompt: ./prompts/plan.md
    session: resume:planning  # explicit: a must-fix loop-back from plan-review (fresh)
      # would otherwise hand plan the gate's cold-read session via bare resume
      # instead of its own prior drafting context
    produces:
      - plan
      - branch  # asset artifact — the chunk's branch name, republished for every later reader
      # The refutation channel (see prompts/plan.from-plan-review.md): findings from a
      # prior plan-review round the plan declines rather than fixes, with the argument.
      # plan-review reads it before re-reviewing and must accept or reject each one
      # explicitly, so a declined finding stops costing a round every pass. Declared even
      # on a first draft, where it is one line saying nothing was refuted — an explicit
      # "nothing to refute" tells the gate the channel was considered; silence doesn't.
      - plan-finding-refutes
      - retrospective
    judgement:
      prompt: ./prompts/plan.judgement.md
      choices:
        drafted:
          description: The plan is written and ready for the gate, with its phases ordered when the work's scale called for phases.
          to: plan-review
    retries:
      max: 2
      exhausted: escalate

  plan-review:
    executor: runner
    prompt: ./prompts/plan-review.md
    session: fresh:gate  # cold eyes for the gate; the default is resume
    produces:
      - plan-findings
      # The plan of record as it leaves the gate (see prompts/plan-review.md): on
      # `acceptable` the gate folds its own improvement-tier findings into the plan and
      # publishes the result here — build implements this asset, not `plan`. On
      # `must-fix` the gate republishes the plan under review verbatim, unedited. A
      # distinct name rather than a second `plan`: the envelope keeps one artifact per
      # (name, producing node), so a second `plan` would turn every bare
      # `artifact get plan` into a 409.
      - reviewed-plan
      - retrospective
    judgement:
      prompt: ./prompts/plan-review.judgement.md
      choices:
        acceptable:
          description: The plan clears the verifiability and architecture gates with no must-fix finding; the gate's improvement-tier findings are folded into the published reviewed-plan asset, which build implements.
          to: build
        must-fix:
          description: The gate found blocking findings, recorded in the plan-findings asset.
          to: plan
          prompt_addendum: ./prompts/plan.from-plan-review.md
        unfulfillable:
          description: The plan carries a step or acceptance criterion no fleet worker can complete, and no operator answer can make it completable; the chunk escalates to a person.
          to: escalate
    retries:
      max: 2
      exhausted: escalate

  build:
    executor: runner
    prompt: ./prompts/build.md
    session: resume:code  # explicit: loop-backs arrive from verify/review/resolve
      # (all non-build sessions); bare resume would hand build whichever of
      # those ran last instead of its own coding context
    produces:
      - retrospective
      # The refutation channel (see prompts/build.from-review.md), mirroring plan's:
      # review findings the build declines rather than fixes, with the argument. `review`
      # is a fresh cold read every pass, so without this it re-raises a deliberately
      # declined finding forever; it must accept or reject each refutation explicitly.
      - review-finding-refutes
      - {name: commit, kind: git_commit}  # the pushed branch(es); kind-matched, not name-matched
    judgement:
      prompt: ./prompts/build.judgement.md
      choices:
        pass:
          description: The reviewed-plan is fully implemented — every phase in order where it is phased — committed and pushed.
          to: verify
        fail:
          description: The work does not yet meet the plan; the failure output is attached.
          to: build
          prompt_addendum: ./prompts/build.from-build.md
    retries:
      max: 3  # this graph's per-phase hard cap
      exhausted: escalate

  verify:
    executor: runner
    prompt: ./prompts/verify.md
    session: resume:verification  # its own lineage: a verify pass must not deposit
      # its transcript into the session `build` resumes next, and `build` is always
      # the later node in the build/verify/review cycle
    produces:
      - verification-report
      - retrospective
    judgement:
      prompt: ./prompts/verify.judgement.md
      choices:
        pass:
          description: The change verified end to end through verification methods the project declares.
          to: review
        fail:
          description: Verification surfaced failures the finale could not close, recorded in the verification-report asset.
          to: build
          prompt_addendum: ./prompts/build.from-verify.md
    retries:
      max: 2
      exhausted: escalate

  review:
    executor: runner
    prompt: ./prompts/review.md
    session: fresh:gate
    produces:
      - review-findings
      - review-finding-delta
      - retrospective
    judgement:
      prompt: ./prompts/review.judgement.md
      choices:
        pass:
          description: The work passes the multi-axes review and nothing blocks this round.
          to: pre-push
        fail:
          description: Review found findings that block this round, recorded in the review-findings asset.
          to: build
          prompt_addendum: ./prompts/build.from-review.md
    retries:
      max: 2
      exhausted: escalate

  pre-push:
    executor: runner
    prompt: ./prompts/pre-push.md
    session: resume:integration  # integration is mechanical (rebase, lint, targeted
      # tests), not a judgement call — it works from the branch and the reviewed-plan,
      # so it keeps its own lineage rather than re-reading the build conversation
    produces:
      - pre-push-summary
      - retrospective
      # A rebase REWRITES the branch, so the commit `build` declared is orphaned the
      # moment this node runs. Re-declaring here is what lets `deliver` open its PR
      # against the rebased tip instead of the stale, orphaned one.
      - {name: commit, kind: git_commit}
    judgement:
      prompt: ./prompts/pre-push.judgement.md
      choices:
        clean:
          description: The rebase applied with no conflicts (or trivial mechanical ones) and lint plus the targeted unit tests are green.
          to: deliver
        insignificant:
          description: Conflicts were resolved without semantic choices; the rebased result re-enters review for cold eyes.
          to: review
          prompt_addendum: ./prompts/review.from-pre-push.md
        significant:
          description: Conflict resolution required semantic choices or the rebase reshaped the change; the work re-earns its verification.
          to: verify
          prompt_addendum: ./prompts/verify.from-pre-push.md
    retries:
      max: 2
      exhausted: escalate

  deliver:
    executor: hub
    action: land
    # Outcome classification: src/blizzard/hub/delivery/actions/land.py;
    # this graph owns the outcome routes below.
    poll_interval: 60
    poll_timeout: 10800
    judgement:
      choices:
        landed:
          description: Every repo's PR merged cleanly into its base branch; routed to record-findings before the chunk closes with a retrospective.
          to: record-findings
        conflict:
          description: A repo's PR read dirty — a real merge conflict — routed immediately, without waiting out poll_timeout; sent to resolve to base-merge without discarding the validated verify/review/pre-push spine.
          to: resolve
        failure:
          description: A repo's check run completed with a terminal conclusion the base branch does not share on that check, poll_timeout exceeded with a repo never going cleanly mergeable, a PR head carrying a commit beyond the submitted one and its own base merges (a foreign advance), or the land pass itself raised; routed to resolve to diagnose and repair without discarding the validated spine.
          to: resolve
        inherited-failure:
          description: Every remaining check failure is inherited from the base branch and survived a one-time re-run; not this chunk's defect, so it routes straight to build to repair the base as its own commit, bypassing resolve entirely.
          to: build
          prompt_addendum: ./prompts/build.from-deliver.md

  resolve:
    executor: runner
    prompt: ./prompts/resolve.md
    session: resume:integration  # mechanical (base-merge, self-clearing forge state),
      # not a judgement call — deliver is a hub node with no session, so the
      # `integration` lineage, pre-push's, is the closest context holding the
      # branch/rebase history
    produces:
      - resolve-report
      - retrospective
      # `resolved` routes straight back to `deliver`, and clearing a delivery blocker
      # (a base-merge, a re-push) moves the branch — so this node re-declares its tip for
      # the same reason `pre-push` does.
      - {name: commit, kind: git_commit}
    judgement:
      prompt: ./prompts/resolve.judgement.md
      choices:
        resolved:
          description: The blocker was mechanical — a base-merge with no semantic choices, a self-clearing forge state that now reads mergeable with no red check on the head, or an infra crash; the change's semantics are untouched and delivery retries.
          to: deliver
        substantive:
          description: Resolving the conflict required semantic choices, or a foreign commit on the PR head was adopted as part of the change; the change re-earns its verification before delivering again.
          to: verify
        broken:
          description: The PR never went clean because CI exposed a defect — in the change itself, or a flaky test the re-run cleared; kicked back to build with the resolve-report findings.
          to: build
          prompt_addendum: ./prompts/build.from-resolve.md
    retries:
      max: 2
      exhausted: escalate

  record-findings:
    executor: hub
    action: record-findings
    # The record-findings action (src/blizzard/hub/delivery/actions/) owns materialization;
    # all outcomes below leave the delivery lane for retrospective.
    judgement:
      choices:
        recorded:
          description: The review round's deferred findings (if any) are durable, minted at this chunk's landing.
          to: retrospective
        invalid:
          description: The chunk's newest review-finding-delta artifact failed shape validation. Nothing was written; routed to retrospective to record that this round's deferred findings were lost.
          to: retrospective
          prompt_addendum: ./prompts/retrospective.from-record-findings.md
        failure:
          description: The record-findings action answered failure rather than a clean outcome — the record was refused because the chunk had moved past this visit, or the pass itself raised. Routed to retrospective to record that this round's deferred findings were lost.
          to: retrospective
          prompt_addendum: ./prompts/retrospective.from-record-findings.md

  retrospective:
    executor: runner
    prompt: ./prompts/retrospective.md
    session: fresh:retro
    produces:
      - retrospective
    judgement:
      prompt: ./prompts/retrospective.judgement.md
      choices:
        recorded:
          description: The retrospective is written as the retrospective asset; the work is complete.
          to: done
    retries:
      max: 2
      exhausted: escalate
