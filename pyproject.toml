[project]
name = "blizzard"
version = "0.1.0"
description = "Blizzard: the hub, the runner, and the CLI for orchestrating autonomous fleets of coding agents — one repo, one wheel."
requires-python = ">=3.12"
# The full dependency superset both daemons, the CLI, and the tooling will need
# is declared up-front so the parallel component builders (backend, frontend,
# CI) rarely touch this file (see ORCHESTRATION.md, P5 parallel-build protocol).
# Add a dep only when a component genuinely needs one that is missing here.
dependencies = [
    # HTTP surface + SSE — both daemons (hub, runner) are FastAPI apps served by
    # uvicorn; the CLI's client verbs are pure HTTP clients of those APIs.
    "fastapi>=0.142.0",
    "uvicorn[standard]>=0.32.0",
    # httpx backs FastAPI's TestClient and the CLI's daemon-API client verbs.
    "httpx>=0.27.0",
    # Persistence — the hub store and the runner store are SQLAlchemy over
    # sqlite (default) or postgres, held inside the portable surface
    # (bzh:sql-portable). Alembic drives the two independent migration trees,
    # applied manually through the CLI, never at daemon startup (bzh:manual-migrations).
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13.0",
    # CLI surface — the one `blizzard` binary, verbs namespaced by target.
    "click>=8.1.0",
    # Domain models and request/response schemas.
    "pydantic>=2.0.0",
    # Structured logging, per blizzard-context standards/logging.md
    # (bzh:structlog-logging).
    "structlog>=24.0.0",
    # Workflow-graph definitions are authored in YAML; the hub parses the
    # POST /graphs body and the packaged default graph.
    "pyyaml>=6.0",
    # OIDC `id_token` signature verification (issue #92) — RS256 via `cryptography`
    # (decision D1, epic #89). The same library backs #95's hub-signed runner JWTs, so
    # it is declared here rather than deferred to that phase.
    "pyjwt[crypto]>=2.9.0",
    # The secret store's AES-256-GCM sealing, imported directly by `hub/secrets/internal/`.
    "cryptography>=49.0.0",
    # `blizzard hub login`'s local session-token store (issue #96) — the
    # per-platform user config dir (`~/.config/blizzard/` on Linux) `sessions.json`
    # is written under.
    "platformdirs>=4.0.0",
    # Semver range parsing for a harness binding's admitted-version gate (blizzard#438) —
    # OpenCode's own `SpecifierSet` membership check, promoted from a transitive pytest
    # dependency to a declared runtime one now the runner itself imports it.
    "packaging>=24.0",
    # Fleet-trace export over OTLP http/protobuf, bound only behind `foundation/trace_export/internal/`.
    "opentelemetry-sdk>=1.45.0",
    # Decoded directly by the span receiver; also pulled in by the exporter.
    "opentelemetry-proto>=1.45.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    # Platform spans, bound only behind `foundation/platform_tracing/internal/`; exact pins
    # hold the emitted HTTP and database semconv versions still.
    "opentelemetry-instrumentation-httpx==0.66b0",
    "opentelemetry-instrumentation-sqlalchemy==0.66b0",
]

# The sqlite/systemd path stays lean by default (`bzh:sql-portable`) — the postgres
# driver is an opt-in extra, installed as `blizzard[postgres]` by the container image
# (packaging/docker/Dockerfile), which is the deployment shape that actually varies
# the store backend.
[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2.0",
]
# The egress export's Parquet binding (hub/egress/internal/parquet.py) — opt-in, so the
# default install stays lean; NDJSON needs nothing new.
egress = [
    "pyarrow>=25.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Pinned so `setup-uv` resolves a committed version instead of falling back to a
# live GitHub API lookup of the latest release — keep in sync with the `uv` pin
# in mise.toml, the local dev entrypoint.
[tool.uv]
required-version = "==0.11.21"

[tool.hatch.build.targets.wheel]
# The one wheel ships both daemons, the CLI, and the compiled frontend.
# Everything under src/blizzard rides along, including the embedded frontend
# assets under src/blizzard/static/{hub,runner} that the CI build fills before
# `uv build` (see src/blizzard/static/README.md).
packages = ["src/blizzard"]
# The frontend build output is a wheel-embedded asset CI fills, and those built
# files are gitignored (only the placeholder index.html is tracked). `artifacts`
# un-ignores the whole static tree so the real bundles ship in the wheel too. The
# packaged default workflow graph (YAML + prompt files) rides along too, so
# a fresh hub mints it with no authoring.
artifacts = ["src/blizzard/static/**/*", "src/blizzard/hub/graphs/**/*"]

# One binary, verbs namespaced by target. The hyphenated aliases are the
# systemd / `ps` entry points for the daemon `host` personalities.
[project.scripts]
blizzard = "blizzard.cli.main:blizzard"
blizzard-hub = "blizzard.hub.cli:hub"
blizzard-runner = "blizzard.runner.cli:runner"
# OpenAPI export: dumps the hub and runner specs to a stable path. The frontend's
# openapi-ts client generation and CI's client-drift check both consume it
# (bzh:generated-client).
blizzard-export-openapi = "blizzard.tools.openapi:main"
# Fails on a breaking change to the hub↔runner wire surface (bzh:fleet-wire-additive).
blizzard-wire-compat = "blizzard.tools.wire_compat:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    # Parallelizes the default unit+component suite (`-n auto` in the gate and
    # `mise run test`). The upper tiers (service, e2e, crash, journey) stay
    # serial — they self-manage daemons, ports, and fixture workspaces.
    "pytest-xdist>=3.6.0",
    "ruff>=0.8.0",
    "pyright>=1.1.380",
    # The e2e browser tier (blizzard-context verification/blizzard.md): the
    # `test_board_browser_e2e` scenario drives the served mission-control board through
    # a real Chromium via Playwright.
    # The browser binary itself is installed out of band (`uv run playwright install
    # chromium`); the e2e test skips cleanly when it is absent (see tests/e2e/conftest.py).
    "playwright>=1.49.0",
    # The ast-grep structural-gate channel (blizzard-context:bzh:domain-takes-objects) —
    # pinned exactly, since a rule's match set can shift across engine versions.
    "ast-grep-cli==0.45.3",
    # Resolves the egress extra for pyright and the Parquet tests.
    "pyarrow>=25.0.1",
    # Runs the published newest-copy views in tests/test_egress_contract.py; a hard dependency,
    # because a skipped run would pass the check without running it.
    "duckdb>=1.1.0",
]
# `mise run mutation` (blizzard:mutation) — never installed into .venv. mutmut pulls in
# textual, and through it rich, which `uv run` would otherwise leave in the default
# environment even after a single sync; the task runs it in its own project environment
# instead (mise.toml). Pinned exactly, like ast-grep-cli: scripts/mutation.py overrides a
# private mutmut.configuration.Config seam, and its config_fingerprint semantics, both of
# which can shift between releases.
mutation = [
    "mutmut==3.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# The verification tiers (blizzard-context verification/blizzard.md): the default
# run is unit + component; `-m component` selects the component tier alone.
markers = [
    "unit: one class or function in isolation",
    "component: a domain slice wired with real internal collaborators, doubles only at the seams",
    "e2e: the full acceptance loop against the live stack; skipped when services are absent",
    "crash_sweep: the kill-9 crash sweep — real subprocesses SIGKILLed at each registry point; skipped without BLIZZARD_CRASH_SWEEP=1",
    "service: a running daemon's HTTP API exercised from outside with the counterpart mocked; skipped when the mock fleet is absent",
    "journey: the capstone MVP acceptance-journey rehearsal — real host daemons, a mid-run reboot, and the human loop, end to end; skipped without BLIZZARD_JOURNEY=1",
]

[tool.mutmut]
# If a test reads a new non-Python repo file, add its path here.
# tests/repo_files.py guards reads (including during collection); Python files
# in src/ and tests/ are already copied by mutmut. scripts/mutation.py creates
# destination parent dirs itself (tests.repo_files.prepare_mutant_tree) before
# the first mutmut run — no manual step needed.
# scripts/mutation.py reads this list and layers each scope's own exclusions on top.
do_not_mutate = [
    "src/blizzard/*/store/migrations/versions/*",
]
# Applied to every mutmut-driven pytest invocation (stats collection and mutant runs
# alike); scripts/mutation.py layers a per-scope test-selection on top via
# pytest_add_cli_args_test_selection.
pytest_add_cli_args = ["-m", "unit"]
also_copy = [
    "pyproject.toml",
    "openapi",
    ".github/workflows/push.yml",
    ".github/workflows/release.yml",
    "contracts/cli",
    "contracts/egress",
    "contracts/sse",
    "contracts/traces",
    "packaging/docker",
    "packaging/systemd",
    "scripts/check-version-tag.sh",
    "scripts/image-tags.sh",
    "scripts/is-retryable-push-error.sh",
    "scripts/release-notes.sh",
    "scripts/restated-invariants.json",
    # These test-loaded Python scripts live outside mutmut's src/ and tests/ copies.
    "scripts/prose_spans.py",
    "scripts/restated_invariants.py",
    "scripts/mutation.py",
    "docs/deployment/transcripts.md",
    "docs/deployment/egress.md",
    "docs/deployment/tracing.md",
    "docs/versioning.md",
    "docs/deployment/install.md",
    "docs/deployment/chunk-operations/takeover.md",
    "docs/deployment/work-sources.md",
    "docs/deployment/human-auth.md",
    "docs/deployment/control-verbs.md",
    "docs/deployment/opencode-compatibility.md",
    "docs/deployment/worker-spawn.md",
    "docs/deployment/findings-and-proposals.md",
    "web/projects/fleet/src/lib/chunk-detail/chunk-escalation.ts",
    "web/angular.json",
    "src/blizzard/hub/system_artifacts/garden/finding-format.md",
    "src/blizzard/hub/system_artifacts/garden/proposal-format.md",
    "src/blizzard/hub/system_artifacts/review/finding-format.md",
    "src/blizzard/runner/harness/prompts/samples/winter/workspace-prompt.md",
    "README.md",
    "mise.toml",
    "src/blizzard/hub/graphs",
    "src/blizzard/runner/harness/contracts",
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[tool.ruff]
line-length = 120
target-version = "py312"
# Alembic migration scripts are generated from a template and follow Alembic's
# own conventions, not ours.
extend-exclude = ["src/blizzard/*/store/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "B008"]
"src/blizzard/*/store/migrations/env.py" = ["E402"]
